<title>L'aventure spécifique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* Layout: the 16:9 canvas fills the window; on phones the touch pad is laid over the bottom of the screen. */
:root{
  --bg:#ebe5ff;
  --bg-glow:#d6caff;
  --ink:#1d1442;
  --ink-soft:#5d5590;
  --hero:#3b0cad;
  --hero-deep:#1c0552;
  --on-hero:#ffffff;
  --key:#ffffff;
  --key-edge:#c4b6f2;
  --shadow:rgba(40,16,120,.32);
  --pad-alt:#ff8a3d;
  --pad-alt-deep:#b4541f;
  --pad-soft:#d3c8fa;
  --pad-soft-ink:#2a1d63;
  --pad-soft-deep:#a090e0;
  --font-display:'Young Serif',Georgia,'Times New Roman',serif;
  --font-ui:'Barlow Semi Condensed','Arial Narrow','Helvetica Neue',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110b24; --bg-glow:#23174d; --ink:#ece8ff; --ink-soft:#a59dd8;
    --hero:#5a2ee6; --hero-deep:#22077a; --on-hero:#ffffff;
    --key:#1f1844; --key-edge:#3c3274; --shadow:rgba(0,0,0,.6);
    --pad-alt:#ff8a3d; --pad-alt-deep:#a24a18;
    --pad-soft:#2a2158; --pad-soft-ink:#dcd5ff; --pad-soft-deep:#150e34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110b24; --bg-glow:#23174d; --ink:#ece8ff; --ink-soft:#a59dd8;
  --hero:#5a2ee6; --hero-deep:#22077a; --on-hero:#ffffff;
  --key:#1f1844; --key-edge:#3c3274; --shadow:rgba(0,0,0,.6);
  --pad-alt:#ff8a3d; --pad-alt-deep:#a24a18;
  --pad-soft:#2a2158; --pad-soft-ink:#dcd5ff; --pad-soft-deep:#150e34;
  color-scheme:dark;
}
html,body{height:100%; margin:0}
/* Plein écran : le jeu (16:9) remplit la fenêtre, sans cadre ; des bandes sombres comblent le reste si la fenêtre n'est pas en 16:9. */
body{
  box-sizing:border-box;
  background:#07041a;
  color:var(--ink);
  font-family:var(--font-ui);
  display:flex; align-items:center; justify-content:center;
  padding:0;
  overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
#game{
  display:block;
  width:min(100vw, 100vh * 16 / 9);
  width:min(100vw, 100dvh * 16 / 9);
  aspect-ratio:16/9;
  height:auto;
  touch-action:none;
  background:var(--hero-deep);
  outline:none;
}
/* les touches sont dans Paramètres > Commandes */
.legend{
  display:none !important;
  margin:0; display:flex; flex-wrap:wrap; justify-content:center; gap:6px 18px;
  font-size:15px; font-weight:500; color:var(--ink-soft);
}
.legend span{ display:inline-flex; align-items:center; gap:5px; }
kbd{
  font-family:var(--font-ui); font-weight:600; font-size:13px; line-height:1.5;
  color:var(--ink); background:var(--key);
  border:1px solid var(--key-edge); border-bottom-width:3px; border-radius:7px;
  padding:0 7px; min-width:12px; text-align:center;
}
#pad{ display:none; position:fixed; left:0; right:0; bottom:0; z-index:4; width:100%; opacity:.6; pointer-events:none; align-items:center; justify-content:space-between; gap:10px; }
#pad .cluster{ display:flex; gap:14px; align-items:center; }
#pad button{
  font-family:var(--font-display); font-size:22px; line-height:1;
  color:var(--on-hero); background:var(--hero);
  border:none; border-radius:50%; width:62px; height:62px;
  box-shadow:0 5px 0 var(--hero-deep);
  touch-action:none; cursor:pointer;
}
#pad button.big{ width:88px; height:88px; font-size:30px; }
#pad{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; padding:8px 16px 12px; box-sizing:border-box; }
#pad button.on{ transform:translateY(3px); filter:brightness(1.15); }
#pad button.alt{ background:var(--pad-alt); box-shadow:0 5px 0 var(--pad-alt-deep); }
#pad button.small{ width:44px; height:44px; font-size:14px; background:var(--pad-soft); color:var(--pad-soft-ink); box-shadow:0 4px 0 var(--pad-soft-deep); }
#pad button:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--hero-deep); }
#pad button.alt:active{ box-shadow:0 2px 0 var(--pad-alt-deep); }
#pad button.dashb{ width:52px; height:52px; font-size:24px; background:#e0a400; box-shadow:0 5px 0 #8a6200; }
#pad button.dashb:active{ box-shadow:0 2px 0 #8a6200; }
#pad button.small:active{ box-shadow:0 1px 0 var(--pad-soft-deep); }
#pad button:focus-visible{ outline:3px solid var(--bg-glow); outline-offset:3px; }
@media (hover:none), (pointer:coarse){
  #pad{ display:flex; }
  #pad button{ pointer-events:auto; }
}
/* Chapter select: a 3D stack of cards (like the recent-apps switcher of a phone), laid over the canvas.
   Everything inside .stage is in game units (640 x 360) and scaled to the canvas size. */
#chapters{position:fixed; left:0; top:0; width:0; height:0; overflow:hidden; z-index:2;
  opacity:0; pointer-events:none; transition:opacity .28s ease; touch-action:none; -webkit-user-select:none; user-select:none;}
#chapters.on{opacity:1; pointer-events:auto;}
#chapters .stage{position:absolute; left:0; top:0; width:640px; height:360px; transform-origin:0 0; font-family:var(--font-ui); color:#fff;}
#chapters .glow{position:absolute; left:150px; top:50px; width:340px; height:250px; border-radius:50%; background-color:var(--accent, #7b56ff);
  filter:blur(64px); opacity:.55; transition:background-color .5s ease; pointer-events:none;}
#chapters .back{position:absolute; left:14px; top:26px; height:24px; padding:0 12px 0 22px; border:0; border-radius:12px; cursor:pointer;
  font:600 13.5px/24px var(--font-ui); color:#8cc4ff; background:rgba(255,255,255,.09);}
#chapters .back::before{content:""; position:absolute; left:10px; top:8px; width:6px; height:6px; border:solid #8cc4ff; border-width:0 0 2px 2px; transform:rotate(45deg);}
#chapters .back:hover{background:rgba(255,255,255,.18);}
#chapters .head{position:absolute; left:0; right:0; top:22px; text-align:center; pointer-events:none; transition:opacity .2s;}
#chapters .head.dim{opacity:.12;}
#chapters .head b{display:block; font:400 21px/1.1 var(--font-display); text-shadow:0 2px 0 rgba(8,4,24,.5);}
#chapters .head span{display:inline-block; margin-top:3px; font-size:11.5px; font-weight:600; letter-spacing:.04em; color:var(--accent, #ffd54a); transition:color .5s;}
#chapters .deck{position:absolute; left:0; right:0; top:60px; height:226px; perspective:1000px; perspective-origin:50% 42%; cursor:grab;}
#chapters .deck.drag{cursor:grabbing;}
#chapters .card{position:absolute; left:252px; top:15px; width:136px; height:196px; border-radius:18px; overflow:hidden; cursor:pointer;
  background:linear-gradient(#21164c, #140d33); box-shadow:0 22px 34px -12px rgba(0,0,0,.75), 0 6px 12px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.13);
  will-change:transform, opacity; backface-visibility:hidden;}
#chapters .card canvas{display:block; width:136px; height:108px;}
#chapters .card.locked canvas{filter:grayscale(.65) brightness(.55);}
#chapters .badge{position:absolute; top:8px; right:8px; padding:2px 7px; border-radius:999px; font-size:9.5px; font-weight:700; line-height:14px;
  background:rgba(14,9,34,.78); color:#e9e2ff; box-shadow:0 2px 6px rgba(0,0,0,.35);}
#chapters .badge.done{background:#ffd54a; color:#3a2400;}
#chapters .badge.new{background:#3a9bff; color:#fff;}
#chapters .body{padding:7px 10px 0;}
#chapters .kick{font-size:8.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#chapters .name{margin-top:2px; font:400 15px/1.12 var(--font-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#chapters .tag{margin-top:3px; font-size:10px; line-height:1.2; color:#d2cbf6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-height:24px;}
#chapters .stat{position:absolute; left:10px; right:10px; bottom:7px; font-size:9.5px; font-weight:600; color:#9fe8b0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#chapters .card.locked .stat{color:#ff9aa8;}
#chapters .shade{position:absolute; inset:0; background:#0a0620; pointer-events:none;}
#chapters .ring{position:absolute; inset:0; border-radius:18px; pointer-events:none; opacity:0;
  box-shadow:inset 0 0 0 2px var(--c), 0 0 26px var(--c);}
#chapters .card.active .ring{animation:chPulse 2.4s ease-in-out infinite;}
@keyframes chPulse{0%,100%{opacity:.5} 50%{opacity:1}}
#chapters .play{position:absolute; left:50%; top:290px; transform:translateX(-50%); min-width:150px; height:34px; padding:0 22px; border:0; border-radius:17px; cursor:pointer;
  font:400 18px/34px var(--font-display); letter-spacing:.08em; color:#3a1600; overflow:hidden;
  background:linear-gradient(#ffe27a, #ff9a3c); box-shadow:0 4px 0 #b4541f, 0 0 22px rgba(255,180,80,.55); transition:transform .15s, filter .2s;}
#chapters .play::after{content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; transform:skewX(-20deg);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation:chShine 2.6s ease-in-out infinite;}
@keyframes chShine{0%,55%{left:-60%} 100%{left:140%}}
#chapters .play:hover{transform:translateX(-50%) scale(1.05);}
#chapters .play:active{transform:translateX(-50%) translateY(3px); box-shadow:0 1px 0 #b4541f;}
#chapters .play.locked{filter:grayscale(1) brightness(.75); box-shadow:0 4px 0 #444; }
#chapters .play.locked::after{display:none;}
#chapters .hint{position:absolute; left:0; right:0; bottom:7px; text-align:center; font-size:10.5px; color:#c9c1f0; pointer-events:none;}
/* admin login: a small password box over the game */
#admin{position:fixed; z-index:3; display:none; align-items:center; justify-content:center; background:rgba(10,6,28,.72); font-family:var(--font-ui);}
#admin.on{display:flex;}
#admin .box{width:min(86%, 330px); padding:18px 20px; border-radius:16px; background:#1a1140; color:#fff; box-shadow:0 20px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.14);}
#admin h3{margin:0 0 4px; font:400 22px var(--font-display);}
#admin p{margin:0 0 12px; font-size:13px; color:#c9c1f0;}
#admin input{box-sizing:border-box; width:100%; height:38px; padding:0 12px; border-radius:10px; border:1px solid #4a3d8a; background:#0e0826; color:#fff; font:600 16px var(--font-ui);}
#admin input:focus{outline:2px solid #ffd54a; outline-offset:1px;}
#admin .err{min-height:18px; margin-top:6px; font-size:12.5px; color:#ff8aa0;}
#admin .row{display:flex; gap:10px; justify-content:flex-end; margin-top:6px;}
#admin button{height:34px; padding:0 16px; border:0; border-radius:17px; font:700 14px var(--font-ui); cursor:pointer;}
#admin .ok{background:linear-gradient(#ffe27a, #ff9a3c); color:#3a1600;}
#admin .no{background:rgba(255,255,255,.12); color:#fff;}
@media (prefers-reduced-motion: reduce){
  #chapters .card.active .ring{animation:none; opacity:.85;}
  #chapters .play::after{animation:none; display:none;}
  #chapters .glow{transition:none;}
}
</style>

<canvas id="game" tabindex="0" aria-label="L'aventure spécifique, un jeu de plateforme : clavier ou boutons tactiles"></canvas>
<div id="chapters" aria-label="Choix du chapitre"><div class="stage"></div></div>
<div id="admin" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
  <div class="box">
    <h3 id="adminTitle">Connexion admin</h3>
    <p>Mot de passe pour tout débloquer (mode débogage).</p>
    <input type="password" aria-label="Mot de passe" autocomplete="off">
    <div class="err" aria-live="polite"></div>
    <div class="row"><button type="button" class="no">Annuler</button><button type="button" class="ok">Se connecter</button></div>
  </div>
</div>
<p class="legend">
  <span><kbd>A</kbd><kbd>D</kbd> bouger</span>
  <span><kbd>W</kbd><kbd>Espace</kbd> sauter</span>
  <span><kbd>J</kbd> tirer</span>
  <span><kbd>K</kbd> dash</span>
  <span><kbd>E</kbd> parler</span>
  <span><kbd>P</kbd> pause</span>
  <span><kbd>M</kbd> son</span>
</p>
<div id="pad">
  <div class="cluster">
    <button id="left" aria-label="Aller à gauche">◀</button>
    <button id="right" aria-label="Aller à droite">▶</button>
  </div>
  <button id="pause" class="small" aria-label="Pause">II</button>
  <div class="cluster">
    <button id="dash" class="alt dashb" aria-label="Dash">»</button>
    <button id="shoot" class="alt" aria-label="Tirer ou parler">●</button>
    <button id="jump" class="big" aria-label="Sauter">▲</button>
  </div>
</div>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const TAU = Math.PI * 2;
function hash(n){
  n = Math.imul((n | 0) ^ 0x5bd1e995, 0x85ebca6b);
  n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function hexRGB(hex){ const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgba(hex, a){ const [r, g, b] = hexRGB(hex); return `rgba(${r},${g},${b},${a})`; }
function shade(hex, amt){
  let [r, g, b] = hexRGB(hex);
  if(amt < 0){ r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

  const r = canvas.getBoundingClientRect();

let ac = null, muted = false, VOL = 1;
function initAudio(){
  if(ac) return;
  try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ ac = null; }
}
function tone(f, d, type='square', v=0.05, f2=null, delay=0){
  if(muted || !ac || VOL <= 0) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v * VOL, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + d + 0.02);
}

  over(){ [392,330,262,196].forEach((f,i)=>tone(f,.25,'triangle',.06,null,i*.2)); },
  walljump(){ tone(300,.09,'square',.035,620); tone(520,.06,'triangle',.03,null,.03); },
  dash(){ tone(180,.16,'sawtooth',.03,900); tone(1200,.08,'triangle',.025,500,.02); },
  gravity(g){ tone(g < 0 ? 420 : 840,.22,'sine',.06,g < 0 ? 1100 : 300); tone(g < 0 ? 630 : 1260,.14,'triangle',.03,g < 0 ? 1600 : 500,.04); },

};

// =====================================================================
//  HERO ANIMATION
//  The hero is the player's own drawing: an indigo bean with googly eyes,
//  a wide grin and four wobbly tentacle limbs. Everything here is driven
//  by small springs so it reacts to running, jumping and landing.
// =====================================================================
function makeLimb(a, c, amp){ return {a, c, amp, ph:Math.random() * 6}; }
function makeCharAnim(){
  return {
    t:0, fx:1, lean:0, bob:0, breath:0, wob:0, wobV:0, spin:0, sx:1, sy:1,
    legPhase:0, idleT:0, look:{x:0.4, y:0, t:0},
    eyes:[{x:0.4, y:-0.35, vx:0, vy:0, k:0.075, d:0.8}, {x:0.3, y:0.35, vx:0, vy:0, k:0.05, d:0.85}],
    blinkP:0, blinkT:80,
    arms:[makeLimb(0.5, -1.7, 0.22), makeLimb(-0.2, 0.9, 0.32)],
    legs:[makeLimb(-0.12, 0.55, 0.08), makeLimb(0.1, -0.6, 0.08)],
    face:'smile', faceT:0, curFace:'smile',
    shootT:0, appear:1, exit:0, hop:0, pvx:0, pvy:0,
  };
}
const anim = makeCharAnim(), titleHero = makeCharAnim(), uiHero = makeCharAnim();

function setFace(a, f, t){ a.face = f; a.faceT = t; }
function blendLimb(l, t){
  l.a += (t.a - l.a) * 0.22;
  l.c += (t.c - l.c) * 0.2;
  l.amp += (t.amp - l.amp) * 0.15;
  l.ph += t.spd;
}

function stepCharAnim(a, s){
  a.t++;
  const facing = s.facing || 1;
  a.fx += (facing - a.fx) * 0.32;
  const running = s.onGround && Math.abs(s.vx) > 0.4;
  const leanT = s.dash ? clamp(s.vx * 0.04, -0.32, 0.32) : s.onGround ? clamp(s.vx * 0.04, -0.15, 0.15) : clamp(s.vx * 0.025, -0.1, 0.1);
  a.lean += ((REDUCED ? leanT * 0.5 : leanT) - a.lean) * 0.2;
  if(running) a.legPhase += Math.abs(s.vx) * 0.17;
  a.bob += ((running ? Math.abs(Math.sin(a.legPhase)) * 1.6 : 0) - a.bob) * 0.4;
  a.breath = Math.sin(a.t * 0.06);
  a.wobV += -a.wob * 0.22; a.wobV *= 0.84; a.wob += a.wobV;
  if(a.spin > 0){ a.spin += 1 / 22; if(a.spin >= 1) a.spin = 0; }
  if(a.shootT > 0) a.shootT--;
  if(a.faceT > 0) a.faceT--;
  if(a.appear < 1) a.appear = Math.min(1, a.appear + 1 / 20);
  if(a.hop > 0) a.hop = Math.max(0, a.hop - 0.05);

  let face = a.faceT > 0 ? a.face : 'smile';
  if(s.ko) face = 'ko';
  else if(a.faceT <= 0){
    if(s.sad) face = 'sad';
    else if(s.hurt) face = 'hurt';
    else if(s.cheer) face = 'open';
    else if(!s.onGround && s.vy < -3) face = 'open';
    else if(!s.onGround && s.vy > 7.5) face = 'o';
  }
  a.curFace = face;

  // googly eyes: pupils swing with inertia, then drift back to where the hero looks
  const still = s.onGround && Math.abs(s.vx) < 0.2 && !s.cheer;
  a.idleT = still ? a.idleT + 1 : 0;
  if(a.idleT > 150 && --a.look.t <= 0){
    a.look.t = 50 + Math.random() * 100;
    const ang = Math.random() * TAU, r = 0.35 + Math.random() * 0.55;
    a.look.x = Math.cos(ang) * r; a.look.y = Math.sin(ang) * r;
  }
  const ax = (s.vx - a.pvx) * facing, ay = s.vy - a.pvy;
  a.pvx = s.vx; a.pvy = s.vy;
  for(let i = 0; i < 2; i++){
    const e = a.eyes[i];
    let tx = 0.42, ty = 0;
    if(s.look){ tx = s.look.x; ty = s.look.y; }
    else if(a.idleT > 150){ tx = a.look.x; ty = a.look.y; }
    tx += i ? -0.12 : 0.02;
    ty += i ? 0.36 : -0.36;                    // one eye up, one eye down, as in the drawing
    ty += clamp(s.vy * 0.07, -0.45, 0.5);
    if(s.sad) ty = 0.75;
    if(s.sleep) ty = 0.55;
    if(s.think){ tx = -0.55 + Math.sin(a.t * 0.02) * 0.2; ty = -0.85; }
    if(s.shooting){ tx = s.up ? 0.05 : 0.85; ty = s.up ? -0.85 : 0.05; }
    e.vx += -ax * 0.1 + (tx - e.x) * e.k;
    e.vy += -ay * 0.06 + (ty - e.y) * e.k + 0.012;
    e.vx *= e.d; e.vy *= e.d;
    e.x += e.vx; e.y += e.vy;
    const d = Math.hypot(e.x, e.y);
    if(d > 1){
      e.x /= d; e.y /= d;
      const dot = e.vx * e.x + e.vy * e.y;
      if(dot > 0){ e.vx -= 1.5 * dot * e.x; e.vy -= 1.5 * dot * e.y; }
    }
  }
  if(a.blinkP > 0){ a.blinkP += 1 / 9; if(a.blinkP >= 1.2) a.blinkP = 0; }
  else if(--a.blinkT <= 0){ a.blinkP = 0.001; a.blinkT = 110 + Math.random() * 220; }

  // tentacle poses: angles (a), curl along the length (c), wave amplitude and speed
  const lp = a.legPhase, t = a.t;
  let A0, A1, L0, L1;
  if(s.cheer){
    A0 = {a:-1.25 + Math.sin(t * 0.3) * 0.35, c:0.6, amp:0.3, spd:0.3};
    A1 = {a:-1.3 - Math.sin(t * 0.3) * 0.35, c:0.6, amp:0.3, spd:0.3};
    L0 = {a:-0.3, c:0.9, amp:0.2, spd:0.2}; L1 = {a:0.2, c:-0.7, amp:0.2, spd:0.2};
  } else if(s.sad){
    A0 = {a:1.2, c:0.25, amp:0.1, spd:0.04}; A1 = {a:1.15, c:0.25, amp:0.1, spd:0.04};
    L0 = {a:-0.1, c:0.4, amp:0.05, spd:0.03}; L1 = {a:0.1, c:-0.4, amp:0.05, spd:0.03};
  } else if(s.onGround){
    if(running){
      const k = Math.min(1, Math.abs(s.vx) / RUN);
      A0 = {a:-0.45 + Math.sin(lp) * 0.45 * k, c:-0.5, amp:0.22, spd:0.25};
      A1 = {a:0.35 - Math.sin(lp) * 0.45 * k, c:0.6, amp:0.22, spd:0.25};
      L0 = {a:Math.sin(lp) * 0.8 * k, c:0.45 + Math.max(0, Math.cos(lp)) * 0.7, amp:0.12, spd:0.2};
      L1 = {a:-Math.sin(lp) * 0.8 * k, c:0.45 + Math.max(0, -Math.cos(lp)) * 0.7, amp:0.12, spd:0.2};
    } else {
      A0 = {a:0.5, c:-1.7, amp:0.22, spd:0.06};
      A1 = {a:-0.2, c:0.9, amp:0.32, spd:0.07};
      L0 = {a:-0.18, c:0.5, amp:0.3, spd:0.045};    // wavy S-shaped legs, like the drawing
      L1 = {a:0.14, c:-0.55, amp:0.3, spd:0.05};
    }
  } else if(s.vy < 0){
    A0 = {a:-1.05, c:0.7, amp:0.35, spd:0.3}; A1 = {a:-1.15, c:0.7, amp:0.35, spd:0.3};
    L0 = {a:-0.45, c:1.0, amp:0.2, spd:0.25}; L1 = {a:-0.3, c:0.9, amp:0.2, spd:0.25};
  } else {
    const fl = Math.sin(t * 0.45) * 0.35;
    A0 = {a:-0.85 + fl, c:0.4, amp:0.55, spd:0.45}; A1 = {a:-0.95 - fl, c:0.4, amp:0.55, spd:0.45};
    L0 = {a:-0.2, c:0.4, amp:0.35, spd:0.3}; L1 = {a:0.05, c:0.3, amp:0.35, spd:0.3};
  }
  if(s.hurt){ A0 = {a:-0.3, c:0, amp:0.8, spd:0.6}; A1 = {a:-0.3, c:0, amp:0.8, spd:0.6}; }
  if(s.sleep){
    A0 = {a:1.15, c:0.3, amp:0.05, spd:0.02}; A1 = {a:1.1, c:-0.3, amp:0.05, spd:0.02};
    L0 = {a:-0.25, c:0.6, amp:0.06, spd:0.02}; L1 = {a:0.2, c:-0.6, amp:0.06, spd:0.02};
  }
  if(s.stretch){ A0 = {a:-1.5, c:0.15, amp:0.04, spd:0.05}; A1 = {a:-1.55, c:-0.15, amp:0.04, spd:0.05}; }
  if(s.think) A1 = {a:-2.05 + Math.sin(t * 0.45) * 0.12, c:1.5, amp:0.1, spd:0.35};        // scratching his head
  if(s.akimbo){ A0 = {a:0.9, c:-2.4, amp:0.03, spd:0.04}; A1 = {a:0.9, c:-2.4, amp:0.03, spd:0.04}; }
  if(s.wall){
    // stuck to the wall with both tentacles, legs bracing against it
    A0 = {a:-1.15, c:0.9, amp:0.05, spd:0.08}; A1 = {a:-0.55, c:-0.5, amp:0.05, spd:0.09};
    L0 = {a:-0.55, c:0.3, amp:0.08, spd:0.1}; L1 = {a:-0.75, c:0.2, amp:0.08, spd:0.1};
  }
  if(s.dash){
    // streamlined: tentacles swept back
    A0 = {a:0.15, c:0.1, amp:0.12, spd:0.5}; A1 = {a:2.75, c:-0.1, amp:0.12, spd:0.5};
    L0 = {a:1.05, c:0.2, amp:0.15, spd:0.5}; L1 = {a:1.25, c:0.1, amp:0.15, spd:0.5};
  }
  if(s.phone) A1 = {a:-1.3, c:1.85, amp:0.03, spd:0.06};
  if(s.ko){
    A0 = {a:0.2, c:0.5, amp:0.25, spd:0.08}; A1 = {a:0.4, c:-0.5, amp:0.25, spd:0.09};
    L0 = {a:-0.5, c:1.2, amp:0.55, spd:0.22}; L1 = {a:0.5, c:-1.2, amp:0.55, spd:0.25};
  }
  if(s.shooting) A1 = s.up ? {a:-Math.PI / 2 + 0.05, c:0, amp:0.04, spd:0.1} : {a:-0.05, c:0, amp:0.04, spd:0.1};
  if(s.wave) A1 = {a:-1.3 + Math.sin(t * 0.28) * 0.5, c:0.5, amp:0.2, spd:0.15};
  blendLimb(a.arms[0], A0); blendLimb(a.arms[1], A1);
  blendLimb(a.legs[0], L0); blendLimb(a.legs[1], L1);
}

function stepHero(){
  stepCharAnim(anim, {
    vx:player.vx, vy:player.vy * gdir, onGround:player.onGround, facing:player.facing,
    hurt:player.hurtT > 0, shooting:anim.shootT > 0, up:!!(room && room.shootUp),
    think:idle.phase === 'think', ko:idle.phase === 'ko', wall:player.sliding, dash:player.dashT > 0,
  });
  anim.sx = player.sx; anim.sy = player.sy;
  anim.gv = (anim.gv === undefined ? 1 : anim.gv) + (gdir - (anim.gv === undefined ? 1 : anim.gv)) * 0.28;
}

function loadRoom(ci, ri){
  chIndex = ci; rIndex = ri;
  chapter = CHAPTERS[ci];
  room = chapter.rooms[ri];
  room.w = room.width || W;
  room.h = room.height || H;
  // season 2: in the first rooms of the gorges Gaston keeps the double jump (he gives it back in La Faille)
  if(room.noDJ){ if(hasDJ) djTake = 100; hasDJ = false; }

  platforms = room.platforms.map((p, i) => ({
    ...p, h: p.h || (p.fall ? 16 : 14), dx:0, dy:0, cT:0, gone:false, rT:0, appear:1, ox:p.x, oy:p.y, fT:0, fvy:0, loose:!!p.free,
    seed: (ci * 1000 + ri * 100 + i) * 7919,
    move: p.move ? {...p.move, dir:1} : null,
  }));
  (room.walls || []).forEach((w, k) => platforms.push({x:w.x, y:w.y, w:w.w, h:w.h, solid:true, dx:0, dy:0, cT:0, gone:false, rT:0, appear:1,
    seed:(ci * 1000 + ri * 100 + 60 + k) * 7919, move:null, gate:!!w.hp, hp:w.hp || 0, maxHp:w.hp || 0, flash:0, glass:!!w.glass, slick:!!w.slick, ice:!!w.ice}));
  // gravity orbs (a point) and gravity lines (a band); 'set' forces a direction instead of toggling
  flips = (room.flips || []).map(f => f.w ? {...f, armed:true, t:0, line:true} : {...f, cx:f.x, cy:f.y, x:f.x - 12, y:f.y - 12, w:24, h:24, armed:true, t:0, line:false});
  solids = platforms.filter(p => p.solid);
  enemies = (room.enemies || []).map(e => ({...e, off:e.from, dir:1, w:24, h:18, x:0, y:0, alive:true, t:Math.random()*6}));
  bats = (room.bats || []).map(b => ({...b, x0:b.x, y0:b.y, t:Math.random()*6, w:24, h:16, alive:true, face:1}));
  turrets = (room.turrets || []).map(t => ({...t, w:24, h:24, t:Math.floor(Math.random()*t.rate), hp:t.hp || 3, maxHp:t.hp || 3, alive:true, flash:0}));
  springs = (room.springs || []).map(s => ({x:s.x, y:s.y - 10, w:20, h:10, base:s.y, t:0, anim:0}));
  spikes = (room.spikes || []).map(s => ({...s}));
  fires = []; fireTold = false;
  checkpoints = (room.checkpoints || []).map(c => ({x:c.x, y:c.y, active:false, raise:0, ceil:!!c.ceil}));
  signs = (room.signs || []).map(s => ({...s, show:0}));
  npcs = (room.npcs || []).map(n => ({...n, t:Math.random() * 6, blink:0, near:0}));
  nearNpc = null; talk = null; cine = null; fightPop = 0;
  // already-collected coins / power-ups stay collected when a room is reloaded after a game over
  coins = (room.coins || []).map(([x, y], i) => ({x, y, id:`c${ci}-${ri}-${i}`, got:collected.has(`c${ci}-${ri}-${i}`), t:Math.random()*6}));
  powerUps = (room.powerUps || [])
    .map((p, i) => ({...p, id:`p${ci}-${ri}-${i}`, w:20, h:20, got:false}))
    .filter(p => !collected.has(p.id))
    .filter(p => !(p.type === 'doubleJump' && hasDJ) && !(p.type === 'shoot' && canShoot) && !(p.type === 'gem' && chGem) && !(p.type === 'wall' && hasWall) && !(p.type === 'dash' && hasDash));
  door = room.door ? {...room.door, w:26, h:40, shake:0, glow:0} : null;
  boss = room.boss ? makeBoss(room.boss) : null;
  bullets = []; shots = []; key = null; hasKey = false;
  if(room.keyAt) key = {x:room.keyAt.x - 17, y:room.keyAt.y - 8, w:34, h:16, got:false, kind:'key'};
  if(room.finale && !room.boss) key = {x:room.keySpot.x - 17, y:room.keySpot.y - 8, w:34, h:16, got:false, kind:'ficelle', gold:room.gold || false};
  idleReset();
  if(room.armed) canShoot = true;
  lavaY = room.lava ? room.lava.start : 1e9;
  lavaDelay = room.lava ? room.lava.delay : 0;
  phaseT = 0;
  gdir = room.startG || 1;
  checkpoint = {x:room.start.x, y:room.start.y, g:gdir};
  particles = []; popups = [];
  exitT = 0; exitKind = null; anim.exit = 0; finaleT = 0; steal = null;
  hud.bossShown = hud.bossTrail = 1;
  makeAmbient();

  resetPlayer();
  snapCamera();
  bannerT = ri === 0 ? 240 : 150;
  if(room.shootUp && !room.boss) showToast('Tes tirs partent vers le haut !', 170);
  if(boss) startCine('intro');   // every boss makes an entrance before the fight starts
}

function makeBoss(def){
  const b = {...def, maxHp:def.hp, hitT:0, inv:0, alive:true, fleeing:false, vx:1.8, vy:1.4, phase:1};
  b.enrage = (def.mode === 'slime' || def.mode === 'swoop') ? 1 : def.mode === 'arena' ? 2 : Math.round(def.hp * 0.35);
  if(def.mode === 'arena') b.fireT = 90;
  if(def.mode === 'ascent') b.fireT = 160;
  if(def.mode === 'slime'){ b.y = FLOOR - b.h; b.onGround = true; b.hopT = 90; b.hops = 0; b.squash = 0; b.vx = 0; b.vy = 0; }
  if(def.mode === 'swoop'){ b.state = 'hover'; b.stT = 200; b.fireT = 80; b.vy = 0; }
  if(S2_BOSS.has(def.mode)){ b.enrage = 2; setupS2Boss(b); }
  return b;
}

function resetPlayer(){
  gdir = checkpoint.g || 1;
  Object.assign(player, {
    x:checkpoint.x, y:checkpoint.y, vx:0, vy:0, onGround:false, standingOn:null,
    coyote:0, buffer:0, usedDJ:false, sx:1, sy:1, dead:false, noCut:false, hurtT:0,
    wallSide:0, wallT:0, wallLock:0, sliding:false, dashT:0, dashReady:true, dashCD:0, dashBuf:0, ghosts:[],
  });
  for(const o of flips){ o.armed = !overlap(player, o); }
  for(const p of platforms) if(p.fall){ p.x = p.ox; p.y = p.oy; p.fT = 0; p.fvy = 0; p.loose = !!p.free; p.landT = 0; p.gone = false; p.appear = 0; p.px = p.x; p.py = p.y; }
  anim.gv = gdir;
  player.px = player.x; player.py = player.y;
  anim.pvx = 0; anim.pvy = 0; anim.spin = 0;
}

function startChapter(ci, advancing){
  const g = CHAPTERS[ci].grants || {};
  hasDJ = advancing ? (hasDJ || !!g.dj) : !!g.dj;
  canShoot = !!g.shoot;
  hasWall = advancing ? (hasWall || !!g.wall) : !!g.wall;
  hasDash = advancing ? (hasDash || !!g.dash) : !!g.dash;
  lives = advancing ? Math.max(lives, startLives()) : startLives();
  chStartTime = elapsed; chCoins = 0; chGem = false;
  collected = new Set();
  chCoinsTotal = CHAPTERS[ci].rooms.reduce((a, r) => a + (r.coins || []).length, 0);
  loadRoom(ci, 0);
}

function newRun(ci){
  save.seen[ci] = true;
  score = 0; elapsed = 0; timerRunning = false; continues = 0;
  runFromStart = ci === 0 || ci === S2_FIRST;
  save.lastSeason = seasonOf(ci);
  if(seasonOf(ci) === 2 && !save.s2Seen) save.s2Seen = true;
  persist();
  particles = [];
  hasDJ = false; hasWall = false; hasDash = false; lives = startLives(); hud.lastLives = lives;
  startChapter(ci, false);
  setState('play');
  fade = 1; fadeDir = -1;
}

function transition(fn){ if(fadeDir > 0) return; pendingAction = fn; fadeDir = 1; }

function toMenu(){
  setState('title');
  timerRunning = false;
  const c = CHAPTERS[chIndex];
  if(c && c.bonus){ menu.page = 'bonus'; menu.sel.bonus = Math.max(0, BONUS_CH.indexOf(chIndex)); menuSel = defaultChapter(); }
  else { menu.page = 'chapters'; menuSel = c && isUnlocked(chIndex) ? chIndex : defaultChapter(); }
  menu.from = null; menu.t = 1; menu.drag = null; menu.down = null; menu.splash = null;
  loadRoom(menuSel, 0);
  menu.scroll = appPos(appIndex(menuSel));
  if(clearInfo && clearInfo.bonusNew){ clearInfo.bonusNew = false; showToast('Psst… un bonus secret t\'attend dans les Paramètres !', 220); }
  fade = 1; fadeDir = -1;
}

function chapterClear(){
  const t = elapsed - chStartTime;
  const prev = save.bestCh[chIndex];
  clearInfo = {time:t, coins:chCoins, total:chCoinsTotal, gem:chGem, newBest: prev == null || t < prev, bonus:!!chapter.bonus};
  if(clearInfo.newBest) save.bestCh[chIndex] = t;
  if(chGem && !chapter.bonus) save.gems[chIndex] = true;
  if(chapter.bonus){
    timerRunning = false;
    if(chapter.bonus2) save.crystalFicelle = true; else save.goldFicelle = true;
    clearInfo.bonus2 = !!chapter.bonus2;
    score += 500;
    setState('chapter');
    SFX.win();
    persist();
    return;
  }
  const s2 = chapter.season === 2;
  if(chIndex === STORY_END) clearInfo.bonusNew = prev == null;
  if(s2) save.unlocked2 = Math.max(save.unlocked2, Math.min(4, chapter.num + 1));
  else save.unlocked = Math.max(save.unlocked, Math.min(STORY_END + 2, chIndex + 2));
  if(chIndex === STORY_END || chIndex === S2_END){
    timerRunning = false;
    score += 500;
    clearInfo.season = s2 ? 2 : 1;
    if(runFromStart){
      const rk = s2 ? 'bestRun2' : 'bestRun';
      clearInfo.runBest = save[rk] == null || elapsed < save[rk];
      if(clearInfo.runBest) save[rk] = elapsed;
    }
    if(s2){ clearInfo.bonusNew = !save.s2Done; save.s2Done = true; }
    setState('win');
  } else {
    score += 250;
    setState('chapter');
  }
  SFX.win();
  persist();
}

// =====================================================================
//  EFFECTS
// =====================================================================
function burst(x, y, n, color, spd=3, life=30, grav=0.15, size=3, type='dot'){
  for(let i = 0; i < n; i++){
    const a = Math.random() * TAU, s = Math.random() * spd;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - spd*0.3, life, max:life, color, grav, size:size*(0.6 + Math.random()*0.8), type, rot:Math.random()*TAU, vr:(Math.random() - .5)*0.3});
  }
}
function dust(x, y, n=6){
  for(let i = 0; i < n; i++){
    particles.push({x:x + (Math.random() - .5)*14, y:y - 1, vx:(Math.random() - .5)*1.6, vy:-Math.random()*0.9,
      life:22 + Math.random()*8, max:30, color:'#ffffff', grav:-0.01, size:2.2 + Math.random()*2.4, type:'puff', drag:0.94});
  }
}
function sparkle(x, y, n, color){
  for(let i = 0; i < n; i++){
    const a = Math.random() * TAU, s = 0.8 + Math.random()*2.6;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:26 + Math.random()*14, max:40, color, grav:0.02, size:2.5 + Math.random()*2.5, type:'star', rot:Math.random()*TAU, vr:0.15, drag:0.93});
  }
}
function ring(x, y, color, r0, r1, life){ particles.push({x, y, vx:0, vy:0, life, max:life, color, grav:0, size:2.5, type:'ring', r0, r1}); }
function crumbs(x, y, n, color){
  for(let i = 0; i < n; i++) particles.push({x:x + (Math.random() - .5)*10, y, vx:(Math.random() - .5)*1.2, vy:Math.random()*0.5, life:30, max:30, color, grav:0.18, size:1.6 + Math.random()*1.6, type:'crumb', rot:Math.random()*TAU, vr:(Math.random() - .5)*0.4});
}
function confetti(x, y, n){
  const cols = ['#ffd54a', '#2ee6ff', '#ff6fa5', '#8cff7a', '#ff8a3d', '#b48cff'];
  for(let i = 0; i < n; i++){
    const a = -Math.PI/2 + (Math.random() - .5)*1.6, s = 3 + Math.random()*4;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:80 + Math.random()*40, max:120, color:cols[i % cols.length], grav:0.12, size:3, type:'confetti', rot:Math.random()*TAU, vr:(Math.random() - .5)*0.5, drag:0.97});
  }
}
function popup(x, y, text, color='#ffffff'){ popups.push({x, y, text, color, t:0}); }
function flyCoin(wx, wy){ flyers.push({sx:wx - viewX, sy:wy - viewY, t:0, done:false}); }

function heroPop(){
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  for(let i = 0; i < 18; i++){
    const a = Math.random() * TAU, s = 1.5 + Math.random()*3.5;
    particles.push({type:'goo', x:cx, y:cy, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 2, life:50 + Math.random()*20, max:70, color:i % 3 ? HERO.body : HERO.light, grav:0.18, size:2 + Math.random()*2.5, drag:0.98});
  }
  for(const s of [-1, 1]) particles.push({type:'eye', x:cx + s*3, y:cy - 6, vx:s*(1.5 + Math.random()), vy:-5 - Math.random()*2, life:90, max:90, grav:0.25, size:4.2, rot:0, vr:s*0.2, drag:0.99, color:'#ffffff'});
  ring(cx, cy, HERO.light, 4, 34, 22);
  SFX.splat();
}

function showToast(text, t=90){ toast = {text, t, max:t}; }
function addShake(v){ if(!SET.shake) return; shake = Math.max(shake, REDUCED ? v * 0.3 : v); }
function overlap(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// =====================================================================
//  CAMERA (eases ahead of the run, follows platform height, not every hop)
// =====================================================================
function camTargets(){
  const tx = player.x + player.w/2 - W/2 + lookX;
  let ty = camFocusY - H * camOff;
  if(barrierOn()) ty = room.h - H;   // camera stays on the arena until the boss is beaten
  return [clamp(tx, 0, room.w - W), clamp(ty, 0, room.h - H)];
}
let camOff = 0.56;
function snapCamera(){
  camFocusY = player.y; lookX = 0; camOff = gdir > 0 ? 0.56 : 0.4;
  [camX, camY] = camTargets();
  prevCamX = camX; prevCamY = camY;
}
function updateCamera(){
  lookX += (clamp(player.vx * 18, -60, 60) - lookX) * 0.05;
  camOff += ((gdir > 0 ? 0.56 : 0.4) - camOff) * 0.06;
  if(player.onGround || player.dead) camFocusY = player.y;
  else if(gdir > 0){
    if(player.y > camFocusY) camFocusY = player.y;
    else if(player.y < camFocusY - 110) camFocusY = player.y + 110;
  } else {
    if(player.y < camFocusY) camFocusY = player.y;
    else if(player.y > camFocusY + 110) camFocusY = player.y - 110;
  }
  const [tx, ty] = camTargets();
  camX += (tx - camX) * 0.09;
  camY += (ty - camY) * 0.1;
}

function doorLocked(){
  return (room.needsKey && !hasKey) || (room.needsBoss && boss && boss.alive);
}

// =====================================================================
//  DAMAGE
// =====================================================================
function hurt(fromX){
  if(player.invuln > 0 || player.dead || cine) return;
  if(idle.phase) idleReset();
  lives--;
  SFX.hurt();
  addShake(8);
  hud.flash = 1;
  burst(player.x + player.w/2, player.y + player.h/2, 14, HERO.light, 4, 30);
  if(lives <= 0){ die(); return; }
  player.invuln = 90; player.hurtT = 40;
  player.vy = -6;
  player.vx = (player.x + player.w/2 < fromX ? -1 : 1) * 4.5;
  anim.wobV += 0.6;
  showToast('Aïe !', 40);
}

// spikes, pits, lava pools: lose a life and respawn at the last checkpoint
function killPlayer(){
  if(player.dead) return;
  idleReset();
  lives--;
  addShake(7);
  hud.flash = 1;
  heroPop();
  if(lives <= 0){ die(); return; }
  player.dead = true;
  respawnT = 45;
}

function die(){
  if(!player.dead) heroPop();
  player.dead = true;
  setState('over');
  SFX.over();
}

function bossDamage(){
  const b = boss;
  if(b.dying) return;              // already beaten: the death scene is playing
  b.hp--; b.hitT = 12;
  b.inv = (b.mode === 'arena' || b.mode === 'ascent') ? 60 : 50;   // the final boss can only be hit once per second
  addShake(6);
  SFX.bossHit();
  burst(b.x + b.w/2, b.y + b.h/2, 14, '#ffffff', 3, 24, 0.1, 3, 'star');
  popup(b.x + b.w/2, b.y - 6, 'Touché !', '#ffd54a');
  if(b.hp <= 0) bossDefeated();
  else if(b.hp === b.enrage) showToast(b.name + ' enrage !', 90);
  // halfway through the first fight against the Seigneur Pourpre, a heart appears on the high ledge
  if(b.mode === 'arena' && b.hp === 4 && !b.heart){
    b.heart = true;
    powerUps.push({x:300, y:158, type:'life', id:'arena-heart', w:20, h:20, got:false});
    sparkle(310, 168, 16, POWER_COLORS.life); ring(310, 168, POWER_COLORS.life, 5, 40, 22);
    showToast('Un cœur est apparu en haut !', 120);
  }
}

function bossDefeated(){
  const b = boss;
  addShake(14);
  bullets = [];
  burst(b.x + b.w/2, b.y + b.h/2, 30, '#ffd54a', 5, 50, 0.1, 3, 'star');
  ring(b.x + b.w/2, b.y + b.h/2, '#ffffff', 10, 90, 30);
  if(b.phase === 1 && room.boss.hp2){ enterPhase2(true); return; }
  if(b.phase === 2 && room.boss.hp3){ enterPhase3(true); return; }
  score += 300;
  if(b.mode === 'arena'){
    b.fleeing = true;
    phaseT = 120;
    SFX.bossFlee();
    showToast("Il s'enfuit vers le haut ! Poursuis-le", 130);
    return;
  }
  // the last hit: a little death scene before the door opens (the magpie spins, drops the ficelle and flies off)
  b.dying = 1; b.inv = 0; b.hitT = 0; b.vy = 0;
  hitStop = REDUCED ? 0 : 16;
  fires = [];
  player.invuln = Math.max(player.invuln, 150);
  if(b.mode === 'magpie' && gdir < 0) setGravity(1);   // the nest settles: XELIAX falls back onto the hay
  if(b.mode === 'gecko' && b.state !== 'stun') b.state = 'drop';
  SFX.bossFlee();
}

const BOSS_DIE = 100;
const DIE_FX = {slime:['#b45be3', 'goo'], swoop:['#8da2ff', 'crumb'], gecko:['#5fd36a', 'goo'], yeti:['#e8f6ff', 'crumb'], ascent:['#ff6b6b', 'goo']};
function updateBossDeath(b){
  const k = ++b.dying, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  b.hitT = Math.floor(k / 4) % 2 ? 2 : 0;          // flashes white
  if(b.mode === 'magpie'){
    // dizzy, she spins in place, lets go of the ficelle, then flutters away for good
    b.state = 'hover';
    if(k === 40){ b.lost = true; dropFicelle(b); }
    if(k > 40){ if(!b.fx) b.fx = cx < W / 2 ? -1 : 1; b.face = b.fx; b.x += b.fx * (1.4 + (k - 40) * 0.05); b.y -= 1 + (k - 40) * 0.05; }
    if(k % 4 === 0) particles.push({x:cx + (Math.random() - 0.5) * 30, y:cy + (Math.random() - 0.5) * 20, vx:(Math.random() - 0.5) * 2, vy:-0.4 - Math.random(), life:70, max:70,
      color:Math.random() < 0.5 ? '#1a1430' : '#ffffff', grav:0.04, size:3.5, type:'confetti', rot:Math.random() * TAU, vr:0.2, drag:0.97});
    if(k % 10 === 0 && k < 60) tone(760 - k * 4, 0.07, 'triangle', 0.03);
    if(b.y + b.h < -30 || b.x > W + 30 || b.x + b.w < -30 || k > 240){ b.alive = false; b.dying = 0; }
    return;
  }
  // grounded bosses drop to the floor first
  if((b.mode === 'slime' || b.mode === 'gecko' || b.mode === 'yeti') && b.y + b.h < FLOOR){
    b.vy = (b.vy || 0) + 0.5; b.y = Math.min(FLOOR - b.h, b.y + b.vy);
    if(b.y + b.h >= FLOOR){ b.vy = 0; addShake(5); SFX.thud(); dust(cx, FLOOR, 10); if(b.mode === 'gecko') b.state = 'stun'; if(b.mode === 'slime') b.onGround = true; }
  }
  if(k % 5 === 0){
    burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, 5, Math.random() < 0.5 ? '#ffffff' : '#ffd54a', 2, 18, 0, 2.6, 'star');
    if(k < BOSS_DIE - 20) tone(560 - k * 3.5, 0.05, 'square', 0.025);
  }
  if(k === BOSS_DIE - 20) tone(300, 0.35, 'sine', 0.05, 1200);
  if(k >= BOSS_DIE) finishBoss(b);
}
function finishBoss(b){
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, fx = DIE_FX[b.mode] || ['#ff6b6b', 'goo'];
  b.alive = false; b.dying = 0;
  burst(cx, cy, 46, fx[0], 6, 60, 0.15, 4, fx[1]);
  burst(cx, cy, 20, '#ffffff', 3, 40, -0.02, 6, 'puff');
  ring(cx, cy, '#ffffff', 12, 100, 30);
  confetti(cx, cy, 40);
  particles.push({x:cx, y:cy, vx:0, vy:-0.7, grav:-0.004, drag:1, life:120, max:120, color:fx[0], size:11, type:'soul', rot:0});
  addShake(12); SFX.stomp();
  if(b.mode === 'ascent') startEscape(true);
  else {
    SFX.key();
    showToast(b.name + (b.fem ? ' est vaincue' : ' est vaincu') + ' ! Porte ouverte', 150);
    spikes = spikes.filter(s => !(room.phase2Spikes || []).some(z => z.x === s.x && z.y === s.y));
  }
}

// slime / swoop bosses come back stronger for a second phase
function enterPhase2(announce){
  const b = boss;
  b.phase = 2;
  b.hp = b.maxHp = room.boss.hp2;
  b.inv = 90; b.hitT = 0;
  if(b.mode === 'slime'){ b.onGround = true; b.y = FLOOR - b.h; b.vx = b.vy = 0; b.hopT = 70; b.hops = 0; }
  // the phase-2 spikes are only announced here: they come out during the cinematic, never under XELIAX
  if(b.mode === 'swoop'){ b.state = 'rise'; for(const s of (room.phase2Spikes || [])) spikes.push({...s, appear:0, pending:true}); }
  if(S2_BOSS.has(b.mode)){
    for(const s of (room.phase2Spikes || [])) spikes.push({...s, appear:0, pending:true});
    if(b.mode === 'gecko'){ b.state = b.state === 'stun' ? 'climb' : 'crawl'; b.stT = 120; b.leaps = 0; }
    if(b.mode === 'yeti'){ b.state = 'walk'; b.stT = 140; b.y = FLOOR - b.h; }
    if(b.mode === 'magpie'){ b.state = 'rise'; }
  }
  if(announce){
    score += 150;
    burst(b.x + b.w/2, b.y + b.h/2, 50, '#ff6b6b', 6, 55);
  }
  startCine('phase2');
}

// phase 3 (the magpie only, hp3): furious, she chains her dives straight at XELIAX
function enterPhase3(announce){
  const b = boss;
  b.phase = 3;
  b.hp = b.maxHp = room.boss.hp3;
  b.inv = 90; b.hitT = 0; b.state = 'rise'; b.chain = 0; b.nestT = 0;
  if(gdir < 0) setGravity(1);
  if(announce){ score += 200; burst(b.x + b.w/2, b.y + b.h/2, 60, '#ff3d3d', 7, 60); }
  startCine('phase3');
}

// final boss beaten at the bottom of the shaft: barrier drops, lava rises, key waits at the top
function startEscape(announce){
  key = {x:room.keySpot.x - 17, y:room.keySpot.y - 8, w:34, h:16, got:false, kind:room.finale ? 'ficelle' : 'key'};
  lavaDelay = room.lava.delay;
  if(announce){
    sparkle(room.keySpot.x, room.keySpot.y, 14, '#ffe066');
    SFX.bossFlee();
    showToast(room.finale ? 'Vaincu ! La ficelle aux olives est au sommet : grimpe !' : 'Vaincu ! Fuis vers le haut, la clé est au sommet', 170);
  }
}

// XELIAX grabs the ficelle aux olives: a short celebration, then the ending
function startFinale(){
  finaleT = 1;
  key.got = true;
  player.invuln = 9999; player.hurtT = 0;
  for(const e of [...enemies, ...bats]) if(e.alive){ e.alive = false; burst(e.x + e.w / 2, e.y + e.h / 2, 8, '#ffffff', 1.6, 26, -0.01, 4, 'puff'); }
  score += 1000;
  bullets = [];
  lavaDelay = 1e9;
  const cx = key.x + key.w / 2, cy = key.y + key.h / 2;
  sparkle(cx, cy, 24, '#ffe066'); ring(cx, cy, '#ffe066', 6, 60, 30); confetti(cx, cy, 40);
  setFace(anim, 'open', 200);
  SFX.key();
  if(chIndex === STORY_END && !key.gold && !room.ending2) steal = {x:0, y:0, w:48, h:40, state:'hover', phase:1, face:-1, hitT:0, inv:0, lost:true, got:false, on:false};
  showToast(key.gold === 'crystal' ? 'La ficelle de cristal ! Défi bonus réussi !' : key.gold ? 'La ficelle dorée ! Défi bonus réussi !' : 'XELIAX a retrouvé la ficelle aux olives !', 170);
}

function barrierOn(){ return !!(room && room.barrierY && boss && boss.alive); }

function currentPhase(){
  if(!boss) return 1;
  if(boss.mode === 'ascent') return boss.alive ? 1 : 'escape';
  return boss.phase;
}

// game over in a boss room: retry only the phase you were on
function restartPhase(){
  continues++;
  const ph = currentPhase();
  lives = startLives();
  loadRoom(chIndex, rIndex);          // the boss entrance plays again (it can be skipped by now)
  if((ph === 2 || ph === 3) && boss.mode === "magpie"){ boss.x = boss.tx = room.boss.x; boss.y = 150; }   // back in the arena, not off-screen
  if(ph === 2){ cine = null; enterPhase2(false); }
  if(ph === 3){ cine = null; enterPhase2(false); cine = null; enterPhase3(false); }
  if(ph === 'escape'){ cine = null; boss.alive = false; startEscape(false); }
  bannerT = 0;
  player.invuln = 60;
  anim.appear = 0;
  setState('play');
  showToast(ph === 'escape' ? 'Reprends la fuite !' : ph === 3 ? 'On reprend la phase 3' : ph === 2 ? 'On reprend la phase 2' : 'On reprend le combat', 100);
}

// =====================================================================
//  IDLE: leave XELIAX alone for 10 s and he starts wondering about things;
//  at 20 s he tries a backflip, lands on his head and needs 3 presses
//  of the jump key to get back up.
// =====================================================================
const IDLE_THINK = 600, IDLE_FLIP = 1200;
const IDLE_Q = [
  'Pourquoi les olives n\'ont pas de jambes ?',
  'Et si la ficelle était au fromage ?',
  'Est-ce que les boss mangent du pain ?',
  'Je suis un haricot ou un bonbon ?',
  'Qui a inventé les pics, franchement ?',
  'Mes yeux regardent chacun ailleurs…',
  'Une baguette, c\'est une ficelle qui a grandi ?',
  'Il y a quelqu\'un derrière l\'écran ?',
  'J\'ai mis le four à préchauffer, moi ?',
  'Pourquoi je ne bouge plus, déjà ?',
];
const idle = {t:0, phase:'', q:0, qT:0, presses:0, rot:0, land:0, koT:0, upT:0, bandage:0, groundY:0};

function idleReset(){
  idle.t = 0; idle.phase = ''; idle.rot = 0; idle.presses = 0; idle.koT = 0; idle.upT = 0;
}
function idleBlocked(){
  const sp = player.standingOn;
  return state !== 'play' || player.dead || !!cine || finaleT > 0 || exitT > 0 || fadeDir !== 0 ||
         (boss && boss.alive) || !player.onGround || gdir < 0 || player.dashT > 0 || (sp && (sp.move || sp.crumble));
}
function updateIdle(){
  if(idle.bandage > 0) idle.bandage--;
  if(idle.phase === '' || idle.phase === 'think'){
    const pressing = input.left || input.right || input.jumpHeld || input.jumpPressed || input.shootPressed;
    if(pressing || idleBlocked()){ idle.t = 0; idle.phase = ''; return; }
    idle.t++;
    if(idle.t >= IDLE_THINK && idle.phase === ''){
      idle.phase = 'think'; idle.q = Math.floor(Math.random() * IDLE_Q.length); idle.qT = 0;
      tone(520, 0.12, 'triangle', 0.03, 760);
    }
    if(idle.phase === 'think'){
      idle.qT++;
      if(idle.qT >= 200 && idle.t < IDLE_FLIP - 130){
        idle.q = (idle.q + 1 + Math.floor(Math.random() * (IDLE_Q.length - 1))) % IDLE_Q.length; idle.qT = 0;
        tone(520, 0.12, 'triangle', 0.03, 760);
      }
      if(idle.t === IDLE_FLIP - 130) idle.qT = 0;
      if(idle.t >= IDLE_FLIP) startBackflip();
    }
    return;
  }
  if(idle.phase === 'flip'){
    idle.land++;
    idle.rot = -player.facing * Math.PI * easeInOutCubic(Math.min(1, idle.land / 32));
    if(player.onGround && idle.land > 6) neckCrack();
    return;
  }
  if(idle.phase === 'ko'){
    idle.koT++;
    // on his back, legs in the air, rocking a little
    idle.rot = -player.facing * (Math.PI + Math.sin(idle.koT * 0.06) * 0.07 * Math.min(1, idle.koT / 40));
    if(idle.koT > 60 && idle.koT % 70 === 0) anim.wobV += 0.35;      // little twitches
    return;
  }
  if(idle.phase === 'up'){
    idle.upT++;
    idle.rot *= 0.8;
    if(idle.upT > 8 && player.onGround){ idle.phase = ''; idle.t = 0; idle.rot = 0; }
  }
}
function startBackflip(){
  idle.phase = 'flip'; idle.rot = 0; idle.land = 0; idle.groundY = player.y + player.h;
  player.vy = -9.6; player.onGround = false; player.standingOn = null; player.noCut = true;
  player.vx = -player.facing * 0.7;
  setFace(anim, 'open', 40);
  SFX.flip();
}
function neckCrack(){
  idle.phase = 'ko'; idle.koT = 0; idle.presses = 0;
  idle.rot = -player.facing * Math.PI;
  player.vx = 0;
  const hx = player.x + player.w / 2, hy = player.y + player.h;
  addShake(9);
  burst(hx, hy - 4, 12, '#ffffff', 2.6, 24, 0.1, 3, 'star');
  dust(hx, hy, 10);
  popup(hx, player.y - 16, 'CRAC !', '#ffffff');
  SFX.crack();
}
// each press of the jump key (or a tap) helps him back up
function idleWake(){
  if(idle.phase !== 'ko' || idle.koT < 30) return;
  idle.presses++;
  anim.wobV += 0.9;
  tone(300 + idle.presses * 170, 0.1, 'triangle', 0.05, 520 + idle.presses * 200);
  const hx = player.x + player.w / 2;
  if(idle.presses < 3){ popup(hx, player.y - 12, `${idle.presses} sur 3`, '#ffe58a'); return; }
  popup(hx, player.y - 12, 'Debout !', '#9dffb0');
  idle.phase = 'up'; idle.upT = 0; idle.groundY = player.y + player.h;
  player.vy = -6.5; player.onGround = false; player.standingOn = null; player.noCut = true;
  anim.faceT = 0; setFace(anim, 'open', 45);
  idle.bandage = 900;
  sparkle(hx, player.y + 4, 10, '#ffffff');
  SFX.power();
}

// thought bubble with a question (world space, above XELIAX)
function drawIdleBubble(){
  if(state !== 'play') return;
  if(idle.phase === 'think'){
    const text = idle.t >= IDLE_FLIP - 130 ? 'Bon… et si je faisais un salto ?' : IDLE_Q[idle.q];
    const pop = easeOutBack(clamp(idle.qT / 14, 0, 1));
    const px = ix(player) + player.w / 2, top = iy(player) - 4;
    ctx.font = `600 11px ${FU}`;
    const lines = wrapLines(text, 150);
    const tw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 24, th = lines.length * 14 + 14;
    const bx = clamp(px + 6, viewX + 6, viewX + W - 6 - tw);
    const by = Math.max(viewY + 44, top - 30 - th);
    ctx.save();
    ctx.globalAlpha = clamp(idle.qT / 8, 0, 1) * 0.97;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#1d1442'; ctx.lineWidth = 1.3;
    for(const [dx, dy, r] of [[2, -4, 2.2], [6, -12, 3.2], [11, -22, 4.2]]){ ctx.beginPath(); ctx.arc(px + dx, top + dy, r, 0, TAU); ctx.fill(); ctx.stroke(); }
    ctx.translate(bx + tw / 2, by + th / 2); ctx.scale(pop, pop); ctx.translate(-(bx + tw / 2), -(by + th / 2));
    // a puffy cloud: rounded box with bumps
    ctx.beginPath();
    rr(bx, by, tw, th, 12);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1d1442';
    lines.forEach((ln, i) => txt(ln, bx + tw / 2, by + 18 + i * 14, 11, '#1d1442', 600));
    const q = Math.sin(frame * 0.12);
    outlined('?', bx + tw - 4, by - 2 + q * 2, 15, '#ffd54a', '#1d1442', 3, FD, 400, 'center');
    ctx.restore();
  } else if(idle.phase === 'ko'){
    // stars spinning over the poor head, and how to get him up
    const px = ix(player) + player.w / 2, py = iy(player) + player.h;
    for(let i = 0; i < 3; i++){
      const a = frame * 0.12 + i * TAU / 3;
      ctx.fillStyle = i % 2 ? '#ffffff' : '#ffe066'; star(px + Math.cos(a) * 15, py - 36 + Math.sin(a) * 4.5, 3.6, frame * 0.1);
    }
    if(idle.koT > 30){
      const a = clamp((idle.koT - 30) / 12, 0, 1);
      const keyLabel = TOUCH ? '▲' : 'Espace';
      ctx.save(); ctx.globalAlpha = a;
      ctx.font = `700 11px ${FU}`;
      const kw = Math.max(19, ctx.measureText(keyLabel).width + 13);
      ctx.font = `600 11px ${FU}`;
      const label = 'XELIAX est sonné : 3 fois';
      const lw = ctx.measureText(label).width, tw = lw + kw + 16 + 50;
      const bx = clamp(px - tw / 2, viewX + 6, viewX + W - 6 - tw), by = Math.max(viewY + 44, py - 70);
      rr(bx, by, tw, 26, 13); ctx.fillStyle = 'rgba(14,9,34,0.88)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,229,138,0.7)'; ctx.lineWidth = 1.2; ctx.stroke();
      txt(label, bx + 10, by + 17, 11, '#ffffff', 600, 'left');
      keycap(keyLabel, bx + 14 + lw, by + 17);
      for(let i = 0; i < 3; i++){
        ctx.fillStyle = i < idle.presses ? '#ffe58a' : 'rgba(255,255,255,0.25)';
        ctx.beginPath(); ctx.arc(bx + tw - 38 + i * 12, by + 13, 3.6, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }
}

// =====================================================================
//  BOSS CINEMATICS: 5 s before a fight starts, 4 s when a boss turns furious.
//  XELIAX can't be hurt meanwhile, the boss doesn't attack, the timer pauses.
// =====================================================================
const BOSS_EPITHET = {
  slime:'Souverain gélatineux des Grottes',
  gecko:'Il colle à toutes les parois',
  yeti:'Rien ne l\'arrête… sauf un mur',
  magpie:'Elle ne rendra pas la ficelle sans se battre',
  swoop:'Sentinelle des remparts',
  arena:'Le voleur de la ficelle aux olives',
  ascent:'Il ne lâchera pas la ficelle aux olives',
};
let cine = null, fightPop = 0;
const seenCine = new Set();

function startCine(kind){
  const id = `${chIndex}-${rIndex}-${kind}`;
  const b = boss;
  cine = {kind, t:0, dur:kind === 'intro' ? 300 : 240, skippable:seenCine.has(id), skip:false, walkTo:null,
          bandY:kind === 'intro' && b && (b.mode === 'slime' || b.mode === 'yeti') ? 150 : 238};
  seenCine.add(id);
  bullets = []; shots = [];
  fightPop = 0;
  if(!b) return;
  player.facing = b.x + b.w / 2 > player.x + player.w / 2 ? 1 : -1;
  if(kind === 'intro'){
    bannerT = 0;
    if(b.mode === 'slime'){ b.y = -150; b.vy = 0; b.onGround = false; b.squash = 0; }
    else if(b.mode === 'swoop'){ b.cx0 = W + 70; b.cy0 = -70; b.tx = b.x; b.x = b.cx0; b.y = b.cy0; b.state = 'hover'; }
    else if(b.mode === 'arena'){ b.appear = 0; }
    else if(b.mode === 'ascent'){ b.y = room.h + 80; }
    else if(b.mode === 'gecko'){ b.side = -1; b.x = geckoWallX(b, -1); b.y = -90; b.state = 'climb'; }
    else if(b.mode === 'yeti'){ b.y = -140; b.vy = 0; b.state = 'walk'; b.face = -1; }
    else if(b.mode === 'magpie'){ b.cx0 = W + 70; b.cy0 = -60; b.tx = b.x; b.x = b.cx0; b.y = b.cy0; b.state = 'hover'; }
  }
  b.px = b.x; b.py = b.y;
}

function updateCine(){
  const c = cine, b = boss;
  c.t++;
  if(c.skippable && !c.skip && c.t > 20 && input.jumpPressed){ c.skip = true; c.dur = Math.min(c.dur, c.t + 18); }
  input.jumpPressed = false;
  if(b && b.alive && c.kind === 'intro'){
    if(b.mode === 'slime'){
      if(!b.onGround){
        if(c.t > 40){
          b.vy += 0.5; b.y += b.vy;
          if(b.y + b.h >= FLOOR){
            b.y = FLOOR - b.h; b.onGround = true; b.vy = 0; b.squash = 0.45;
            addShake(12); dust(b.x + b.w / 2, FLOOR, 20); ring(b.x + b.w / 2, FLOOR - 4, '#ffffff', 6, 80, 26); SFX.thud();
          }
        }
      } else {
        if(c.t === 150){ SFX.bossFlee(); addShake(6); }
        b.squash = c.t > 150 && c.t < 210 ? Math.sin((c.t - 150) * 0.5) * 0.2 * (1 - (c.t - 150) / 60) : b.squash + (0 - b.squash) * 0.12;
      }
    } else if(b.mode === 'swoop'){
      const k = easeInOutCubic(clamp((c.t - 20) / 130, 0, 1));
      b.x = lerp(b.cx0, b.tx, k) - Math.sin(k * Math.PI) * 120;
      b.y = lerp(b.cy0, 55, k) + Math.sin(k * Math.PI) * 90;
      if(c.t === 170){ SFX.warn(); addShake(5); burst(b.x + b.w / 2, b.y + b.h / 2, 14, '#cdd9ff', 3, 40, 0.05, 4, 'puff'); }
      b.cineGlow = c.t > 170 && c.t < 215;
    } else if(b.mode === 'arena'){
      b.appear = clamp((c.t - 30) / 70, 0, 1);
      if(c.t === 30) ring(b.x + b.w / 2, b.y + b.h / 2, '#ff5c9a', 70, 4, 30);
      if(c.t === 150){ SFX.bossFlee(); addShake(6); ring(b.x + b.w / 2, b.y + b.h / 2, '#ff5c9a', 8, 90, 30); }
    } else if(b.mode === 'gecko'){
      // it crawls down the left wall, then hisses
      b.t++;
      b.y = lerp(-90, 150, easeOutCubic(clamp((c.t - 20) / 120, 0, 1)));
      if(c.t === 150){ SFX.bossFlee(); addShake(6); b.fireT = 5; }
      if(c.t > 150 && c.t < 200 && c.t % 10 === 0) burst(b.x + b.w, b.y + b.h / 2, 3, '#9dff5a', 2, 20, 0.1, 3, 'goo');
    } else if(b.mode === 'yeti'){
      b.t++;
      if(b.y < FLOOR - b.h && c.t > 40){
        b.vy += 0.55; b.y += b.vy;
        if(b.y >= FLOOR - b.h){ b.y = FLOOR - b.h; b.vy = 0; addShake(14); dust(b.x + b.w / 2, FLOOR, 22); ring(b.x + b.w / 2, FLOOR - 4, '#ffffff', 6, 90, 26); SFX.thud(); }
      }
      if(c.t === 160){ b.state = 'roar'; SFX.bossFlee(); addShake(8); }
      if(c.t === 230) b.state = 'walk';
    } else if(b.mode === 'magpie'){
      b.t++;
      const k = easeInOutCubic(clamp((c.t - 20) / 130, 0, 1));
      b.x = lerp(b.cx0, b.tx, k) - Math.sin(k * Math.PI) * 140;
      b.y = lerp(b.cy0, 150, k) + Math.sin(k * Math.PI) * 70;
      b.face = -1;
      if(c.t === 165){ SFX.warn(); addShake(5); sparkle(b.x + b.w + 10, b.y + b.h / 2 - 4, 12, '#ffe066'); }
    } else if(b.mode === 'ascent'){
      const k = easeOutCubic(clamp((c.t - 30) / 110, 0, 1));
      b.y = lerp(room.h + 80, 880, k);
      b.x += (W / 2 - b.w / 2 - b.x) * 0.05;
      if(c.t % 4 === 0 && k < 1) burst(b.x + b.w / 2, b.y + b.h, 3, '#ff8a3c', 1.5, 22, 0.05, 3);
      if(c.t === 150){ SFX.bossFlee(); addShake(8); ring(b.x + b.w / 2, b.y + b.h / 2, '#ff5c9a', 8, 90, 30); }
    }
  } else if(b && b.alive){
    // turning furious: the boss shudders and flashes, then the arena changes
    b.hitT = c.t < 120 && c.t % 16 < 8 ? 2 : 0;
    if(b.mode === 'swoop'){ b.x += (b.tx - b.x) * 0.04; b.y += (55 - b.y) * 0.06; b.state = 'hover'; }
    if(b.mode === 'slime') b.squash = c.t < 120 ? Math.sin(c.t * 0.4) * 0.12 : b.squash * 0.85;
    if(c.t === 2){ addShake(8); SFX.bossFlee(); }
    if(c.t === 120){ addShake(10); ring(b.x + b.w / 2, b.y + b.h / 2, '#ff6b6b', 8, 100, 30); burst(b.x + b.w / 2, b.y + b.h / 2, 30, '#ff6b6b', 5, 45); }
    if(c.t === 150 && spikes.some(s => s.pending)) SFX.crumble();
    for(const s of spikes) if(s.pending && c.t >= 150) s.appear = clamp((c.t - 150) / 60, 0, 1);
  }
  // phase 2: XELIAX walks off the strip where the spikes are about to come out
  if(c.kind === 'phase2' && c.walkTo === null){
    const zone = (room.phase2Spikes || [])[0];
    if(zone && player.onGround && player.y + player.h >= FLOOR - 2){
      const pc = player.x + player.w / 2;
      if(pc > zone.x - 16 && pc < zone.x + zone.w + 16) c.walkTo = pc - zone.x < zone.x + zone.w - pc ? zone.x - 26 : zone.x + zone.w + 26;
    }
  }
  if(c.t >= c.dur && player.onGround && c.walkTo === null) finishCine();
}

function finishCine(){
  const b = boss, k = cine ? cine.kind : null;
  cine = null;
  if(b && b.alive){
    b.appear = 1; b.cineGlow = false; b.hitT = 0;
    if(k === 'intro'){
      if(b.mode === 'slime'){ b.y = FLOOR - b.h; b.onGround = true; b.vx = 0; b.vy = 0; b.squash = 0; b.hopT = 50; }
      else if(b.mode === 'swoop'){ b.x = b.tx; b.y = 55; b.state = 'hover'; b.stT = 200; b.fireT = 70; }
      else if(b.mode === 'arena'){ b.fireT = 80; }
      else if(b.mode === 'ascent'){ b.y = 880; b.fireT = 100; }
      else if(b.mode === 'gecko'){ b.y = 150; b.x = geckoWallX(b, -1); b.side = -1; b.state = 'crawl'; b.stT = 130; b.fireT = 50; }
      else if(b.mode === 'yeti'){ b.y = FLOOR - b.h; b.state = 'walk'; b.stT = 150; b.fireT = 70; }
      else if(b.mode === 'magpie'){ b.x = b.tx; b.y = 150; b.state = 'hover'; b.stT = 80; b.fireT = 60; }
    } else {
      b.inv = 30;
      if(b.mode === 'slime'){ b.squash = 0; b.hopT = 40; }
      if(b.mode === 'swoop'){ b.state = 'hover'; b.stT = 140; b.fireT = 50; }
      if(b.mode === 'magpie'){ b.state = 'rise'; }
    }
  }
  for(const s of spikes) if(s.pending) s.pending = false;
  fightPop = 60;
  SFX.power();
  if(k === 'intro' && room.shootUp) showToast('Tes tirs partent vers le haut !', 170);
}

// how far the letterbox bars are in (0 to 1)
function cineBars(){
  if(!cine) return 0;
  return easeOutCubic(clamp(Math.min(cine.t / 18, (cine.dur - cine.t) / 18), 0, 1));
}

// =====================================================================
//  TALKING TO PEOPLE (each one teaches a step of the ficelle aux olives)
// =====================================================================
let npcs = [], nearNpc = null, talk = null;

function interact(){
  if(state === 'talk'){ advanceTalk(); return true; }
  if(state === 'play' && nearNpc && player.onGround && !player.dead && !cine && finaleT === 0 && exitT === 0 && fadeDir === 0){
    talk = {npc:nearNpc, data:NPCS[nearNpc.who], line:0, chars:0, blip:0};
    player.vx = 0;
    player.facing = nearNpc.x + 13 > player.x + player.w / 2 ? 1 : -1;
    setState('talk');
    SFX.menu();
    return true;
  }
  return false;
}
function endTalk(){ talk = null; setState('play'); }
function advanceTalk(){
  if(!talk) return;
  const D = talk.data, L = D.lines[talk.line];
  if(talk.chars < L.length){ talk.chars = L.length; return; }
  talk.line++; talk.chars = 0; talk.blip = 0;
  if(talk.line < D.lines.length){ SFX.menu(); return; }
  if(D.step == null){
    save.talked = save.talked || {}; save.talked[talk.npc.who] = true; persist();
    endTalk();
    return;
  }
  const isNew = !save.recipe[D.step];
  save.recipe[D.step] = true; persist();
  const n = talk.npc;
  endTalk();
  if(isNew){
    const all = save.recipe.every(Boolean);
    showToast(all ? 'Tu connais toute la recette de la ficelle aux olives !' : `Recette apprise : étape ${D.step + 1} sur 4`, all ? 170 : 130);
    sparkle(n.x + 13, n.y - 30, 14, '#ffe066');
    SFX.key();
  }
}
function animNpcs(){
  for(const n of npcs){
    n.t += 0.05;
    if(n.blink > 0) n.blink--;
    else if(Math.random() < 0.006) n.blink = 7;
  }
}
function stepTalk(){
  animNpcs();
  if(!talk) return;
  const L = talk.data.lines[talk.line];
  if(talk.chars < L.length){
    talk.chars = Math.min(L.length, talk.chars + 1.5);
    const shown = Math.floor(talk.chars);
    if(shown >= talk.blip + 3){
      talk.blip = shown;
      if(L[shown - 1] !== ' ') tone(talk.data.voice * (0.9 + Math.random() * 0.2), 0.035, 'triangle', 0.025);
    }
  }
}

// game over in a bonus room: only that room starts again
function restartRoom(){
  continues++;
  lives = startLives();
  loadRoom(chIndex, rIndex);
  bannerT = 0;
  player.invuln = 60;
  anim.appear = 0;
  setState('play');
  showToast('On recommence la salle', 90);
}

// =====================================================================
//  UPDATE
// =====================================================================
function clearPresses(){ input.jumpPressed = input.shootPressed = input.dashPressed = false; }

// remember where everything was before this step, so frames between steps can be interpolated
function snapshot(){
  prevCamX = camX; prevCamY = camY;
  player.px = player.x; player.py = player.y;
  for(const list of [platforms, enemies, bats, bullets, shots, particles]) for(const e of list){ e.px = e.x; e.py = e.y; }
  if(boss){ boss.px = boss.x; boss.py = boss.y; }
}
const ix = e => e.px === undefined ? e.x : e.px + (e.x - e.px) * ALPHA;
const iy = e => e.py === undefined ? e.y : e.py + (e.y - e.py) * ALPHA;

function step(){
  snapshot();
  frame++; stateT++;
  updateParticles();
  updatePopups();
  updateAmbient();
  updateHud();
  if(shake > 0){ shake *= 0.86; if(shake < 0.25) shake = 0; }
  if(toast.t > 0) toast.t--;
  if(bannerT > 0 && state === 'play') bannerT--;

  if(fadeDir !== 0){
    fade += fadeDir * 0.045;
    if(fade >= 1 && fadeDir > 0){
      fade = 1;
      const f = pendingAction; pendingAction = null;
      if(f) f();
      fadeDir = -1;
    } else if(fade <= 0 && fadeDir < 0){ fade = 0; fadeDir = 0; }
    if(fadeDir > 0){
      if(state === 'play'){ if(exitT > 0) updateExit(); stepHero(); }
      clearPresses();
      return;
    }
  }

  if(state === 'title'){ updateMenu(); clearPresses(); return; }
  if(state === 'pet'){ updatePet(); clearPresses(); return; }
  if(state === 'ending'){ updateEnding(); clearPresses(); return; }
  if(state === 'talk'){ stepTalk(); stepHero(); clearPresses(); return; }
  if(state !== 'play'){ updateUiHero(); clearPresses(); return; }

  // the final blow freezes the action for a split second
  if(hitStop > 0){ hitStop--; updateCamera(); clearPresses(); return; }
  if(djTake > 0 && --djTake === 0){
    showToast('Gaston te confisque ton double saut : ici, on grimpe !', 190);
    ring(player.x + player.w / 2, player.y + player.h / 2, POWER_COLORS.doubleJump, 6, 46, 26);
    burst(player.x + player.w / 2, player.y + player.h / 2, 10, POWER_COLORS.doubleJump, 2.4, 30, 0.02, 3, 'star');
    SFX.warn();
  }
  if(cine) updateCine();
  if(!timerRunning && !cine && (input.left || input.right || input.jumpPressed || input.shootPressed)) timerRunning = true;
  if(timerRunning && !cine) elapsed += STEP;        // the clock waits during cinematics
  if(phaseT > 0 && --phaseT === 0) transition(() => loadRoom(chIndex, rIndex + 1));

  updateWorld();

  if(exitT > 0){ updateExit(); updateCamera(); stepHero(); clearPresses(); return; }
  if(finaleT > 0){
    // a little celebration, then XELIAX waits with the ficelle until Space is pressed
    const go = finaleT >= finaleEnd() && input.jumpPressed;
    finaleT++;
    updateCamera();
    updatePlayer();           // controls are ignored during the finale
    stepCharAnim(anim, {vx:player.vx, vy:player.vy, onGround:player.onGround, facing:player.facing, cheer:!steal || finaleT < 200});
    anim.sx = player.sx; anim.sy = player.sy;
    if(steal) updateSteal(finaleT);
    else if(frame % 22 === 0) confetti(player.x + player.w / 2, player.y - 6, finaleT < finaleEnd() ? 12 : 4);
    if(go){ SFX.menu(); if(room.ending2) startEnding(); else chapterClear(); }
    clearPresses();
    return;
  }
  updateCamera();

  if(player.dead){
    if(--respawnT <= 0){
      resetPlayer();
      // a climb against rising lava starts again from the bottom
      if(room.lava && !room.boss){ lavaY = room.lava.start; lavaDelay = room.lava.delay; }
      player.invuln = 90;
      anim.appear = 0;
      ring(player.x + player.w/2, player.y + player.h/2, HERO.light, 4, 36, 24);
      sparkle(player.x + player.w/2, player.y + 6, 10, '#ffffff');
      SFX.bloop();
    }
    clearPresses();
    return;
  }
  updatePlayer();
  if(state === 'play') updateIdle();
  stepHero();
  clearPresses();
}

// t 1-100 cheering, 100-190 little hops of joy, 200 he's about to eat it, 205-245 the magpie swoops in, 245 snatch, then she's off
function updateSteal(t){
  const S = steal, hx = player.x + player.w / 2 + player.facing * 14, hy = player.y + 6;
  S.px = S.x; S.py = S.y;
  if(t < 100 && frame % 22 === 0) confetti(player.x + player.w / 2, player.y - 6, 10);
  if(t >= 100 && t < 190 && (t - 100) % 30 === 0 && player.onGround){
    player.vy = -6; player.onGround = false; player.standingOn = null; player.sy = 0.8; player.sx = 1.2;
    tone(660 + (t - 100) * 4, 0.08, 'triangle', 0.04); confetti(player.x + player.w / 2, player.y - 6, 6);
  }
  if(t === 200){ setFace(anim, 'smile', 30); showToast('Miam… enfin ma ficelle aux olives !', 70); }
  if(t === 228){ setFace(anim, 'open', 40); tone(520, 0.08, 'sine', 0.04); }
  if(t === 205){ S.on = true; S.x0 = camX + W + 70; S.y0 = camY - 60; SFX.warn(); }
  if(S.on && !S.got){
    // down from the top right in a curve, straight to the ficelle
    const q = clamp((t - 205) / 40, 0, 1), e = q * q, cx = hx + 140, cy = hy - 170;
    S.x = (1 - e) * (1 - e) * S.x0 + 2 * (1 - e) * e * cx + e * e * hx - S.w / 2;
    S.y = (1 - e) * (1 - e) * S.y0 + 2 * (1 - e) * e * cy + e * e * hy - S.h / 2;
    S.state = q > 0.55 ? 'dive' : 'hover'; S.vx = -3; S.vy = 3;
    if(t === 245){
      S.got = true; S.lost = false; S.state = 'hover'; S.x1 = S.x; S.y1 = S.y;
      SFX.crack(); addShake(5); setFace(anim, 'o', 140);
      player.vy = -3.5; player.onGround = false; player.standingOn = null; player.sx = 0.75; player.sy = 1.3;
      burst(hx, hy, 12, '#1a1430', 2.2, 30, 0.04, 3, 'puff');
      for(let i = 0; i < 8; i++) particles.push({x:hx, y:hy, vx:(Math.random() - 0.5) * 3, vy:-1 - Math.random() * 2, life:60, max:60, color:'#f4f2ff', grav:0.04, size:3, type:'dot'});
      showToast('La pie ! Elle a volé la ficelle aux olives !', 200);
    }
  } else if(S.got){
    // and off she goes, up and away to the left, cackling
    const k = t - 245, q = clamp(k / 70, 0, 1);
    S.x = S.x1 - k * 4.6 - q * q * 60; S.y = S.y1 - k * 0.9 - Math.sin(k * 0.2) * 8;
    S.face = -1; S.state = 'hover';
    if(k % 14 === 0 && k < 60) tone(1200 - k * 6, 0.06, 'square', 0.025, 900 - k * 4);
    if(k === 30){ setFace(anim, 'hurt', 120); player.vy = -6.5; player.onGround = false; player.standingOn = null; }
    if(k === 50){ player.vy = -6.5; player.onGround = false; player.standingOn = null; }
    if(k === 95) showToast('À suivre… Saison 2 : la pie voleuse !', 220);
    if(k > 100) S.on = false;
  }
}
function drawSteal(){
  if(!steal || !steal.on) return;
  drawMagpie(steal);
}
function finaleEnd(){ return room && room.ending2 ? 80 : steal ? STEAL_END : 150; }
const STEAL_END = 380;
function drawFinalePrompt(){

function startExit(){
  if(exitT > 0) return;
  exitT = 1;
  exitKind = rIndex < chapter.rooms.length - 1 ? 'room' : 'chapter';
  score += 100;
  SFX.door();
  door.glow = 1;

}
// the hero waddles into the doorway and shrinks away before the next room
function updateExit(){
  exitT++;
  const tx = door.x + door.w/2 - player.w/2, ty = door.ceil ? door.y : door.y + door.h - player.h;
  player.x += (tx - player.x) * 0.18;

function updateUiHero(){

}

function updateHud(){
  if(fightPop > 0 && state === 'play') fightPop--;
  if(hud.coinBump > 0) hud.coinBump = Math.max(0, hud.coinBump - 0.07);
  if(lives < hud.lastLives){ hud.lostIdx = lives; hud.lostT = 1; }
  else if(lives > hud.lastLives){ hud.gainIdx = lives - 1; hud.gainT = 1; }
  hud.lastLives = lives;
  if(hud.lostT > 0) hud.lostT = Math.max(0, hud.lostT - 0.035);
  if(hud.gainT > 0) hud.gainT = Math.max(0, hud.gainT - 0.045);
  if(hud.flash > 0) hud.flash = Math.max(0, hud.flash - 0.05);
  for(const f of flyers){ f.t += 1 / 32; if(f.t >= 1 && !f.done){ f.done = true; hud.coinBump = 1; } }
  flyers = flyers.filter(f => f.t < 1);
  if(boss && boss.alive){
    const target = boss.hp / boss.maxHp;
    hud.bossShown += (target - hud.bossShown) * 0.25;
    if(hud.bossTrail < hud.bossShown) hud.bossTrail = hud.bossShown;
    else hud.bossTrail += (hud.bossShown - hud.bossTrail) * 0.05;
  }
}

function updatePopups(){
  for(const p of popups) p.t++;
  popups = popups.filter(p => p.t < 50);
}

// moving scenery without the player (title preview)
function updateDecor(){
  for(const p of platforms){
    p.dx = p.dy = 0;
    if(!p.move) continue;
    const a = p.move.axis;
    p[a] += p.move.speed * p.move.dir;
    if(p[a] < p.move.min){ p[a] = p.move.min; p.move.dir = 1; }
    if(p[a] > p.move.max){ p[a] = p.move.max; p.move.dir = -1; }
  }
  updateWalkers();
  updateBats();
}

// the final boss's special attacks (season 1, last phase): 50 frames of charging (he glows and trembles), then the attack
function updateAscentSpecial(b){
  const s = b.special, t = ++s.t, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const angry = b.hp <= b.enrage;
  b.y += (room.barrierY + 70 - b.y) * 0.05;
  b.x += (W / 2 - b.w / 2 - b.x) * 0.04;
  if(t < 50){
    b.hitT = t % 10 < 5 ? 2 : 0;
    if(t % 3 === 0) particles.push({x:cx + (Math.random() - 0.5) * 70, y:cy + (Math.random() - 0.5) * 70, vx:0, vy:0, tx:cx, ty:cy, life:20, max:20, color:'#ff5c9a', grav:0, size:3, type:'dot', drag:0.9});
    if(t === 49){ ring(cx, cy, '#ff5c9a', 8, 80, 24); SFX.bossFlee(); }
    return;
  }
  b.hitT = 0;
  const fire = (x, y, a, v) => bullets.push({x:x - 5, y:y - 5, w:10, h:10, vx:Math.cos(a) * v, vy:Math.sin(a) * v, kind:'boss'});
  if(s.kind === 'pluie'){
    // fireballs fall from the top of the screen, a gap always left somewhere
    if(t % (angry ? 9 : 12) === 0 && t < 230){
      const x = 20 + Math.random() * (W - 40);
      bullets.push({x:x - 5, y:camY - 20, w:10, h:10, vx:0, vy:2.6, kind:'boss'});
    }
    if(t % 30 === 0 && t < 230) SFX.bossShot();
  } else if(s.kind === 'anneau'){
    if(t === 50 || t === 100 || t === 150 || (angry && t === 200)){
      const n = 14, off = (t / 50) % 2 ? Math.PI / n : 0;
      for(let i = 0; i < n; i++) fire(cx, cy, off + i * TAU / n, 2.3);
      SFX.bossShot(); ring(cx, cy, '#ff8a3c', 6, 60, 18);
    }
  } else if(s.kind === 'spirale'){
    if(t % 6 === 0 && t < 230){
      const a = t * 0.11;
      fire(cx, cy, a, 2.4); fire(cx, cy, a + Math.PI, 2.4);
      if(angry) fire(cx, cy, a + Math.PI / 2, 2.4);
      if(t % 18 === 0) SFX.bossShot();
    }
  }
  if(t >= 260){ b.special = null; b.fireT = 60; }
}

const PLANK_SHAKE = 26, PLANK_G = 0.42, PLANK_MAX = 9;
// lift planks (lift:true) hang from a little parachute: they let go almost at once and drift down slowly, carrying XELIAX
const LIFT_SHAKE = 10, LIFT_G = 0.1, LIFT_MAX = 2.2;
function updatePlank(p){
  p.px = p.x; p.py = p.y;
  // again:true planks drift back home a little after they have landed (so a missed throw can be tried again)
  if(p.again && p.landT > 0 && ++p.landT > 80){
    p.landT = 0; p.gone = true; p.rT = 40;
    burst(p.x + p.w / 2, p.y + p.h / 2, 8, '#ffffff', 1.5, 22, -0.01, 3, 'puff');
    if(player.standingOn === p){ player.standingOn = null; player.onGround = false; }
    return;
  }
  if(p.gone){
    if(--p.rT <= 0){ p.gone = false; p.x = p.ox; p.y = p.oy; p.px = p.x; p.py = p.y; p.loose = !!p.free; p.fT = 0; p.fvy = 0; p.landT = 0; p.appear = 0; sparkle(p.x + p.w / 2, p.y + p.h / 2, 6, '#fff3c4'); }
    return;
  }
  if(!p.loose){
    if(p.fT > 0){
      if(frame % 5 === 0) crumbs(p.x + Math.random() * p.w, gdir > 0 ? p.y + p.h : p.y, 1, '#9a6234');
      if(++p.fT > (p.lift ? LIFT_SHAKE : PLANK_SHAKE)){ p.loose = true; p.fvy = 0; tone(p.lift ? 260 : 140, 0.12, p.lift ? 'triangle' : 'sawtooth', 0.03, p.lift ? 200 : 90); }
    }
    return;
  }
  // loose: it falls the way gravity pulls, and lands on whatever is in the way
  const g = gdir, y0 = p.y, top = p.lift ? LIFT_MAX : PLANK_MAX;
  p.fvy = clamp(p.fvy + (p.lift ? LIFT_G : PLANK_G) * g, -top, top);
  let ny = p.y + p.fvy, hit = null;
  const across = q => p.x + p.w > q.x + 2 && p.x < q.x + q.w - 2;
  if(p.fvy > 0){
    for(const q of platforms){ if(q === p || q.gone || !across(q)) continue; if(p.y + p.h <= q.y + 0.5 && ny + p.h >= q.y && (!hit || q.y < hit)) hit = q.y; }
    for(const t of spikes){ if(t.down || t.side || t.lava || t.pending || !across(t)) continue; const top = t.y - 10; if(p.y + p.h <= top + 0.5 && ny + p.h >= top && (hit === null || top < hit)) hit = top; }
    if(hit !== null) ny = hit - p.h;
  } else if(p.fvy < 0){
    for(const q of platforms){ if(q === p || q.gone || !across(q)) continue; const b = q.y + q.h; if(p.y >= b - 0.5 && ny <= b && (hit === null || b > hit)) hit = b; }
    for(const t of spikes){ if(!t.down || t.pending || !across(t)) continue; const bt = t.y + 10; if(p.y >= bt - 0.5 && ny <= bt && (hit === null || bt > hit)) hit = bt; }
    if(hit !== null) ny = hit;
  }
  if(hit !== null){
    if(Math.abs(p.fvy) > 3.5){
      SFX.thud(); addShake(Math.min(4, Math.abs(p.fvy) * 0.4));
      for(let i = 0; i < 6; i++) particles.push({x:p.x + Math.random() * p.w, y:g > 0 ? ny + p.h : ny, vx:(Math.random() - 0.5) * 2.4, vy:-g * Math.random() * 1.6, life:22, max:22, color:'#e8d6b0', grav:0.05 * g, size:3, type:'dot'});
    }
    if(p.again && !p.landT) p.landT = 1;
    p.fvy = 0;
  }
  p.y = ny; p.dy = p.y - y0;
  // a falling plank squashes the walkers and bats in its way
  if(Math.abs(p.dy) > 2){
    for(const e of [...enemies, ...bats]){
      if(!e.alive || (e.on !== undefined && platforms[e.on] === p) || !overlap(p, e)) continue;
      e.alive = false; score += 25; killFx(e); SFX.thud();
      showToast('Écrasé par la planche !', 70);
    }
  }
  // too far: it's lost, a new one appears where it was a little later
  if(p.y > room.h + 80 || p.y + p.h < -80){ p.gone = true; p.rT = 150; if(player.standingOn === p){ player.standingOn = null; player.onGround = false; } }
}

function updateWalkers(){
  for(const e of enemies){
    if(!e.alive) continue;
    const p = platforms[e.on];
    e.t += 0.15;
    e.off += e.speed * e.dir;
    const maxOff = Math.min(e.to, p.w) - e.w;
    if(e.off < e.from){ e.off = e.from; e.dir = 1; }
    if(e.off > maxOff){ e.off = maxOff; e.dir = -1; }
    e.x = p.x + e.off;
    e.y = e.ceil ? p.y + p.h : p.y - e.h;
  }
}
function updateBats(){
  for(const b of bats){
    if(!b.alive) continue;
    b.t += b.speed;
    b.x = b.x0 + Math.sin(b.t) * b.ax;
    b.y = b.y0 + Math.sin(b.t * 2) * b.ay;
    b.face = Math.cos(b.t) >= 0 ? 1 : -1;
  }
}

function updateWorld(){
  // rising lava
  if(room.lava){
    if(boss && boss.alive){ /* the lava waits until the boss is beaten */ }
    else if(lavaDelay > 0){ if(--lavaDelay === 0) showToast('La lave monte ! Grimpe !', 100); }
    else lavaY = Math.max(room.lava.min, lavaY - room.lava.speed);
    if(frame % 6 === 0) particles.push({x:Math.random()*W, y:lavaY, vx:0, vy:-0.8 - Math.random(), life:30, max:30, color:'#ffb347', grav:0.02, size:2.5, type:'dot'});
  }

  // platforms (moving + crumbling)
  for(const p of platforms){
    p.dx = p.dy = 0;
    if(p.appear < 1) p.appear = Math.min(1, p.appear + 0.07);
    if(p.crumble){
      if(p.gone){
        if(--p.rT <= 0 && !overlap(player, {x:p.x, y:p.y - 4, w:p.w, h:p.h + 4})){
          p.gone = false; p.cT = 0; p.appear = 0;
          sparkle(p.x + p.w/2, p.y + p.h/2, 6, '#fff3c4');
        }
      } else if(p.cT > 0){
        if(frame % 4 === 0) crumbs(p.x + Math.random() * p.w, p.y + p.h, 1, '#b8844f');
        if(++p.cT > 40){
          p.gone = true; p.rT = 200;
          crumbs(p.x + p.w/2, p.y + p.h/2, 14, '#c99a62');
          burst(p.x + p.w/2, p.y + p.h/2, 8, '#ffffff', 1.5, 22, -0.01, 3, 'puff');
          SFX.crumble();
          if(player.standingOn === p){ player.standingOn = null; player.onGround = false; }
        }
      }
    }
    if(p.fall){ updatePlank(p); continue; }
    if(!p.move) continue;
    const a = p.move.axis, prev = p[a];
    p[a] += p.move.speed * p.move.dir;
    if(p[a] < p.move.min){ p[a] = p.move.min; p.move.dir = 1; }
    if(p[a] > p.move.max){ p[a] = p.move.max; p.move.dir = -1; }
    if(a === 'x') p.dx = p[a] - prev; else p.dy = p[a] - prev;
  }
  for(const s of springs){ if(s.t > 0) s.t--; if(s.anim > 0) s.anim = Math.max(0, s.anim - 0.035); }
  for(const g of solids) if(g.flash > 0) g.flash--;
  for(const c of checkpoints) c.raise = c.active ? Math.min(1, c.raise + 0.05) : Math.max(0, c.raise - 0.05);
  for(const s of spikes) if(s.appear !== undefined && s.appear < 1 && !s.pending) s.appear = Math.min(1, s.appear + 0.05);
  // people: the closest one within reach can be talked to
  animNpcs();
  nearNpc = null;
  if(!player.dead && !cine){
    let bn = 34;
    for(const n of npcs){
      const d = Math.abs(player.x + player.w/2 - (n.x + 13));
      if(d < bn && Math.abs(player.y + player.h - n.y) < 24){ bn = d; nearNpc = n; }
    }
  }
  for(const n of npcs) n.near = clamp(n.near + (n === nearNpc ? 0.12 : -0.12), 0, 1);
  // only the closest sign talks (none while someone is in reach), so bubbles never pile up
  let nearest = null, best = 61;
  for(const sg of signs){
    const d = Math.abs(player.x + player.w/2 - (sg.x + 10));
    if(d < best && Math.abs((sg.ceil ? player.y : player.y + player.h) - sg.y) < 70 && !player.dead){ best = d; nearest = sg; }
  }
  if(nearNpc || cine || idle.phase) nearest = null;
  for(const sg of signs) sg.show = clamp(sg.show + (sg === nearest ? 0.12 : -0.12), 0, 1);
  if(door){ if(door.shake > 0) door.shake = Math.max(0, door.shake - 0.04); if(door.glow > 0) door.glow = Math.max(0, door.glow - 0.02); }

  updateWalkers();
  updateBats();

  // turrets fire only when on screen; they glow while charging
  for(const t of turrets){
    if(!t.alive) continue;
    if(t.flash > 0) t.flash--;
    const onScreen = t.x > camX - 40 && t.x < camX + W + 40 && t.y > camY - 40 && t.y < camY + H + 40;
    if(!onScreen) continue;
    if(++t.t >= t.rate){
      t.t = 0;
      const cx = t.x + 12, cy = t.y + 12;
      let vx = 0, vy = 0;
      if(t.dir === 'left') vx = -3;
      else if(t.dir === 'right') vx = 3;
      else if(t.dir === 'down') vy = 3;
      else {
        const a = Math.atan2(player.y + player.h/2 - cy, player.x + player.w/2 - cx);
        vx = Math.cos(a) * 2.8; vy = Math.sin(a) * 2.8;
      }
      bullets.push({x:cx - 5, y:cy - 5, w:10, h:10, vx, vy, kind:'turret'});
      t.flash = 6;
      burst(cx + Math.sign(vx || 0.001) * 12 * (vx ? 1 : 0), cy + (vy ? 12 : 0), 4, '#ffd27a', 1.5, 14, 0, 2.2, 'puff');
      SFX.turret();
    }
  }

  updateBoss();
  if(key && key.fall && !key.got){
    key.vy += 0.22; key.y += key.vy; key.rot = (key.rot || 0) + 0.16;
