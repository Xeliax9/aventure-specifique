    if(key.y + key.h >= FLOOR - 4 && key.vy > 0){
      key.y = FLOOR - 4 - key.h;
      if(key.vy > 2.5){ key.vy *= -0.4; dust(key.x + key.w / 2, FLOOR, 6); SFX.land(); }
      else { key.fall = false; key.vy = 0; key.rot = 0; sparkle(key.x + key.w / 2, key.y, 10, '#ffe066'); }
    }
  }

  for(const b of bullets){
    if(b.grav) b.vy += b.grav;
    b.x += b.vx; b.y += b.vy;
    if(solids.some(w => overlap(b, w))){ b.dead = true; burst(b.x + b.w / 2, b.y + b.h / 2, 6, '#ffd27a', 1.5, 16, 0.05, 2.4, 'puff'); continue; }
    if((b.kind === 'acid' || b.kind === 'snow' || b.kind === 'icicle') && b.y + b.h >= FLOOR){
      b.dead = true;
      const col = b.kind === 'acid' ? '#7ae04a' : '#e8f6ff';
      burst(b.x + b.w / 2, FLOOR - 2, 8, col, 2.2, 22, 0.12, 3, b.kind === 'acid' ? 'goo' : 'crumb');
      if(b.kind === 'icicle'){ SFX.glass(); addShake(2); }
      continue;
    }
    if(b.kind === 'bomb'){
      // a bomb bursts on the first ledge it falls onto (so a ledge is a roof), or on the floor, which catches fire
      const ledge = platforms.find(p => !p.gone && !p.solid && p.y < FLOOR - 2 && b.vy > 0 && b.x + b.w > p.x && b.x < p.x + p.w && b.y + b.h >= p.y && b.y + b.h - b.vy <= p.y + 1);
      const gy = ledge ? ledge.y : b.y + b.h >= FLOOR ? FLOOR : null;
      if(gy !== null){
        b.dead = true;
        burst(b.x + 6, gy - 2, 10, '#ff8a3c', 2.5, 22, 0.1, 3);
        burst(b.x + 6, gy - 4, 6, '#ffffff', 1.4, 26, -0.01, 4, 'puff');
        ring(b.x + 6, gy - 4, '#ffb347', 2, 18, 14);
        if(!ledge && boss && boss.mode === 'swoop'){
          const hot = boss.phase === 2 || boss.hp <= boss.enrage;
          const fw = hot ? 60 : 44;
          fires.push({x:clamp(b.x + 6 - fw / 2, 0, room.w - fw), w:fw, t:0, max:hot ? 190 : 150, seed:Math.random() * 10});
          if(!fireTold){ fireTold = true; showToast('Le sol brûle ! Grimpe sur une plateforme', 130); }
        }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead && b.x > camX - 40 && b.x < camX + W + 40 && b.y > camY - 40 && b.y < camY + H + 40);
  for(const f of fires){ f.t++; if(f.t % 9 === 0 && f.t < f.max - 20) particles.push({x:f.x + 6 + Math.random() * (f.w - 12), y:FLOOR - 10, vx:(Math.random() - 0.5) * 0.4, vy:-0.8 - Math.random(), life:26, max:26, color:Math.random() < 0.5 ? '#ffb347' : '#ffe08a', grav:-0.01, size:2.4, type:'dot'}); }
  fires = fires.filter(f => f.t < f.max);
}

function updateBoss(){
  const b = boss;
  if(!b || !b.alive) return;
  if(cine) return;            // the cinematic moves the boss itself
  if(b.dying){ updateBossDeath(b); return; }
  if(b.hitT > 0) b.hitT--;
  if(b.inv > 0) b.inv--;
  if(b.shieldT > 0) b.shieldT--;

  if(b.fleeing){
    b.y -= 5; b.x += Math.sin(frame * 0.3) * 2;
    if(frame % 3 === 0) burst(b.x + b.w/2, b.y + b.h, 3, '#ff8a3c', 1.5, 20, 0.05, 3);
    return;
  }
  const angry = b.hp <= b.enrage;
  if(S2_BOSS.has(b.mode)){ updateS2Boss(b); return; }

  if(b.mode === 'arena' || b.mode === 'ascent'){
    const spd = angry ? (b.mode === 'arena' ? 1 : 1.45) : 1;
    if(b.mode === 'ascent' && room.barrierY){
      // every 10 seconds he stops in mid-air and unleashes a different attack: rain of fire, rings, spiral
      if(b.special){ updateAscentSpecial(b); return; }
      if(b.spT === undefined) b.spT = 600;
      if(--b.spT <= 0){
        const kinds = ['pluie', 'anneau', 'spirale'];
        b.special = {kind:kinds[(b.spN = (b.spN || 0) + 1) % 3], t:0};
        b.spT = angry ? 480 : 600;
        SFX.warn(); addShake(5);
        showToast({pluie:'Pluie de feu ! Regarde en haut', anneau:'Anneaux de feu ! Trouve le trou', spirale:'Spirale de feu ! Tourne avec elle'}[b.special.kind], 110);
        return;
      }
    }
    if(b.mode === 'ascent'){
      b.x += b.vx * spd * 1.15;
      if(b.x < 20){ b.x = 20; b.vx = Math.abs(b.vx); }
      if(b.x > W - 20 - b.w){ b.x = W - 20 - b.w; b.vx = -Math.abs(b.vx); }
      const ty = (room.barrierY ? clamp(player.y - 150, room.barrierY + 30, room.barrierY + 170)
                                : Math.max(20, Math.min(camY + 40, player.y - 150))) + Math.sin(frame * 0.05) * 10;
      b.y += (ty - b.y) * 0.06;
    } else {
      b.x += b.vx * spd; b.y += b.vy * spd;
      if(b.x < b.minX){ b.x = b.minX; b.vx = Math.abs(b.vx); }
      if(b.x > b.maxX){ b.x = b.maxX; b.vx = -Math.abs(b.vx); }
      if(b.y < b.minY){ b.y = b.minY; b.vy = Math.abs(b.vy); }
      if(b.y > b.maxY){ b.y = b.maxY; b.vy = -Math.abs(b.vy); }
    }
    if(--b.fireT <= 0){
      // the first fight stays readable to the end: slower volleys, and a wide fan with big gaps when he's angry
      b.fireT = b.mode === 'ascent' ? (angry ? 50 : 75) : (angry ? 92 : 105);
      const bx = b.x + b.w/2, by = b.y + b.h/2;
      const ang = Math.atan2(player.y + player.h/2 - by, player.x + player.w/2 - bx);
      const v = angry ? (b.mode === 'arena' ? 2.6 : 3.4) : (b.mode === 'arena' ? 2.5 : 2.7);
      for(const s of (angry ? (b.mode === 'arena' ? [-0.5, 0, 0.5] : [-0.28, 0, 0.28]) : [0]))
        bullets.push({x:bx - 5, y:by - 5, w:10, h:10, vx:Math.cos(ang + s)*v, vy:Math.sin(ang + s)*v, kind:'boss'});
      SFX.bossShot();
    }
    return;
  }

  if(b.mode === 'slime'){
    if(b.onGround){
      b.squash += (0 - b.squash) * 0.2;
      if(--b.hopT <= 0){
        const dir = Math.sign((player.x + player.w/2) - (b.x + b.w/2)) || 1;
        if(b.phase === 2){
          // phase 2: every other jump is aimed to land right on the player
          b.big = b.hops % 2 === 0;
          b.vy = b.big ? -12 : -7;
          const flight = 2 * -b.vy / 0.5;
          b.vx = b.big ? clamp((player.x + player.w/2 - b.w/2 - b.x) / flight, -4.5, 4.5) : dir * 3.6;
        } else {
          b.big = b.hops % 3 === 2;
          b.vy = b.big ? -12 : -8;
          b.vx = dir * (b.big ? 2.2 : 2.6 + (angry ? 1 : 0));
        }
        b.onGround = false; b.hops++;
        b.squash = -0.25;
      }
    } else {
      b.vy += 0.5;
      b.x += b.vx; b.y += b.vy;
      b.squash += (0 - b.squash) * 0.1;
      if(b.x < 0){ b.x = 0; b.vx = Math.abs(b.vx); }
      if(b.x + b.w > room.w){ b.x = room.w - b.w; b.vx = -Math.abs(b.vx); }
      if(b.y + b.h >= FLOOR){
        b.y = FLOOR - b.h; b.onGround = true; b.vx = b.vy = 0;
        b.hopT = b.phase === 2 ? (angry ? 26 : 38) : (angry ? 32 : 55);
        b.squash = 0.35;
        addShake(b.big ? 9 : 4);
        dust(b.x + b.w/2, FLOOR, 12);
        SFX.thud();
        // phase 2: spits out little slimes (max 3 at once)
        if(b.phase === 2 && b.hops % 2 === 0 && enemies.filter(e => e.alive).length < 3){
          enemies.push({on:0, from:0, to:room.w, speed:1.5, off:clamp(b.x + b.w/2 - 12, 0, room.w - 24),
            dir:Math.random() < .5 ? -1 : 1, w:24, h:18, x:0, y:0, alive:true, t:0});
          burst(b.x + b.w/2, FLOOR - 10, 12, '#b45be3', 2.5, 25, 0.15, 3, 'goo');
        }
        if(b.big || angry || b.phase === 2){
          bullets.push({x:b.x - 12, y:FLOOR - 14, w:16, h:14, vx:-3.2, vy:0, kind:'wave'});
          bullets.push({x:b.x + b.w - 4, y:FLOOR - 14, w:16, h:14, vx:3.2, vy:0, kind:'wave'});
        }
      }
    }
    return;
  }

  if(b.mode === 'swoop'){
    const tx = player.x + player.w/2 - b.w/2;
    if(b.state === 'hover' || b.state === 'warn'){
      const k = b.state === 'warn' ? 0.12 : (b.phase === 2 ? 0.05 : 0.03);
      b.x += clamp((tx - b.x) * k, -4, 4);
      b.x = clamp(b.x, 10, room.w - b.w - 10);
      b.y += (55 + Math.sin(frame * 0.06) * 12 - b.y) * 0.1;
      if(b.state === 'hover'){
        if(--b.fireT <= 0){
          const p2 = b.phase === 2;
          b.fireT = p2 ? (angry ? 35 : 45) : (angry ? 40 : 65);
          const n = p2 ? 3 : (angry ? 2 : 1);
          for(let i = 0; i < n; i++){
            const vx = n === 3 ? (i - 1) * 1.8 : n === 2 ? (i ? 1.3 : -1.3) : 0;
            bullets.push({x:b.x + b.w/2 - 6, y:b.y + b.h - 4, w:12, h:12, vx, vy:1, grav:0.12, kind:'bomb'});
          }
          SFX.bossShot();
        }
        if(--b.stT <= 0){
          b.next = b.next === 'dive' ? 'sweep' : 'dive';
          if(b.next === 'dive'){ b.state = 'warn'; b.stT = b.phase === 2 ? 30 : 45; SFX.warn(); }
          else {
            // the sweep: it flies to the far side, screeches, then skims the floor all the way across
            b.state = 'sweepGo'; b.stT = 0;
            b.sx = player.x + player.w / 2 < W / 2 ? W - b.w - 6 : 6;
          }
        }
      } else if(--b.stT <= 0){ b.state = 'dive'; b.vy = 2; }
    } else if(b.state === 'dive'){
      b.vy = b.phase === 2 ? Math.min(b.vy + 1, 14) : Math.min(b.vy + 0.8, 12);
      b.y += b.vy;
      if(b.y + b.h >= FLOOR){
        b.y = FLOOR - b.h; b.state = 'stunned';
        b.stT = b.phase === 2 ? (angry ? 55 : 70) : (angry ? 75 : 110);
        addShake(10); dust(b.x + b.w/2, FLOOR, 14); SFX.thud();
        if(angry || b.phase === 2){
          bullets.push({x:b.x - 12, y:FLOOR - 14, w:16, h:14, vx:-3.4, vy:0, kind:'wave'});
          bullets.push({x:b.x + b.w - 4, y:FLOOR - 14, w:16, h:14, vx:3.4, vy:0, kind:'wave'});
        }
      }
    } else if(b.state === 'stunned'){
      if(--b.stT <= 0) b.state = 'rise';
    } else if(b.state === 'sweepGo'){
      b.x += clamp((b.sx - b.x) * 0.08, -6, 6);
      b.y += (70 - b.y) * 0.08;
      if(Math.abs(b.sx - b.x) < 3){ b.x = b.sx; b.state = 'sweepWarn'; b.stT = b.phase === 2 ? 34 : 46; SFX.warn();
        if(!b.toldSweep){ b.toldSweep = true; showToast('Il va raser le sol : monte sur une plateforme !', 140); } }
    } else if(b.state === 'sweepWarn'){
      b.y += (70 + Math.sin(frame * 0.5) * 2 - b.y) * 0.2;
      if(--b.stT <= 0){ b.state = 'sweepDown'; b.vy = 0; }
    } else if(b.state === 'sweepDown'){
      b.vy = Math.min(b.vy + 0.9, 11); b.y += b.vy;
      if(b.y >= FLOOR - b.h - 6){
        b.y = FLOOR - b.h - 6; b.state = 'sweep';
        b.vx = (b.x < W / 2 ? 1 : -1) * (b.phase === 2 ? 6.4 : 5);
        addShake(4); dust(b.x + b.w / 2, FLOOR, 10); SFX.bossFlee();
      }
    } else if(b.state === 'sweep'){
      b.x += b.vx;
      if(frame % 3 === 0) dust(b.x + b.w / 2 - Math.sign(b.vx) * 18, FLOOR, 2);
      if((b.vx > 0 && b.x >= W - b.w - 6) || (b.vx < 0 && b.x <= 6)){ b.x = clamp(b.x, 6, W - b.w - 6); b.state = 'rise'; }
    } else if(b.state === 'rise'){
      b.y -= 3;
      if(b.y <= 55){ b.state = 'hover'; b.stT = b.phase === 2 ? 140 : (angry ? 150 : 220); b.fireT = 40; }
    }
  }
}

function updatePlayer(){
  const knocked = idle.phase === 'flip' || idle.phase === 'ko' || idle.phase === 'up';
  if(knocked && input.jumpPressed) idleWake();
  if(finaleT > 0 || cine || knocked){ input.jumpPressed = false; input.shootPressed = false; input.dashPressed = false; player.buffer = 0; }
  const G = gdir;          // 1: normal gravity, -1: upside down (feet on the ceiling)
  // ride moving platforms
  if(player.standingOn){
    if(player.standingOn.gone) player.standingOn = null;
    else { player.x += player.standingOn.dx; player.y += player.standingOn.dy; }
  }

  let dir = finaleT > 0 || knocked ? 0 : (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if(cine){
    // during a cinematic XELIAX only walks out of danger, then faces the boss
    dir = 0;
    if(cine.walkTo !== null){
      const d = cine.walkTo - (player.x + player.w / 2);
      if(Math.abs(d) > 4) dir = Math.sign(d); else cine.walkTo = null;
    }
    if(!dir && boss && player.onGround) player.facing = boss.x + boss.w / 2 > player.x + player.w / 2 ? 1 : -1;
  }
  if(dir && player.dashT <= 0) player.facing = dir;
  let accel = player.onGround ? (player.standingOn && player.standingOn.ice ? ICE_ACCEL : ACCEL_GROUND) : ACCEL_AIR;
  // just after a wall jump you are kicked away from the wall for a moment
  if(player.wallLock > 0){ player.wallLock--; accel = player.wallLock > 3 ? 0 : ACCEL_AIR * 0.4; }
  if(player.dashT > 0){
    // dashing: straight, fast, no gravity
    player.dashT--;
    player.vx = player.dashDir * DASH_V; player.vy = 0;
    if(player.dashT % 2 === 0) player.ghosts.push({x:player.x, y:player.y, t:16, f:player.facing, g:G});
    if(player.dashT === 0) player.vx = player.dashDir * RUN * 1.1;
  } else {
    player.vx += (dir * RUN - player.vx) * accel;
    if(Math.abs(player.vx) < 0.05) player.vx = 0;
  }
  if(player.dashCD > 0) player.dashCD--;
  for(const gh of player.ghosts) gh.t--;
  player.ghosts = player.ghosts.filter(gh => gh.t > 0);

  // dash (season 2, chapter 3 onwards)
  if(input.dashPressed){
    if(!hasDash){ if(toast.t <= 0 && CHAPTERS[chIndex].season === 2) showToast('Pas encore de dash !', 50); }
    else player.dashBuf = DASH_BUF;
  }
  if(player.dashBuf > 0){
    player.dashBuf--;
    if(hasDash && player.dashT <= 0 && player.dashReady && player.dashCD <= 0){ player.dashBuf = 0; startDash(dir || player.facing); }
  }

  // jump: coyote time + buffer + wall jump + double jump
  if(input.jumpPressed){
    if(player.coyote > 0) doJump();
    else if(hasWall && player.wallT > 0) wallJump();
    else if(hasDJ && !player.usedDJ){
      // forgiving double jump: always its full height (even when the key is only tapped),
      // and pressing it early, while still rising, never loses height
      player.vy = (DJ_V + Math.min(0, player.vy * G) * 0.3) * G; player.usedDJ = true; player.noCut = true; player.dashT = 0;
      player.sx = 0.8; player.sy = 1.2;
      anim.spin = 0.001;
      const fy = G > 0 ? player.y + player.h : player.y;
      ring(player.x + player.w/2, fy, POWER_COLORS.doubleJump, 3, 22, 16);
      burst(player.x + player.w/2, fy, 8, POWER_COLORS.doubleJump, 2, 22, 0.05, 2.5, 'star');
      SFX.flip();
    } else player.buffer = BUFFER;
  }
  if(player.buffer > 0){
    player.buffer--;
    if(player.onGround) doJump();
    else if(hasWall && player.sliding) wallJump();
  }

  // variable jump height (unless launched by a spring / stomp), with a little hang time at the apex
  if(player.dashT <= 0){
    let g = GRAVITY;
    const rise = player.vy * G;          // negative while going away from the floor
    if(rise >= 0) player.noCut = false;
    if(rise < 0 && !input.jumpHeld && !player.noCut) g *= 2.2;
    else if(input.jumpHeld && Math.abs(player.vy) < 1.3 && !player.onGround) g *= 0.65;
    player.vy += g * G;
    if(player.vy * G > MAX_FALL) player.vy = MAX_FALL * G;
    if(player.sliding && player.vy * G > WALL_SLIDE) player.vy = WALL_SLIDE * G;
  }

  const prevBottom = player.y + player.h;
  const wasGround = player.onGround;
  const impact = player.vy * G;
  const prevX = player.x, prevTop = player.y;
  player.x += player.vx;
  player.x = clamp(player.x, 0, room.w - player.w);
  // solid walls: they stop you sideways (a dash smashes through ice walls)
  for(const w of solids){
    if(w.gone || !overlap(player, w)) continue;
    if(w.glass && player.dashT > 0){ breakGlass(w); continue; }
    if(prevX + player.w <= w.x + 0.5) player.x = w.x - player.w;
    else if(prevX >= w.x + w.w - 0.5) player.x = w.x + w.w;
    player.vx = 0;
    if(player.dashT > 0){ player.dashT = 0; addShake(2); dust(player.x + (player.dashDir > 0 ? player.w : 0), player.y + player.h / 2, 5); SFX.thud(); }
  }
  player.y += player.vy;
  // ...and you bump your head on them (the ceiling is on the other side when gravity is flipped)
  for(const w of solids){
    if(w.gone || !overlap(player, w)) continue;
    if(G > 0 && player.vy < 0 && prevTop >= w.y + w.h - 0.5){ player.y = w.y + w.h; player.vy = 0; }
    else if(G < 0 && player.vy > 0 && prevBottom <= w.y + 0.5){ player.y = w.y - player.h; player.vy = 0; }
  }
  if(barrierOn() && player.y < room.barrierY + 2){
    player.y = room.barrierY + 2;
    if(player.vy < 0) player.vy = 0;
    if(toast.t <= 0) showToast('Bats-le d\'abord !', 50);
  }

  // springs
  if(player.vy > 0 && G > 0){
    for(const s of springs){
      if(player.x + player.w > s.x && player.x < s.x + s.w && prevBottom <= s.y + 4 && player.y + player.h >= s.y){
        player.y = s.y - player.h;
        player.vy = SPRING_V; player.noCut = true; player.usedDJ = false; player.dashReady = true; player.dashT = 0;
        player.sx = 0.7; player.sy = 1.35;
        s.t = 12; s.anim = 1;
        anim.wobV -= 0.5; setFace(anim, 'open', 30);
        dust(s.x + 10, s.y, 8);
        SFX.spring();
        break;
      }
    }
  }

  // one-way platforms: you land on their top, or on their underside when gravity is flipped
  player.onGround = false; player.standingOn = null;
  const flipping = idle.phase === 'flip' || idle.phase === 'up';
  if(G > 0 && player.vy >= 0){
    for(const p of platforms){
      if(p.gone) continue;
      if(flipping && p.y < idle.groundY - 2) continue;
      if(player.x + player.w > p.x + 2 && player.x < p.x + p.w - 2 &&
         prevBottom <= p.y + 1 + Math.max(0, p.dy) && player.y + player.h >= p.y){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.standingOn = p;
        player.usedDJ = false;
        if(p.crumble && p.cT === 0) p.cT = 1;
        if(p.fall && !p.loose && p.fT === 0) p.fT = 1;
      }
    }
  } else if(G < 0 && player.vy <= 0){
    for(const p of platforms){
      if(p.gone) continue;
      const pb = p.y + p.h;
      if(player.x + player.w > p.x + 2 && player.x < p.x + p.w - 2 &&
         prevTop >= pb - 1 + Math.min(0, p.dy) && player.y <= pb){
        player.y = pb;
        player.vy = 0;
        player.onGround = true;
        player.standingOn = p;
        player.usedDJ = false;
        if(p.crumble && p.cT === 0) p.cT = 1;
        if(p.fall && !p.loose && p.fT === 0) p.fT = 1;
      }
    }
  }
  if(player.onGround){ player.dashReady = true; player.wallT = 0; }
  if(player.onGround && !wasGround){
    const k = Math.min(impact / 12, 1);
    player.sx = 1 + 0.35*k; player.sy = 1 - 0.3*k;
    anim.wobV += Math.min(impact, 12) * 0.05;
    if(impact > 4) dust(player.x + player.w/2, G > 0 ? player.y + player.h : player.y, 6);
    if(impact > 6) SFX.land();
  }
  player.coyote = player.onGround ? COYOTE : Math.max(0, player.coyote - 1);

  // walls: touching one in the air lets you wall-jump; pushing into it while falling slows you down
  player.sliding = false;
  if(hasWall && !player.onGround && player.dashT <= 0){
    const touch = s => { const pr = {x:s > 0 ? player.x + player.w : player.x - 2, y:player.y + 6, w:2, h:player.h - 12}; return solids.some(w => !w.gone && !w.slick && !w.glass && overlap(pr, w)); };
    const R = touch(1), L = touch(-1);
    const side = dir && (dir > 0 ? R : L) ? dir : R ? 1 : L ? -1 : 0;
    if(side){
      player.wallSide = side; player.wallT = WALL_COY;
      if(dir === side && player.vy * G > 0){
        player.sliding = true; player.dashReady = true;
        if(frame % 5 === 0) particles.push({x:player.x + (side > 0 ? player.w : 0), y:player.y + player.h * (G > 0 ? 0.3 : 0.7), vx:-side * 0.4, vy:-G * 0.3, life:18, max:18, color:'#ffffff', grav:0, size:2, type:'puff', drag:0.94});
        if(frame % 14 === 0) tone(170 + Math.random() * 40, 0.05, 'triangle', 0.012);
      }
    } else if(player.wallT > 0) player.wallT--;
  } else if(player.wallT > 0) player.wallT--;

  player.sx += (1 - player.sx) * 0.2;
  player.sy += (1 - player.sy) * 0.2;
  if(player.onGround && Math.abs(player.vx) > 0.5 && frame % 9 === 0) dust(player.x + player.w/2, G > 0 ? player.y + player.h : player.y, 1);
  if(player.invuln > 0) player.invuln--;
  if(player.hurtT > 0) player.hurtT--;
  if(player.shotCD > 0) player.shotCD--;

  // gravity orbs and gravity lines: touch one and the world turns upside down
  for(const o of flips){
    if(o.t > 0) o.t = Math.max(0, o.t - 0.04);
    const hit = overlap(player, o);
    if(hit && o.armed){
      o.armed = false; o.t = 1;
      const want = o.set || -gdir;
      if(want !== gdir) setGravity(want);
    } else if(!hit) o.armed = true;
  }

  // pits (or the open sky, upside down)
  if(gdir > 0 && player.y > room.h + 30){ killPlayer(); return; }
  if(gdir < 0 && player.y + player.h < -40){ killPlayer(); return; }
  if(gdir < 0 && player.y > room.h){ killPlayer(); return; }       // upside down, below the bottom of the screen: no sneaking under the floor

  // spikes and lava pools
  for(const s of spikes){
    if(s.pending) continue;          // still coming out of the floor
    const hb = s.side ? {x:s.side === 'left' ? s.x - 8 : s.x, y:s.y + 3, w:8, h:s.h - 6}
             : s.lava ? {x:s.x, y:s.y - 8, w:s.w, h:30}
             : s.down ? {x:s.x + 3, y:s.y, w:s.w - 6, h:8}
             : {x:s.x + 3, y:s.y - 8, w:s.w - 6, h:8};
    if(overlap(player, hb)){ killPlayer(); return; }
  }

  // the burning floor of the last fight: stay on the ledges
  const hf = room.hotFloor;
  if(hf && boss && boss.alive && !boss.dying && !cine && player.onGround && player.y + player.h >= hf.y - 1
     && player.x + player.w / 2 > hf.x0 && player.x + player.w / 2 < hf.x1){
    if(player.invuln <= 0){ hurt(player.x + player.w / 2 + player.facing); if(state !== 'play') return; }
    player.vy = -11.5; player.noCut = true; player.usedDJ = false; player.onGround = false;
    burst(player.x + player.w / 2, hf.y, 10, '#ff8a3c', 3, 25);
    if(!fireTold){ fireTold = true; showToast('Le sol brûle ! Reste sur les plateformes', 130); }
  }

  // rising lava bounces you back up
  if(room.lava && player.y + player.h > lavaY + 6){
    if(player.invuln <= 0){
      hurt(player.x + player.w/2 + player.facing);
      if(state !== 'play') return;
    }
    player.vy = -12.5; player.noCut = true; player.usedDJ = false;
    burst(player.x + player.w/2, lavaY, 10, '#ff8a3c', 3, 25);
  }

  // checkpoints (some hang from the ceiling, for the upside-down parts)
  for(const c of checkpoints){
    const box = c.ceil ? {x:c.x - 6, y:c.y, w:24, h:40} : {x:c.x - 6, y:c.y - 40, w:24, h:40};
    if(!c.active && overlap(player, box)){
      checkpoints.forEach(o => o.active = false);
      c.active = true;
      checkpoint = c.ceil ? {x:c.x, y:c.y + 1, g:-1} : {x:c.x, y:c.y - player.h - 1, g:1};
      sparkle(c.x + 12, c.ceil ? c.y + 30 : c.y - 30, 12, '#7dff9a');
      confetti(c.x + 4, c.ceil ? c.y + 36 : c.y - 36, 16);
      setFace(anim, 'open', 40);
      SFX.checkpoint();
      showToast('Checkpoint !', 60);
    }
  }

  // shooting
  if(input.shootPressed){
    if(!canShoot) showToast("Pas encore d'arme !", 50);
    else if(player.shotCD <= 0){
      player.shotCD = SHOT_COOLDOWN;
      anim.shootT = 12;
      if(room.shootUp){
        shots.push({x:player.x + player.w/2 - 3, y:player.y - 12, w:6, h:12, vx:0, vy:-9});
      } else {
        shots.push({x:player.facing > 0 ? player.x + player.w : player.x - 10, y:G > 0 ? player.y + 12 : player.y + player.h - 17, w:10, h:5, vx:player.facing * SHOT_SPEED, vy:0});
        player.vx -= player.facing * 0.6;
      }
      SFX.shoot();
    }
  }
  for(const s of shots){
    s.x += s.vx; s.y += s.vy;
    const hitWall = solids.find(w => !w.gone && overlap(s, w));
    if(hitWall){
      s.dead = true; burst(s.x + s.w / 2, s.y + s.h / 2, 5, '#d9d0ff', 1.6, 14, 0, 2.2, 'star');
      if(hitWall.gate) hitGate(hitWall, s);
      else if(hitWall.glass){ hitWall.flash = 6; SFX.ting(); }
    }
  }

  // walkers & bats: stomp them, dash through them, or get hurt
  const stompable = [...enemies.filter(e => e.alive), ...bats.filter(b => b.alive)];
  for(const e of stompable){
    if(!overlap(player, e)) continue;
    const onTop = G > 0 ? (player.vy > 0 && prevBottom <= e.y + 8) : (player.vy < 0 && prevTop >= e.y + e.h - 8);
    // a hedgehog (spiky:true) can't be stomped or dashed through: only a falling plank beats it
    if(e.spiky){ hurt(e.x + e.w/2); if(state !== 'play') return; continue; }
    if(onTop || player.dashT > 0){
      e.alive = false;
      if(onTop){
        player.vy = -8 * G; player.usedDJ = false;
        player.sx = 0.8; player.sy = 1.25;
      } else addShake(2);
      player.dashReady = true;
      anim.wobV -= 0.3; setFace(anim, 'open', 20);
      score += 25;
      killFx(e);
      addShake(3);
      SFX.stomp();
    } else hurt(e.x + e.w/2);
    if(state !== 'play') return;
  }
  for(const t of turrets){
    if(t.alive && overlap(player, t)){ hurt(t.x + 12); if(state !== 'play') return; }
  }

  // shots vs everything
  for(const s of shots){
    // a shot cancels a boss's fireball
    for(const bl of bullets){
      if(!s.dead && !bl.dead && bl.kind === 'boss' && overlap(s, bl)){
        s.dead = true; bl.dead = true;
        burst(bl.x + bl.w / 2, bl.y + bl.h / 2, 8, '#ffb0d0', 2, 18, 0, 2.6, 'star');
        SFX.ting();
      }
    }
    for(const e of stompable){
      if(e.alive && !s.dead && overlap(s, e)){
        if(e.spiky){
          s.dead = true; burst(s.x, s.y, 6, '#ffffff', 2, 15, 0.05, 2.5, 'star'); SFX.ting();
          if(toast.t <= 0) showToast('Ses piques arrêtent les tirs… une planche ?', 90);
          continue;
        }
        e.alive = false; s.dead = true; score += 25;
        killFx(e); SFX.stomp();
      }
    }
    for(const t of turrets){
      if(t.alive && !s.dead && overlap(s, t)){
        s.dead = true; t.hp--; t.flash = 8;
        burst(s.x, s.y, 6, '#ffd54a', 2, 15, 0.05, 2.5, 'star');
        if(t.hp <= 0){
          t.alive = false; score += 50;
          popup(t.x + 12, t.y, '+50', '#ffd54a');
          burst(t.x + 12, t.y + 12, 18, '#ffb27a', 4, 35, 0.15, 3);
          burst(t.x + 12, t.y + 12, 10, '#ffffff', 2, 30, -0.02, 5, 'puff');
          addShake(5); SFX.stomp();
        }
      }
    }
    if(!s.dead && boss && boss.alive && !boss.fleeing && !boss.dying && (boss.mode === 'arena' || boss.mode === 'ascent') && overlap(s, boss)){
      s.dead = true;
      if(boss.inv > 0){
        // still shielded from the last hit: the shot glances off
        boss.shieldT = 12;
        burst(s.x + s.w / 2, s.y + s.h / 2, 6, '#d9e4ff', 2.5, 14, 0, 2.5, 'star');
        SFX.ting();
      } else bossDamage();
    }
    if(!s.dead && boss && boss.alive && !boss.dying && S2_BOSS.has(boss.mode) && overlap(s, boss)){
      // the season 2 bosses shrug off shots
      s.dead = true; boss.shieldT = 12;
      burst(s.x + s.w / 2, s.y + s.h / 2, 6, '#d9e4ff', 2.5, 14, 0, 2.5, 'star');
      SFX.ting();
    }
  }
  shots = shots.filter(s => !s.dead && s.x > camX - 30 && s.x < camX + W + 30 && s.y > camY - 30 && s.y < camY + H + 30);

  // boss contact: landing on top of the slime or the owl always bounces you (it only scores when
  // they're vulnerable), and the owl is harmless while stunned or flying back up after a hit
  if(boss && boss.alive && !boss.fleeing && !boss.dying && !cine && S2_BOSS.has(boss.mode)){
    if(bossContact2(prevBottom, prevTop)) return;
  } else if(boss && boss.alive && !boss.fleeing && !boss.dying && !cine && overlap(player, boss)){
    const sw = boss.mode === 'swoop', calm = sw && (boss.state === 'stunned' || boss.state === 'rise');
    const fromAbove = player.vy > 0 && prevBottom <= boss.y + 16;
    if((boss.mode === 'slime' || sw) && fromAbove){
      if(boss.inv <= 0 && (!sw || boss.state === 'stunned' || boss.state === 'sweep')){
        bossDamage();
        if(sw && boss.alive && !boss.dying && !cine) boss.state = 'rise';
      }
      player.y = boss.y - player.h;
      player.vy = -11; player.noCut = true; player.usedDJ = false;
      player.sx = 0.75; player.sy = 1.3;
      anim.wobV -= 0.4; setFace(anim, 'open', 30);
    } else if(!calm && (boss.inv <= 0 || boss.mode === 'arena' || boss.mode === 'ascent')){
      hurt(boss.x + boss.w/2);
      if(state !== 'play') return;
    }
  }

  // the floor the owl set alight
  for(const f of fires){
    if(f.t > 10 && f.t < f.max - 14 && overlap(player, {x:f.x + 5, y:FLOOR - 12, w:f.w - 10, h:12})){ hurt(f.x + f.w / 2); if(state !== 'play') return; }
  }
  // enemy bullets
  for(const b of bullets){
    if(overlap(player, {x:b.x + 2, y:b.y + 2, w:b.w - 4, h:b.h - 4})){
      b.dead = true; hurt(b.x + b.w/2);
      if(state !== 'play') return;
    }
  }

  // coins fly to the counter
  for(const c of coins){
    if(c.got) continue;
    if(overlap(player, {x:c.x - 8, y:c.y - 8, w:16, h:16})){
      c.got = true; score += 10; chCoins++; collected.add(c.id);
      sparkle(c.x, c.y, 5, '#ffe066');
      popup(c.x, c.y - 8, '+10', '#ffe066');
      flyCoin(c.x, c.y);
      SFX.coin();
    }
  }

  // power-ups
  for(const p of powerUps){
    if(p.got || !overlap(player, p)) continue;
    p.got = true; collected.add(p.id);
    SFX.power();
    ring(p.x + 10, p.y + 10, POWER_COLORS[p.type], 6, 40, 24);
    sparkle(p.x + 10, p.y + 10, 16, POWER_COLORS[p.type]);
    setFace(anim, 'open', 45);
    if(p.type === 'doubleJump'){ hasDJ = true; showToast(chapter.season === 2 ? 'Double saut récupéré !' : 'Double saut débloqué !', 130); }
    if(p.type === 'life'){ lives++; showToast('+1 vie !', 90); }
    if(p.type === 'shoot'){ canShoot = true; showToast('Arme débloquée ! Touche ' + KEYS_TXT.shoot, 140); }
    if(p.type === 'gem'){ chGem = true; score += 100; popup(p.x + 10, p.y, '+100', '#9fe8ff'); showToast('Gemme secrète trouvée !', 130); }
    if(p.type === 'wall'){ hasWall = true; showToast('Tentacules-ventouses ! Saute contre un mur', 170); }
    if(p.type === 'dash'){ hasDash = true; hasDJ = true; player.dashReady = true; showToast('Double saut amélioré : tu peux aussi dasher ! Touche ' + KEYS_TXT.dash, 200); }
  }

  // key, or the ficelle aux olives in the very last room
  if(key && !key.got && key.kind === 'ficelle' && overlap(player, key)){ startFinale(); return; }
  if(key && !key.got && overlap(player, key)){
    key.got = true; hasKey = true; score += 50;
    sparkle(key.x + 9, key.y + 9, 16, '#ffe066');
    ring(key.x + 9, key.y + 9, '#ffe066', 6, 36, 22);
    setFace(anim, 'open', 45);
    SFX.key();
    showToast('Clé récupérée ! Vers la sortie', 110);
  }

  // door
  if(door && player.onGround && overlap(player, door)){
    if(doorLocked()){
      if(toast.t <= 0){
        door.shake = 1;
        if(room.needsKey) showToast(boss && boss.alive ? 'Bats le boss pour la clé !' : 'Ramasse la clé !', 60);
        else if(!door.told){ door.told = true; showToast('Bats le boss pour ouvrir !', 60); }
      }
    } else startExit();
  }
}

// a jump off the wall you are touching: kicked away from it, double jump and dash back
function wallJump(){
  const s = player.wallSide;
  player.vx = -s * WJ_VX; player.vy = WJ_VY * gdir;
  player.wallLock = WALL_LOCK; player.wallT = 0; player.sliding = false;
  player.usedDJ = false; player.dashReady = true; player.noCut = false; player.dashT = 0;
  player.facing = -s; player.buffer = 0; player.coyote = 0;
  player.sx = 0.8; player.sy = 1.2; anim.wobV -= 0.3; anim.spin = 0;
  dust(player.x + (s > 0 ? player.w : 0), player.y + player.h / 2, 5);
  SFX.walljump();
}

function startDash(d){
  player.dashT = DASH_T; player.dashDir = d; player.dashCD = DASH_CD; player.facing = d;
  if(!player.onGround) player.dashReady = false;
  player.vy = 0; player.noCut = true; player.wallLock = 0;
  player.sx = 1.35; player.sy = 0.72;
  anim.wobV += 0.4;
  ring(player.x + player.w / 2, player.y + player.h / 2, POWER_COLORS.dash, 4, 26, 14);
  burst(player.x + player.w / 2 - d * 8, player.y + player.h / 2, 6, '#ffffff', 2, 18, 0, 3, 'puff');
  addShake(1.5);
  SFX.dash();
}

// flip the world: XELIAX falls towards the other side
function setGravity(g){
  gdir = g;
  player.vy = g * 1.5;
  player.onGround = false; player.standingOn = null; player.coyote = 0; player.buffer = 0;
  player.usedDJ = false; player.dashReady = true; player.noCut = true; player.sliding = false; player.wallT = 0;
  anim.wobV += 0.8; setFace(anim, 'o', 30);
  ring(player.x + player.w / 2, player.y + player.h / 2, POWER_COLORS.gravity, 6, 44, 22);
  sparkle(player.x + player.w / 2, player.y + player.h / 2, 10, POWER_COLORS.gravity);
  addShake(2.5);
  SFX.gravity(g);
}

// an ice wall shatters when you dash into it
function breakGlass(w){
  w.gone = true;
  solids = solids.filter(o => o !== w);
  for(let i = 0; i < 22; i++) particles.push({x:w.x + Math.random() * w.w, y:w.y + Math.random() * w.h, vx:(Math.random() - 0.5) * 5 + player.dashDir * 2, vy:-1.5 - Math.random() * 3,
    life:45, max:45, color:i % 3 ? '#cfefff' : '#ffffff', grav:0.22, size:2.5 + Math.random() * 3, type:'crumb', rot:Math.random() * TAU, vr:(Math.random() - 0.5) * 0.6});
  burst(w.x + w.w / 2, w.y + w.h / 2, 10, '#e8f8ff', 2, 26, -0.01, 4, 'puff');
  addShake(6); SFX.glass();
  score += 30; popup(w.x + w.w / 2, w.y + 10, '+30', '#bff1ff');
  if(player.standingOn === w){ player.standingOn = null; player.onGround = false; }
}

// =====================================================================
//  SEASON 2 BOSSES: the giant gecko (walls), the yeti (dash), the magpie (gravity)
// =====================================================================
const ARENA_WALL = 40;
function geckoWallX(b, side){ return side < 0 ? ARENA_WALL : W - ARENA_WALL - b.w; }

function setupS2Boss(b){
  b.t = 0; b.vx = 0; b.vy = 0; b.face = -1;
  if(b.mode === 'gecko'){ b.side = -1; b.state = 'crawl'; b.stT = 150; b.fireT = 70; b.leaps = 0; }
  if(b.mode === 'yeti'){ b.y = FLOOR - b.h; b.state = 'walk'; b.stT = 160; b.fireT = 90; b.warn = []; }
  if(b.mode === 'magpie'){ b.state = 'hover'; b.stT = 150; b.fireT = 120; b.hx = b.x; }
}

function updateS2Boss(b){
  const p2 = b.phase === 2;
  b.t++;
  if(b.mode === 'gecko'){
    if(b.state === 'crawl'){
      const ty = clamp(player.y - 10, 50, FLOOR - b.h - 40);
      b.y += clamp((ty - b.y) * 0.03, -1.6, 1.6) * (p2 ? 1.5 : 1);
      b.x = geckoWallX(b, b.side);
      if(--b.fireT <= 0){ b.fireT = p2 ? 60 : 90; spitAcid(b, p2 ? 3 : b.hp <= b.enrage ? 2 : 1); }
      if(--b.stT <= 0) startLeap(b);
    } else if(b.state === 'leap'){
      b.lt++;
      const k = Math.min(1, b.lt / b.ldur);
      b.x = lerp(b.lx0, b.lx1, k); b.y = lerp(b.ly0, b.ly1, k) - Math.sin(k * Math.PI) * 80;
      if(k >= 1){
        b.side = -b.side; b.state = 'crawl'; b.leaps++;
        addShake(4); SFX.thud(); dust(b.side < 0 ? ARENA_WALL : W - ARENA_WALL, b.y + b.h / 2, 8);
        if(b.leaps >= (p2 ? 3 : 2)){
          b.leaps = 0;
          if(p2){ b.state = 'stuck'; b.stT = 180; popup(b.x + b.w / 2, b.y - 8, 'Il est sonné !', '#ffe58a'); SFX.warn(); }
          else { b.state = 'drop'; b.vy = 0; }
        } else b.stT = p2 ? 70 : 110;
      }
    } else if(b.state === 'drop'){
      b.vy += 0.5; b.y += b.vy;
      if(b.y >= FLOOR - b.h){ b.y = FLOOR - b.h; b.vy = 0; b.state = 'stun'; b.stT = 160; addShake(8); SFX.thud(); dust(b.x + b.w / 2, FLOOR, 12); popup(b.x + b.w / 2, b.y - 8, 'Saute-lui dessus !', '#ffe58a'); }
    } else if(b.state === 'stun' || b.state === 'stuck'){
      if(--b.stT <= 0){ b.state = b.state === 'stun' ? 'climb' : 'crawl'; b.stT = 90; b.fireT = 40; }
    } else if(b.state === 'climb'){
      b.y -= 2.6;
      if(b.y <= 170){ b.state = 'crawl'; b.stT = p2 ? 80 : 120; b.fireT = 40; }
    }
    return;
  }
  if(b.mode === 'yeti'){
    // falling icicles announced by a shadow on the floor
    for(const w of b.warn) if(--w.t === 0) bullets.push({x:w.x - 6, y:-30, w:12, h:26, vx:0, vy:2, grav:0.42, kind:'icicle'});
    b.warn = b.warn.filter(w => w.t > 0);
    if(b.state === 'walk'){
      const dir = Math.sign(player.x + player.w / 2 - (b.x + b.w / 2)) || b.face;
      b.face = dir;
      b.x = clamp(b.x + dir * (p2 ? 1.3 : 0.9), 32, W - 32 - b.w);
      if(--b.fireT <= 0){
        b.fireT = p2 ? 75 : 105;
        const cx = b.x + b.w / 2, cy = b.y + 10, dx = player.x + player.w / 2 - cx;
        bullets.push({x:cx - 7, y:cy - 7, w:14, h:14, vx:clamp(dx / 55, -5.5, 5.5), vy:-6, grav:0.2, kind:'snow'});
        SFX.bossShot();
      }
      if(--b.stT <= 0){ b.state = 'roar'; b.stT = 46; SFX.warn(); }
    } else if(b.state === 'roar'){
      b.face = Math.sign(player.x + player.w / 2 - (b.x + b.w / 2)) || b.face;
      if(--b.stT <= 0){ b.state = 'charge'; b.cdir = b.face; SFX.bossFlee(); addShake(4); }
    } else if(b.state === 'charge'){
      b.x += b.cdir * (p2 ? 7.4 : 6.2);
      if(frame % 3 === 0) dust(b.x + b.w / 2 - b.cdir * 20, FLOOR, 2);
      if(b.x <= 32 || b.x + b.w >= W - 32){
        b.x = clamp(b.x, 32, W - 32 - b.w);
        b.state = 'dizzy'; b.stT = p2 ? 115 : 150;
        addShake(13); SFX.thud(); SFX.crumble();
        burst(b.cdir > 0 ? W - 32 : 32, b.y + 20, 16, '#e8f8ff', 3, 30, 0.1, 3, 'puff');
        popup(b.x + b.w / 2, b.y - 10, 'Fonce dedans : dash !', '#ffe58a');
        if(p2) for(let i = 0; i < 4; i++) b.warn.push({x:60 + Math.random() * (W - 120), t:30 + i * 14});
      }
    } else if(b.state === 'dizzy'){
      if(--b.stT <= 0){ b.state = 'walk'; b.stT = p2 ? 130 : 190; b.fireT = 50; }
    }
    return;
  }
  if(b.mode === 'magpie'){
    const top = 34, bottom = FLOOR - b.h, p3 = b.phase === 3;
    // after each hit she shakes the nest: in phase 1 everyone falls back onto the hay, in phase 2 the world turns over
    if(b.nestT > 0){
      if(b.nestT === 50) popup(b.x + b.w / 2, b.y - 10, 'Le nid tremble !', '#ffe58a');
      if(--b.nestT === 0){
        const want = b.phase >= 2 ? -gdir : 1;
        addShake(9); SFX.thud();
        if(want !== gdir){ setGravity(want); showToast(p2 ? 'Elle retourne le nid !' : 'Elle secoue le nid : tout le monde retombe !', 110); }
      }
    }
    if(b.state === 'hover'){
      const tx = clamp(player.x + player.w / 2 - b.w / 2 + Math.sin(b.t * 0.03) * 120, 40, W - 40 - b.w);
      b.x += clamp((tx - b.x) * 0.025, -2.6, 2.6) * (p2 ? 1.4 : 1);
      b.y += (150 + Math.sin(b.t * 0.05) * 30 - b.y) * 0.06;
      b.face = player.x + player.w / 2 > b.x + b.w / 2 ? 1 : -1;
      if(!p2 && --b.fireT <= 0){
        // phase 1: a single shiny trinket thrown at XELIAX now and then
        b.fireT = 120;
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2, a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
        bullets.push({x:cx - 6, y:cy - 6, w:12, h:12, vx:Math.cos(a) * 2.6, vy:Math.sin(a) * 2.6, kind:'trinket', rot:0});
        SFX.bossShot();
      }
      if(b.phase >= 2 && --b.fireT <= 0){
        b.fireT = p3 ? 85 : 70;
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2, a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
        for(const s of (p3 ? [-0.5, -0.25, 0, 0.25, 0.5] : [-0.3, 0, 0.3])) bullets.push({x:cx - 6, y:cy - 6, w:12, h:12, vx:Math.cos(a + s) * 3.2, vy:Math.sin(a + s) * 3.2, kind:'trinket', rot:0});
        SFX.bossShot();
      }
      if(--b.stT <= 0){
        b.state = 'aim'; b.stT = p3 ? 30 : p2 ? 34 : 42; SFX.warn();
        b.tx = clamp(player.x + player.w / 2 - b.w / 2, 30, W - 30 - b.w);
        // phase 3: two dives straight at XELIAX, wherever he is, then a last one at the other side, where she gets stuck
        if(p3){ b.chain = 2; b.ty = clamp(player.y + player.h / 2 - b.h / 2, top, bottom); }
        else
        // phase 1: she dives at the side you're standing on (only the ceiling holds her);
        // phase 2: she's wary and dives at the OTHER side, so you have to flip over (orbs, edges) and dash into her
        b.ty = b.phase === 2 ? (gdir > 0 ? top : bottom) : (gdir > 0 ? bottom : top);
      }
    } else if(b.state === 'aim'){
      b.y += (b.ty > 150 ? -0.6 : 0.6);
      if(--b.stT <= 0){ b.state = 'dive'; const d = Math.hypot(b.tx - b.x, b.ty - b.y) || 1; const sp = p3 ? 10.5 : p2 ? 10 : 8.5; b.vx = (b.tx - b.x) / d * sp; b.vy = (b.ty - b.y) / d * sp; SFX.bossFlee(); }
    } else if(b.state === 'dive'){
      b.x += b.vx; b.y += b.vy;
      if((b.tx - b.x) * b.vx + (b.ty - b.y) * b.vy <= 0){
        if(p3 && b.chain > 0){
          // she brakes in mid-air, turns round and aims again
          b.x = clamp(b.tx, 30, W - 30 - b.w); b.y = b.ty; b.chain--;
          b.state = 'aim'; b.stT = 26; SFX.warn();
          b.tx = clamp(player.x + player.w / 2 - b.w / 2, 30, W - 30 - b.w);
          b.ty = b.chain > 0 ? clamp(player.y + player.h / 2 - b.h / 2, top, bottom) : (gdir > 0 ? top : bottom);
          b.face = b.tx > b.x ? 1 : -1;
          burst(b.x + b.w / 2, b.y + b.h / 2, 8, '#ffffff', 2, 20, 0, 3, 'puff');
          return;
        }
        b.x = clamp(b.x, 30, W - 30 - b.w); b.y = b.ty;
        if(!p2 && b.ty > 150){
          // phase 1: the hay is far too soft, she bounces straight back up
          b.state = 'bounce'; b.stT = 22; b.vy = -6.5; b.vx *= 0.25;
          addShake(5); SFX.spring(); dust(b.x + b.w / 2, FLOOR, 14);
          for(let i = 0; i < 10; i++) particles.push({x:b.x + Math.random() * b.w, y:FLOOR - 4, vx:(Math.random() - 0.5) * 4, vy:-2 - Math.random() * 2.5, life:40, max:40, color:i % 2 ? '#e8c26a' : '#c9973e', grav:0.15, size:3, type:'crumb', rot:Math.random() * TAU, vr:0.3});
          popup(b.x + b.w / 2, b.y - 8, 'Le foin amortit !', '#ffe58a');
          if(!b.toldHay){ b.toldHay = true; showToast('Le foin est trop mou : fais-la plonger vers le plafond !', 160); }
          return;
        }
        b.state = 'stuck'; b.ceil = b.ty < 150; b.stT = p3 ? 150 : p2 ? 170 : 135;
        if(b.phase === 2 && !b.toldFlip){ b.toldFlip = true; showToast('Elle se cache de l\'autre côté : retourne-toi et dash !', 170); }
        addShake(10); SFX.thud();
        const sy = b.ceil ? top - 4 : FLOOR;
        burst(b.x + b.w / 2, sy, 12, '#e8d8ff', 3, 30, b.ceil ? -0.1 : 0.1, 3, 'puff');
        popup(b.x + b.w / 2, b.ceil ? b.y + b.h + 18 : b.y - 8, b.phase === 2 ? 'Coincée ! Dash !' : 'Coincée ! Saute-lui dessus !', '#ffe58a');
        if(p2 && !b.ceil){
          bullets.push({x:b.x - 12, y:FLOOR - 14, w:16, h:14, vx:-3.4, vy:0, kind:'wave'});
          bullets.push({x:b.x + b.w - 4, y:FLOOR - 14, w:16, h:14, vx:3.4, vy:0, kind:'wave'});
        }
      }
    } else if(b.state === 'bounce'){
      b.x = clamp(b.x + b.vx, 30, W - 30 - b.w); b.y += b.vy; b.vy += 0.3;
      if(--b.stT <= 0) b.state = 'rise';
    } else if(b.state === 'stuck'){
      if(frame % 10 === 0) b.shakeX = (Math.random() - 0.5) * 3;
      if(--b.stT <= 0){ b.state = 'rise'; }
    } else if(b.state === 'rise'){
      b.y += (150 - b.y) * 0.08;
      if(Math.abs(b.y - 150) < 4){ b.state = 'hover'; b.stT = p3 ? 60 : p2 ? 75 : 95; b.fireT = 45; }
    }
  }
}

function startLeap(b){
  b.state = 'leap'; b.lt = 0; b.ldur = b.phase === 2 ? 42 : 54;
  b.lx0 = b.x; b.ly0 = b.y; b.lx1 = geckoWallX(b, -b.side); b.ly1 = clamp(player.y - 20, 60, 230);
  SFX.flip();
}
function spitAcid(b, n){
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, dx = player.x + player.w / 2 - cx;
  for(let i = 0; i < n; i++){
    const spread = (i - (n - 1) / 2) * 1.1;
    bullets.push({x:cx - 6, y:cy - 6, w:12, h:12, vx:clamp(dx / 60, -5, 5) + spread, vy:-4 - Math.random() * 0.6, grav:0.16, kind:'acid'});
  }
  SFX.bossShot();
}

// when can it be hit, and when is it harmless
// the magpie can be stomped only in phase 1 (stuck in the ceiling); in phase 2 her trinket armour only gives way to a dash
function bossWeak(b){ return (b.mode === 'gecko' && (b.state === 'stun' || b.state === 'stuck')) || (b.mode === 'magpie' && b.state === 'stuck' && b.phase !== 2); }
function bossDashWeak(b){ return bossWeak(b) || (b.mode === 'yeti' && b.state === 'dizzy') || (b.mode === 'magpie' && b.state === 'stuck'); }
function bossHarmless(b){ return bossDashWeak(b) || (S2_BOSS.has(b.mode) && b.inv > 0); }
function bossHitReact(b){
  if(!b.alive || cine || b.dying) return;
  if(b.mode === 'gecko'){ b.state = b.state === 'stun' ? 'climb' : 'crawl'; b.stT = 90; b.fireT = 60; }
  if(b.mode === 'yeti'){ b.state = 'walk'; b.stT = 170; b.fireT = 70; }
  if(b.mode === 'magpie'){ b.state = 'rise'; b.nestT = 50; }   // ...then she shakes the nest
}

// touching a season 2 boss: stomp it (gecko, magpie), dash into it (all three, when dazed), or get hurt
function bossContact2(prevBottom, prevTop){
  const b = boss;
  if(!overlap(player, b)) return false;
  const G = gdir;
  const onTop = G > 0 ? (player.vy > 0 && prevBottom <= b.y + 16) : (player.vy < 0 && prevTop >= b.y + b.h - 16);
  if(player.dashT > 0 && bossDashWeak(b)){
    if(b.inv <= 0){ bossDamage(); bossHitReact(b); }
    player.dashT = 0; player.vx = -player.dashDir * 3.5; player.vy = -5 * G; player.noCut = true;
    return false;
  }
  if(onTop){
    if(bossWeak(b) && b.inv <= 0){ bossDamage(); bossHitReact(b); }
    else if(b.mode === 'yeti'){ SFX.ting(); if(toast.t <= 0) showToast('Son casque de glace protège sa tête : utilise le dash !', 110); }
    else if(b.mode === 'magpie' && b.phase === 2){ SFX.ting(); if(toast.t <= 0) showToast('Son armure de babioles la protège : fonce-lui dedans avec le dash !', 120); }
    player.y = G > 0 ? b.y - player.h : b.y + b.h;
    player.vy = -10.5 * G; player.noCut = true; player.usedDJ = false; player.dashReady = true;
    player.sx = 0.75; player.sy = 1.3;
    anim.wobV -= 0.4; setFace(anim, 'open', 30);
    return false;
  }
  if(bossHarmless(b)) return false;
  hurt(b.x + b.w / 2);
  return state !== 'play';
}

// the magpie lets go of the ficelle: it tumbles down, XELIAX has to catch it
function dropFicelle(b){
  key = {x:b.x + b.w / 2 - 17, y:b.y + b.h / 2, w:34, h:16, got:false, kind:'ficelle', fall:true, vy:-5, rot:0};
  sparkle(b.x + b.w / 2, b.y + b.h / 2, 20, '#ffe066');
  for(let i = 0; i < 16; i++) particles.push({x:b.x + b.w / 2, y:b.y + b.h / 2, vx:(Math.random() - 0.5) * 5, vy:-2 - Math.random() * 3, life:90, max:90, color:i % 2 ? '#1a1430' : '#ffffff', grav:0.08, size:3, type:'confetti', rot:Math.random() * TAU, vr:0.3, drag:0.97});
  showToast('La pie lâche la ficelle aux olives ! Attrape-la !', 170);
  SFX.key();
}

// ---------------------------------------------------------------- drawing
function drawGecko(b){
  const x = ix(b), y = iy(b), cx = x + b.w / 2, cy = y + b.h / 2;
  const p2 = b.phase === 2, hit = b.hitT > 0 || (b.inv > 0 && Math.floor(b.inv / 4) % 2 === 0);
  const body = hit ? '#ffffff' : p2 ? '#ef7a3c' : '#5fd36a', dark = p2 ? '#6a2410' : '#1f6a2c', belly = p2 ? '#ffd2a0' : '#e8f59a';
  const dazed = b.state === 'stun' || b.state === 'stuck';
  ctx.save(); ctx.translate(cx, cy);
  // orientation: along the wall (head up, feet on the wall), on the floor, or following the leap
  if(b.state === 'leap'){
    const vx = (b.lx1 - b.lx0) / b.ldur, k = b.lt / b.ldur, vy = (b.ly1 - b.ly0) / b.ldur - Math.cos(k * Math.PI) * Math.PI * 80 / b.ldur;
    ctx.rotate(Math.atan2(vy, vx)); if(vx < 0) ctx.scale(1, -1);
  } else if(b.state === 'stun' || b.state === 'drop'){ if(b.side > 0) ctx.scale(-1, 1); }
  else { ctx.rotate(-Math.PI / 2); if(b.side < 0) ctx.scale(1, -1); }
  const wig = Math.sin(b.t * 0.3) * (b.state === 'crawl' || b.state === 'climb' ? 1 : 0.2);
  // tail
  ctx.strokeStyle = dark; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-14, 2); ctx.quadraticCurveTo(-30, 4 + wig * 6, -34, -6 + wig * 4); ctx.quadraticCurveTo(-36, -14, -28, -14); ctx.stroke();
  ctx.strokeStyle = body; ctx.lineWidth = 4.5; ctx.stroke();
  // legs with sticky toe pads
  for(const [lx, s] of [[-8, 1], [10, -1]]) for(const side of [-1, 1]){
    const sw = side * wig * s * 3;
    ctx.strokeStyle = dark; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(lx, 6); ctx.lineTo(lx + 6 * side + sw, 15); ctx.stroke();
    ctx.fillStyle = belly; ctx.beginPath(); ctx.arc(lx + 6 * side + sw, 16, 3, 0, TAU); ctx.fill(); ctx.strokeStyle = dark; ctx.lineWidth = 1; ctx.stroke();
  }
  // body
  ctx.fillStyle = body; ctx.strokeStyle = dark; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.ellipse(0, 2, 18, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(0, 7, 12, 4.5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = rgba(dark, 0.55);
  for(const [sx, sy, r] of [[-8, -3, 2.6], [1, -5, 2.2], [9, -2, 2], [-2, 0, 1.6]]){ ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill(); }
  // head
  ctx.fillStyle = body; ctx.strokeStyle = dark; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.ellipse(20, -1, 11, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
  for(const ey of [-5, 4]){
    ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(23, ey, 4.4, 0, TAU); ctx.fill(); ctx.strokeStyle = dark; ctx.lineWidth = 1.2; ctx.stroke();
    if(dazed){
      ctx.strokeStyle = dark; ctx.lineWidth = 1; ctx.beginPath();
      for(let k = 0; k < 14; k++){ const a = k * 0.7 + frame * 0.25, r = k * 0.28; ctx.lineTo(23 + Math.cos(a) * r, ey + Math.sin(a) * r); }
      ctx.stroke();
    } else { ctx.fillStyle = '#14082a'; ctx.fillRect(22.4, ey - 3.4, 1.6, 6.8); }
  }
  ctx.strokeStyle = dark; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(30, 2); ctx.quadraticCurveTo(26, 6, 21, 5); ctx.stroke();
  if(b.state === 'crawl' && b.fireT < 14){ ctx.fillStyle = '#9dff5a'; ctx.beginPath(); ctx.arc(31, 2, 3 + (14 - b.fireT) * 0.2, 0, TAU); ctx.fill(); }
  ctx.restore();
  if(dazed) for(let i = 0; i < 3; i++){ const a = frame * 0.12 + i * TAU / 3; ctx.fillStyle = '#ffe066'; star(cx + Math.cos(a) * 22, y - 8 + Math.sin(a) * 5, 3.4, frame * 0.1); }
}

function drawYeti(b){
  const x = ix(b), y = iy(b), cx = x + b.w / 2, base = y + b.h;
  const p2 = b.phase === 2, hit = b.hitT > 0 || (b.inv > 0 && Math.floor(b.inv / 4) % 2 === 0);
  const fur = hit ? '#ffffff' : '#eef6ff', shadeC = '#a8c4e6', face = p2 ? '#7a8ad8' : '#6aa6e0';
  const charging = b.state === 'charge', roar = b.state === 'roar', dizzy = b.state === 'dizzy';
  ctx.save(); ctx.translate(cx, base);
  ctx.scale(b.face || 1, 1);
  if(charging) ctx.rotate(0.18);
  if(roar) ctx.translate((Math.random() - 0.5) * 3, 0);
  const step = b.state === 'walk' ? Math.sin(b.t * 0.15) : charging ? Math.sin(b.t * 0.6) : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0, 0, 30, 5, 0, 0, TAU); ctx.fill();
  // feet
  ctx.fillStyle = shadeC;
  for(const s of [-1, 1]){ ctx.beginPath(); ctx.ellipse(s * 12 + step * s * 3, -4, 10, 6, 0, 0, TAU); ctx.fill(); }
  // body: a big furry blob
  const g = ctx.createLinearGradient(0, -b.h, 0, 0);
  g.addColorStop(0, fur); g.addColorStop(1, hit ? '#ffffff' : '#c8dcf4');
  ctx.fillStyle = g; ctx.strokeStyle = '#3a5a86'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-26, -6);
  ctx.bezierCurveTo(-34, -40, -22, -62, 0, -62);
  ctx.bezierCurveTo(22, -62, 34, -40, 26, -6);
  for(let i = 0; i <= 6; i++){ const xx = 26 - i * 52 / 6; ctx.lineTo(xx + 4, -2 - (i % 2) * 5); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // fur tufts
  ctx.strokeStyle = 'rgba(90,130,180,0.45)'; ctx.lineWidth = 1.2;
  for(let i = 0; i < 7; i++){ const tx = -18 + i * 6, ty = -18 - (i % 3) * 9; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + 2, ty + 5); ctx.stroke(); }
  // arms
  const armA = charging ? -0.9 : roar ? -2.2 : 0.3 + step * 0.2;
  for(const s of [-1, 1]){
    ctx.save(); ctx.translate(s * 22, -38); ctx.rotate(s > 0 ? -armA : armA * 0.7);
    ctx.fillStyle = fur; ctx.strokeStyle = '#3a5a86'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.ellipse(s * 4, 14, 7, 15, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // face
  ctx.fillStyle = face; ctx.strokeStyle = '#2a3a6a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(6, -40, 15, 12, 0, 0, TAU); ctx.fill(); ctx.stroke();
  for(const ex of [0, 12]){
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(ex, -43, 3.6, 4, 0, 0, TAU); ctx.fill();
    if(dizzy){ ctx.strokeStyle = '#14082a'; ctx.lineWidth = 0.9; ctx.beginPath(); for(let k = 0; k < 12; k++){ const a = k * 0.7 + frame * 0.25, r = k * 0.28; ctx.lineTo(ex + Math.cos(a) * r, -43 + Math.sin(a) * r); } ctx.stroke(); }
    else { ctx.fillStyle = p2 || charging || roar ? '#ff3d3d' : '#14082a'; ctx.beginPath(); ctx.arc(ex + 1, -42.5, 1.8, 0, TAU); ctx.fill(); }
  }
  ctx.strokeStyle = '#1a2450'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-4, -50); ctx.lineTo(4, -47); ctx.moveTo(16, -50); ctx.lineTo(9, -47); ctx.stroke();
  if(roar || charging){ ctx.fillStyle = '#2a0a1a'; ctx.beginPath(); ctx.ellipse(7, -32, 7, 4.5, 0, 0, TAU); ctx.fill(); ctx.fillStyle = '#ffffff'; for(const tx of [2, 7, 12]){ ctx.beginPath(); ctx.moveTo(tx - 1.6, -35.5); ctx.lineTo(tx, -32.5); ctx.lineTo(tx + 1.6, -35.5); ctx.fill(); } }
  else { ctx.strokeStyle = '#1a2450'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(1, -33); ctx.quadraticCurveTo(7, -30, 13, -33); ctx.stroke(); }
  // the ice helmet with its spikes (that's why stomping does nothing)
  ctx.fillStyle = 'rgba(170,226,255,0.88)'; ctx.strokeStyle = '#2f6a9a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(2, -56, 22, 10, 0, Math.PI, TAU); ctx.closePath(); ctx.fill(); ctx.stroke();
  for(const sx of [-12, 2, 16]){ ctx.beginPath(); ctx.moveTo(sx - 4, -62); ctx.lineTo(sx, -76); ctx.lineTo(sx + 4, -62); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(-10, -63, 10, 2);
  ctx.restore();
  if(roar) outlined('!', cx, y - 26, 20, '#ff3d3d', '#ffffff', 4, FD, 400, 'center');
  if(dizzy) for(let i = 0; i < 3; i++){ const a = frame * 0.12 + i * TAU / 3; ctx.fillStyle = '#ffe066'; star(cx + Math.cos(a) * 24, y - 22 + Math.sin(a) * 5, 3.6, frame * 0.1); }
  if(p2 && frame % 8 === 0 && fxTick) particles.push({x:cx + (Math.random() - 0.5) * 30, y:y - 10, vx:0, vy:-0.6, life:30, max:30, color:'#ffffff', grav:-0.01, size:3, type:'puff', drag:0.95});
}

function drawMagpie(b){
  const x = ix(b) + (b.state === 'stuck' ? (b.shakeX || 0) : 0), y = iy(b), cx = x + b.w / 2, cy = y + b.h / 2;
  const p2 = b.phase === 2, hit = b.hitT > 0 || (b.inv > 0 && Math.floor(b.inv / 4) % 2 === 0);
  const p3 = b.phase === 3, black = hit ? '#ffffff' : '#1a1430', blue = hit ? '#ffffff' : p3 ? '#e0242a' : p2 ? '#b8306a' : '#2f5ad8';
  if(p3){ softGlow(cx, cy, 44, 34, '255,60,60', 0.25 + 0.1 * Math.sin(frame * 0.2)); if(frame % 5 === 0) particles.push({x:cx + (Math.random() - 0.5) * 36, y:cy + (Math.random() - 0.5) * 24, vx:(Math.random() - 0.5) * 1.2, vy:-0.8, life:26, max:26, color:Math.random() < 0.5 ? '#ff3d3d' : '#ffb03d', grav:-0.02, size:2.6, type:'dot'}); }
  const stuck = b.state === 'stuck', dive = b.state === 'dive', aim = b.state === 'aim';
  if(aim){
    // a dotted line to where she's about to dive
    ctx.strokeStyle = `rgba(255,80,80,${0.5 + 0.4 * Math.sin(frame * 0.5)})`; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(b.tx + b.w / 2, b.ty + b.h / 2); ctx.stroke(); ctx.setLineDash([]);
    const my = b.ty > 150 ? FLOOR : 34;
    softGlow(b.tx + b.w / 2, my, 30, 10, '255,60,60', 0.5);
    outlined('!', cx, y - 12, 20, '#ff3d3d', '#ffffff', 4, FD, 400, 'center');
  }
  ctx.save(); ctx.translate(cx, cy);
  let ang = 0;
  if(dive) ang = Math.atan2(b.vy, Math.abs(b.vx) + 0.001) * (b.vx < 0 ? -1 : 1);
  if(stuck) ang = b.ceil ? -1.25 : 1.25;
  ctx.scale(b.face || 1, 1);
  ctx.rotate(ang);
  const flap = stuck ? Math.sin(frame * 0.8) * 0.9 : dive ? -0.9 : Math.sin(frame * 0.3) * 0.8;
  // tail
  ctx.fillStyle = black; ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-42, -6 + Math.sin(frame * 0.1) * 2); ctx.lineTo(-44, 0); ctx.lineTo(-42, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = rgba(p2 ? '#ff6aa0' : '#3fe0c0', 0.75); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-40, -2); ctx.stroke();
  // back wing
  ctx.save(); ctx.translate(-2, -4); ctx.rotate(-flap);
  ctx.fillStyle = blue; ctx.beginPath(); ctx.ellipse(-10, -6, 16, 7, -0.4, 0, TAU); ctx.fill(); ctx.strokeStyle = '#0a0820'; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(-4, -6, 5, 3, -0.4, 0, TAU); ctx.fill();
  ctx.restore();
  // body
  ctx.fillStyle = black; ctx.beginPath(); ctx.ellipse(0, 0, 18, 13, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = hit ? '#ffffff' : '#f4f2ff'; ctx.beginPath(); ctx.ellipse(2, 5, 11, 7, 0, 0, TAU); ctx.fill();
  if(p2){
    // phase 2: an armour of stolen trinkets (stomping only goes ting, a dash breaks through)
    const cols = ['#ffd54a', '#7df9ff', '#ff6aa0', '#c8ff6a', '#ffd54a'];
    for(let i = 0; i < 5; i++){
      const a = -2.55 + i * 0.42, px = Math.cos(a) * 17, py = Math.sin(a) * 12.5, s = 4.2;
      ctx.save(); ctx.translate(px, py); ctx.rotate(a + Math.PI / 2);
      ctx.fillStyle = hit ? '#ffffff' : cols[i];
      ctx.beginPath(); ctx.moveTo(0, -s * 1.5); ctx.lineTo(s, 0); ctx.lineTo(0, s * 0.6); ctx.lineTo(-s, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2a1a40'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    }
    if(Math.floor(frame / 6 + b.t) % 9 === 0){ ctx.fillStyle = '#ffffff'; star(Math.cos(-1.7) * 17, Math.sin(-1.7) * 12.5 - 4, 2.6, frame * 0.2); }
  }
  // front wing
  ctx.save(); ctx.translate(0, -2); ctx.rotate(flap * 0.8);
  ctx.fillStyle = blue; ctx.beginPath(); ctx.ellipse(-8, -2, 15, 7, -0.25, 0, TAU); ctx.fill(); ctx.strokeStyle = '#0a0820'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(-2, -2, 5, 3, -0.25, 0, TAU); ctx.fill();
  ctx.restore();
  // head and the stolen ficelle in her beak
  ctx.fillStyle = black; ctx.beginPath(); ctx.arc(16, -7, 9, 0, TAU); ctx.fill(); ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(19, -9, 3.3, 0, TAU); ctx.fill();
  if(stuck){ ctx.strokeStyle = '#14082a'; ctx.lineWidth = 1; ctx.beginPath(); for(let k = 0; k < 12; k++){ const a = k * 0.7 + frame * 0.25, r = k * 0.25; ctx.lineTo(19 + Math.cos(a) * r, -9 + Math.sin(a) * r); } ctx.stroke(); }
  else { ctx.fillStyle = p2 ? '#ff2d5a' : '#14082a'; ctx.beginPath(); ctx.arc(20, -9, 1.6, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = '#000000'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(14, -15); ctx.lineTo(22, -13); ctx.stroke();
  if(!b.lost) drawFicelle(30, -3, 26, 0.15, false, 5);
  ctx.fillStyle = '#4a4a5a'; ctx.beginPath(); ctx.moveTo(23, -8); ctx.lineTo(34, -5); ctx.lineTo(23, -3); ctx.closePath(); ctx.fill();
  ctx.restore();
  if(stuck) for(let i = 0; i < 3; i++){ const a = frame * 0.12 + i * TAU / 3; ctx.fillStyle = '#ffe066'; star(cx + Math.cos(a) * 22, (b.ceil ? y + b.h + 10 : y - 8) + Math.sin(a) * 5, 3.4, frame * 0.1); }
}


// a wooden gate takes a few shots, then bursts into planks
function hitGate(g, s){
  g.hp--; g.flash = 8;
  SFX.stomp(); addShake(2);
  crumbs(s.x + s.w / 2, s.y + s.h / 2, 4, '#c9874a');
  if(g.hp > 0) return;
  g.gone = true;
  solids = solids.filter(w => w !== g);
  for(let i = 0; i < 14; i++) particles.push({x:g.x + Math.random() * g.w, y:g.y + Math.random() * g.h, vx:(Math.random() - 0.5) * 4, vy:-2 - Math.random() * 3,
    life:50, max:50, color:i % 3 ? '#a8692e' : '#5e3517', grav:0.25, size:3 + Math.random() * 3, type:'crumb', rot:Math.random() * TAU, vr:(Math.random() - 0.5) * 0.5});
  burst(g.x + g.w / 2, g.y + g.h / 2, 10, '#ffffff', 2, 26, -0.01, 4, 'puff');
  addShake(7); SFX.crumble(); SFX.door();
  score += 50; popup(g.x + g.w / 2, g.y + 10, '+50', '#ffd54a');
  if(player.standingOn === g){ player.standingOn = null; player.onGround = false; }
}

function killFx(e){
  const bat = e.ax !== undefined;
  const col = bat ? '#6b44a8' : (CRITTER[chIndex] || '#ff8a3d');
  burst(e.x + e.w/2, e.y + e.h/2, 12, col, 3, 32, 0.18, 3, 'goo');
  burst(e.x + e.w/2, e.y + e.h/2, 6, '#ffffff', 2, 22, 0.05, 2.5, 'star');
  if(!bat) particles.push({type:'splat', x:e.x + e.w/2, y:e.y + e.h, vx:0, vy:0, life:40, max:40, color:col, grav:0, size:14});
  popup(e.x + e.w/2, e.y - 4, '+25', '#ffffff');
}

function doJump(){
  player.vy = JUMP_V * gdir;
  player.coyote = 0; player.buffer = 0; player.dashT = 0;
  player.onGround = false; player.standingOn = null; player.noCut = false;
  player.sx = 0.75; player.sy = 1.25;
  anim.wobV -= 0.35;
  dust(player.x + player.w/2, gdir > 0 ? player.y + player.h : player.y, 5);
  SFX.jump();
}

function updateParticles(){
  for(const p of particles){
    p.x += p.vx; p.y += p.vy; p.vy += p.grav;
    p.vx *= p.drag || 0.97;
    if(p.vr) p.rot += p.vr;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

// floating pollen, spores or embers drawn over the scene
function makeAmbient(){
  ambient = [];
  const deco = decoOf();
  const n = deco === 'cave' ? 26 : deco === 'hills' ? 12 : deco === 'night' ? 22 : (deco === 'fortress' || deco === 'ascent') ? 34
          : deco === 'sky' ? 18 : deco === 'canyon' ? 16 : deco === 'ice' ? 46 : deco === 'nest' ? 40 : deco === 'cosmos' ? 28 : 0;
  for(let i = 0; i < n; i++) ambient.push({x:Math.random()*W, y:Math.random()*H, ph:Math.random()*6, s:0.5 + Math.random(), z:0.3 + Math.random()*0.7});
}
function updateAmbient(){
  if(!room) return;
  const deco = decoOf();
  for(const p of ambient){
    p.ph += 0.03;
    if(deco === 'hills'){ p.x += 0.35 * p.z + Math.sin(p.ph) * 0.3; p.y += 0.3 * p.z; }
    else if(deco === 'cave'){ p.x += Math.sin(p.ph) * 0.15; p.y -= 0.15 * p.z; }
    else if(deco === 'night'){ p.x += Math.sin(p.ph) * 0.2; p.y -= 0.12 * p.z; }
    else if(deco === 'sky'){ p.x += Math.sin(p.ph) * 0.3; p.y -= 0.25 * p.z * (gdir > 0 ? 1 : -1); }
    else if(deco === 'canyon'){ p.x += 0.5 + 0.6 * p.z; p.y += Math.sin(p.ph) * 0.2; }
    else if(deco === 'ice'){ p.x += Math.sin(p.ph) * 0.35 - 0.1; p.y += 0.45 + 0.5 * p.z; }
    else if(deco === 'nest'){ p.x -= 1.2 + p.z; p.y += 4 + 3 * p.z; }
    else if(deco === 'cosmos'){ p.x += Math.sin(p.ph) * 0.18 - 0.06; p.y -= 0.1 * p.z; }
    else { p.x += Math.sin(p.ph * 1.3) * 0.4; p.y -= (0.6 + p.z) * 0.8; }
    if(p.y < -10){ p.y = H + 10; p.x = Math.random() * W; }
    if(p.y > H + 10){ p.y = -10; p.x = Math.random() * W; }
    if(p.x > W + 10) p.x = -10;
    if(p.x < -10) p.x = W + 10;
  }
}

// =====================================================================
//  DRAW HELPERS
// =====================================================================
function fmt(ms){
  if(ms == null) return '--:--.--';
  const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2,'0') + '.' + String(cs).padStart(2,'0');
}
function rr(x, y, w, h, r){
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function star(x, y, r, rot){
  ctx.beginPath();
  for(let i = 0; i < 8; i++){
    const a = rot + i * Math.PI / 4, rad = i % 2 ? r * 0.38 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fill();
}
function txt(text, x, y, size, color, weight=600, align='center', fam=FU){
  ctx.font = `${weight} ${size}px ${fam}`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function outlined(text, x, y, size, fill, stroke=HERO.deep, lw=5, fam=FD, weight=400, align='center'){
  ctx.font = `${weight} ${size}px ${fam}`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
// digits drawn on a fixed grid so the timer never jitters
function monoText(str, xRight, y, adv){
  ctx.textAlign = 'center';
  let x = xRight - str.length * adv;
  for(const ch of str){ ctx.fillText(ch, x + adv / 2, y); x += ch === ':' || ch === '.' ? adv : adv; }
}
function smoothStroke(pts){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i = 1; i < pts.length - 1; i++){
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  const l = pts[pts.length - 1];
  ctx.lineTo(l[0], l[1]);
  ctx.stroke();
}
function heartIcon(x, y, s, fill, outline){
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y - s * 0.02, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.58, x - s * 0.12, y + s * 0.74, x, y + s * 0.95);
  ctx.bezierCurveTo(x + s * 0.12, y + s * 0.74, x + s * 0.5, y + s * 0.58, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 0.02, x, y, x, y + s * 0.3);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if(outline){ ctx.strokeStyle = outline; ctx.lineWidth = 1.2; ctx.stroke(); }
}
function gemIcon(x, y, s, color, outline='#1d4f66'){
  ctx.beginPath();
  ctx.moveTo(x - s * 0.8, y - s * 0.25); ctx.lineTo(x - s * 0.4, y - s * 0.8); ctx.lineTo(x + s * 0.4, y - s * 0.8);
  ctx.lineTo(x + s * 0.8, y - s * 0.25); ctx.lineTo(x, y + s); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.moveTo(x - s * 0.4, y - s * 0.8); ctx.lineTo(x, y - s * 0.25); ctx.lineTo(x - s * 0.8, y - s * 0.25); ctx.closePath(); ctx.fill();
}
function coinIcon(x, y, r, spin=1){
  const w = Math.max(1, r * Math.abs(spin));
  ctx.fillStyle = '#b07a00'; ctx.beginPath(); ctx.ellipse(x + 0.7, y + 0.4, w, r, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.ellipse(x, y, w, r, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#ffe680'; ctx.beginPath(); ctx.ellipse(x, y, w * 0.58, r * 0.62, 0, 0, TAU); ctx.fill();
}

// =====================================================================
//  DRAW: HERO
// =====================================================================
const HB = { a:14.2, b:7.7, cy:-19.3 };   // body half-width, half-height, centre above the feet
let heroFill = HERO.body;

function bodyPath(cx, cy, a, b, wob, t){
  ctx.beginPath();
  const N = 30;
  for(let i = 0; i <= N; i++){
    const th = (i / N) * TAU;
    const c = Math.cos(th), s = Math.sin(th);
    const px = Math.sign(c) * Math.pow(Math.abs(c), 0.78);
    const py = Math.sign(s) * Math.pow(Math.abs(s), 0.78);
    const j = 1 + wob * 0.11 * Math.cos(2 * th) + 0.018 * Math.sin(3 * th + t * 0.07);
    const X = cx + px * a * j;
    const Y = cy + py * b * (2 - j) * (s > 0 ? 0.96 : 1) - (s < 0 && c < -0.2 ? 0.6 * -s : 0);
    if(i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}

function limb(ax, ay, L, len, kind, thick, side=1){
  const n = 8, pts = [[ax, ay]];
  let x = ax, y = ay;
  for(let i = 1; i <= n; i++){
    const t = i / n;
    const ang = L.a + L.c * t + Math.sin(L.ph - t * 3.2) * L.amp * t;
    if(kind === 'arm'){ x += side * Math.cos(ang) * len / n; y += Math.sin(ang) * len / n; }
    else { x += Math.sin(ang) * len / n; y += Math.cos(ang) * len / n; }
    pts.push([x, y]);
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = HERO.deep; ctx.lineWidth = thick + 1.8; smoothStroke(pts);
  ctx.strokeStyle = heroFill; ctx.lineWidth = thick; smoothStroke(pts);
  const p1 = pts[n - 1], p2 = pts[n];
  return {x:p2[0], y:p2[1], ang:Math.atan2(p2[1] - p1[1], p2[0] - p1[0])};
}

function drawMouth(a, by){
  const f = a.curFace;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = HERO.line; ctx.lineWidth = 1.15;
  if(f === 'open'){
    ctx.beginPath();
    ctx.moveTo(-10.2, by - 1.6);
    ctx.bezierCurveTo(-7, by + 8.4, 7, by + 8.8, 10.6, by - 0.6);
    ctx.quadraticCurveTo(0, by + 1.8, -10.2, by - 1.6);
    ctx.closePath();
    ctx.fillStyle = HERO.mouth; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = HERO.tongue; ctx.beginPath(); ctx.ellipse(1, by + 6.4, 4.4, 2.6, 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.stroke();
  } else if(f === 'o'){
    ctx.beginPath(); ctx.ellipse(1.5, by + 2.6, 2.4, 3, 0, 0, TAU);
    ctx.fillStyle = HERO.mouth; ctx.fill(); ctx.stroke();
  } else if(f === 'ko'){
    ctx.beginPath(); ctx.moveTo(-8, by + 2.6);
    for(let i = 1; i <= 8; i++) ctx.lineTo(-8 + i * 2, by + 2.6 + (i % 2 ? -1.1 : 1.1));
    ctx.stroke();
    ctx.fillStyle = HERO.tongue; ctx.beginPath(); ctx.ellipse(3.5, by + 5.2, 2.2, 2.8, 0.3, 0, TAU); ctx.fill(); ctx.stroke();
  } else if(f === 'hurt'){
    ctx.beginPath(); ctx.moveTo(-7, by + 2.4);
    for(let i = 1; i <= 6; i++) ctx.lineTo(-7 + i * 2.4, by + 2.4 + (i % 2 ? -1.4 : 1.4));
    ctx.stroke();
  } else if(f === 'sad'){
    ctx.beginPath(); ctx.moveTo(-7.5, by + 4.6); ctx.bezierCurveTo(-4, by + 0.6, 4, by + 0.6, 7.8, by + 4.8); ctx.stroke();
  } else {
    // the wide grin from the drawing, with its little cheek dimples
    ctx.beginPath(); ctx.moveTo(-11.2, by - 2.0); ctx.bezierCurveTo(-8, by + 7.4, 7.6, by + 7.8, 11.4, by - 0.6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12.6, by - 3.6); ctx.quadraticCurveTo(-11.0, by - 2.4, -11.4, by - 0.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12.7, by - 2.4); ctx.quadraticCurveTo(11.2, by - 1.0, 11.8, by + 1.0); ctx.stroke();
  }
}

function drawEyes(a, by){
  const E = [{x:-3.6, y:by - 5.0, rx:4.2, ry:5.9}, {x:4.0, y:by - 5.6, rx:4.1, ry:6.3}];
  for(let i = 0; i < 2; i++){
    const e = E[i], p = a.eyes[i];
    let open = 1;
    const bp = a.blinkP - i * 0.15;
    if(a.blinkP > 0 && bp > 0 && bp < 1) open = 1 - Math.sin(Math.PI * bp) * 0.92;
    if(a.curFace === 'hurt') open = Math.min(open, 0.35);
    if(a.lid > 0.01) open = Math.min(open, 1 - a.lid * 0.93);
    if(a.wink && i === 1){
      // a wink: one happy closed eye
      ctx.beginPath(); ctx.ellipse(e.x, e.y, e.rx, e.ry, 0, 0, TAU); ctx.fillStyle = heroFill; ctx.fill();
      ctx.beginPath(); ctx.arc(e.x, e.y + e.ry * 0.25, e.rx * 0.75, 1.15 * Math.PI, 1.85 * Math.PI);
      ctx.strokeStyle = HERO.line; ctx.lineWidth = 1.3; ctx.lineCap = 'round'; ctx.stroke();
      continue;
    }
    if(a.lid > 0.72){
      ctx.beginPath(); ctx.ellipse(e.x, e.y, e.rx, e.ry, 0, 0, TAU);
      ctx.fillStyle = heroFill; ctx.fill(); ctx.strokeStyle = HERO.line; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.arc(e.x, e.y - e.ry * 0.05, e.rx * 0.72, 0.18 * Math.PI, 0.82 * Math.PI);
      ctx.lineWidth = 1.15; ctx.lineCap = 'round'; ctx.stroke();
      continue;
    }
    if(a.curFace === 'ko'){
      // dizzy spirals instead of pupils
      ctx.save(); ctx.translate(e.x, e.y);
      ctx.beginPath(); ctx.ellipse(0, 0, e.rx, e.ry, 0, 0, TAU); ctx.fillStyle = HERO.eye; ctx.fill();
      ctx.strokeStyle = HERO.line; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath();
      for(let k = 0; k <= 22; k++){ const an = k * 0.6 + a.t * 0.25 * (i ? -1 : 1), rr2 = k * 0.17; ctx.lineTo(Math.cos(an) * rr2 * (e.rx / 4), Math.sin(an) * rr2 * (e.ry / 4)); }
      ctx.lineWidth = 0.9; ctx.stroke();
      ctx.restore();
      continue;
    }
    ctx.save();
    ctx.translate(e.x, e.y); ctx.scale(1, open);
    ctx.beginPath(); ctx.ellipse(0, 0, e.rx, e.ry, 0, 0, TAU);
    ctx.fillStyle = HERO.eye; ctx.fill();
    ctx.lineWidth = 1 / Math.max(open, 0.35); ctx.strokeStyle = HERO.line; ctx.stroke();
    if(open > 0.3){
      const px = p.x * (e.rx - 1.9), py = p.y * (e.ry - 2.3);
      ctx.fillStyle = HERO.line;
      ctx.beginPath(); ctx.ellipse(px, py, 1.55, 1.9, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(px - 0.5, py - 0.7, 0.45, 0, TAU); ctx.fill();
    }
    ctx.restore();
    if(a.curFace === 'sad'){
      ctx.beginPath(); ctx.ellipse(e.x, e.y - e.ry * 0.3, e.rx + 0.7, e.ry * 0.72, 0, Math.PI, TAU); ctx.closePath();
      ctx.fillStyle = heroFill; ctx.fill(); ctx.strokeStyle = HERO.line; ctx.lineWidth = 1; ctx.stroke();
    }
  }
}

function drawBlaster(tip, a){
  ctx.save();
  ctx.translate(tip.x, tip.y); ctx.rotate(tip.ang);
  rr(-1.5, -2.4, 7, 4.8, 1.8); ctx.fillStyle = '#ff8a3d'; ctx.fill();
  ctx.strokeStyle = '#5a2008'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#5a2008'; ctx.fillRect(4.5, -1.2, 2.2, 2.4);
  if(a.shootT > 7){
    ctx.fillStyle = 'rgba(255,240,170,0.9)';
    star(9, 0, 4 + (a.shootT - 7) * 0.8, frame * 0.3);
  }
  ctx.restore();
}

function drawHero(a, x, y, sc=1, o={}){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  const ap = a.appear < 1 ? Math.max(0.01, easeOutBack(a.appear)) : 1;
  const ex = 1 - easeInCubic(a.exit || 0);
  const s = Math.max(0.01, ap * ex);
  ctx.scale(s, s);
  ctx.scale(a.sx || 1, a.sy || 1);
  ctx.rotate(a.lean + (a.exit || 0) * 0.7);
  const by = HB.cy - a.bob + a.breath * 0.35;
  if(a.spin > 0){
    ctx.translate(0, by);
    ctx.rotate(easeInOutCubic(a.spin) * TAU * (a.fx >= 0 ? 1 : -1));
    ctx.translate(0, -by);
  }
  if(o.rot){
    // lying on the floor (KO): rest the turned body on the ground
    if(o.rest) ctx.translate(0, -by - Math.hypot(HB.a * Math.sin(o.rot), HB.b * Math.cos(o.rot)) * 0.92);
    ctx.translate(0, by); ctx.rotate(o.rot); ctx.translate(0, -by);
  }
  const fx = Math.abs(a.fx) < 0.2 ? 0.2 * (a.fx >= 0 ? 1 : -1) : a.fx;
  ctx.scale(fx, 1);
  heroFill = o.flash ? '#ffffff' : (o.tint || HERO.body);

  limb(-6, by + 6.2, a.legs[0], 13, 'leg', 3.1);
  limb(6.2, by + 6.2, a.legs[1], 13, 'leg', 3.1);
  limb(-12.2, by + 1.4, a.arms[0], 10, 'arm', 3, -1);
  const tip = limb(12.2, by - 0.8, a.arms[1], 12.5, 'arm', 3, 1);

  bodyPath(0, by, HB.a, HB.b, a.wob, a.t);
  ctx.fillStyle = heroFill; ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = 'rgba(16,0,60,0.28)';
  ctx.beginPath(); ctx.ellipse(1.5, by + 7.5, HB.a + 2, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath(); ctx.ellipse(-7.5, by - 3.4, 4, 1.7, -0.35, 0, TAU); ctx.fill();
  ctx.restore();
  bodyPath(0, by, HB.a, HB.b, a.wob, a.t);
  ctx.strokeStyle = HERO.deep; ctx.lineWidth = 1.7; ctx.stroke();

  drawMouth(a, by);
  drawEyes(a, by);
  if(o.bandage){
    // a little plaster after the backflip
    ctx.save(); ctx.translate(7.5, by - 6.8); ctx.rotate(0.55);
    rr(-6, -2.1, 12, 4.2, 1.4); ctx.fillStyle = '#fbe7cf'; ctx.fill(); ctx.strokeStyle = '#b89a80'; ctx.lineWidth = 0.7; ctx.stroke();
    ctx.fillStyle = 'rgba(184,154,128,0.55)'; for(const dx of [-3.6, 3.6]) for(const dy of [-0.8, 0.8]){ ctx.beginPath(); ctx.arc(dx, dy, 0.35, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-1.6, -1.6, 3.2, 3.2);
    ctx.restore();
  }
  if(o.armed && !o.ficelle) drawBlaster(tip, a);
  if(o.phone) drawHandset(tip);
  if(o.ficelle) drawFicelle(tip.x + 7, tip.y - 3, 26, -0.45, false, 5.5, o.ficelle === true ? false : o.ficelle);
  ctx.restore();
  heroFill = HERO.body;
}

// a red telephone handset held at the tentacle tip
function drawHandset(tip){
  ctx.save(); ctx.translate(tip.x - 1, tip.y - 2); ctx.rotate(-1.15);
  ctx.lineJoin = 'round';
  ctx.fillStyle = '#e5352f'; ctx.strokeStyle = '#5a0a0e'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(-8, -1); ctx.quadraticCurveTo(0, -4.2, 8, -1); ctx.lineTo(8, 1.6); ctx.quadraticCurveTo(0, -1.4, -8, 1.6); ctx.closePath(); ctx.fill(); ctx.stroke();
  rr(-10.5, -1.5, 5.5, 5.5, 2); ctx.fill(); ctx.stroke();
  rr(5, -1.5, 5.5, 5.5, 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(-4, -2.2, 6, 0.9);
  ctx.restore();
}

function drawPlayer(){
  if(player.dead || state === 'title') return;
  const x = ix(player) + player.w/2, y = iy(player) + player.h;
  // dash afterimages
  for(const gh of player.ghosts){
    const a = gh.t / 16;
    ctx.save();
    const gcy = gh.y + player.h / 2;
    if(gh.g < 0){ ctx.translate(0, gcy); ctx.scale(1, -1); ctx.translate(0, -gcy); }
    ctx.globalAlpha = 0.32 * a;
    ctx.fillStyle = POWER_COLORS.dash;
    ctx.beginPath(); ctx.ellipse(gh.x + player.w / 2, gh.y + player.h - 19, 14 * (0.7 + a * 0.3), 8 * (0.7 + a * 0.3), 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  const gv = anim.gv === undefined ? 1 : anim.gv;
  if(gv < 0.999){
    // upside down: mirror XELIAX around his middle (he flips over when gravity changes)
    const mid = iy(player) + player.h / 2;
    ctx.translate(0, mid); ctx.scale(1, Math.abs(gv) < 0.12 ? 0.12 * Math.sign(gv || 1) : gv); ctx.translate(0, -mid);
  }
  drawPlayerBody(x, y);
  ctx.restore();
}
function drawPlayerBody(x, y){
  if(player.onGround && exitT === 0){
    ctx.fillStyle = theme().dark ? 'rgba(0,0,0,0.32)' : 'rgba(30,20,60,0.18)';
    ctx.beginPath(); ctx.ellipse(x, y, 12, 2.6, 0, 0, TAU); ctx.fill();
  }
  let alpha = 1;
  if(player.invuln > 0 && player.hurtT <= 0 && finaleT === 0) alpha = 0.55 + 0.45 * Math.abs(Math.cos(player.invuln * 0.22));
  const flash = player.hurtT > 0 && Math.floor(player.hurtT / 3) % 2 === 0;
  const knocked = idle.phase === 'ko' || idle.phase === 'up';
  drawHero(anim, x, y + 0.5, 1, {alpha, flash, armed:canShoot && !knocked, ficelle:finaleT > 0 && !(steal && steal.got) ? (key && key.gold ? key.gold : true) : false,
    rot:idle.rot, rest:idle.phase === 'ko' && player.onGround, bandage:idle.bandage > 0 || idle.phase === 'up'});
}

// =====================================================================
//  DRAW: BACKGROUNDS (parallax, one world per chapter)
// =====================================================================
function drawBackground(cx, cy){
  const deco = decoOf(), th = theme();
  const by = (room.h - H - cy) * 0.35;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]); g.addColorStop(0.55, th.sky[1]); g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if(deco === 'hills') bgHills(cx, by, th);
  else if(deco === 'cave') bgCave(cx, by, th);
  else if(deco === 'tower') bgTower(cx, by, th);
  else if(deco === 'night') bgNight(cx, cy, by, th);
  else if(deco === 'sky') bgSky(cx, cy, by, th);
  else if(deco === 'canyon') bgCanyon(cx, cy, by, th);
  else if(deco === 'ice') bgIce(cx, cy, by, th);
  else if(deco === 'nest') bgNest(cx, cy, by, th);
  else if(deco === 'cosmos') bgCosmos(cx, cy, by, th);
  else bgFortress(cx, cy, by, th, deco === 'ascent');
}

// ---- secret bonus 2: deep space, a ringed planet, nebulas and drifting asteroids
function ringedPlanet(x, y, r){
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,214,170,0.45)'; ctx.lineWidth = r * 0.16;
  ctx.beginPath(); ctx.ellipse(x, y, r * 1.9, r * 0.5, -0.3, Math.PI, TAU); ctx.stroke();
  softGlow(x, y, r * 2.6, r * 2.6, '255,140,170', 0.2);
  const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  g.addColorStop(0, '#ffc488'); g.addColorStop(0.55, '#e0607a'); g.addColorStop(1, '#4a1a66');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = r * 0.12;
  for(const dy of [-0.45, 0.02, 0.48]){ ctx.beginPath(); ctx.ellipse(x, y + dy * r, r * 1.25, r * 0.2, -0.3, 0, TAU); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,226,196,0.85)'; ctx.lineWidth = r * 0.16;
  ctx.beginPath(); ctx.ellipse(x, y, r * 1.9, r * 0.5, -0.3, 0, Math.PI); ctx.stroke();
  ctx.restore();
}
function asteroid(x, y, r, rot){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for(let k = 0; k < 8; k++){ const a = k / 8 * TAU, rr2 = r * (0.75 + hash(k * 7 + Math.round(r)) * 0.35); ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); }
  ctx.closePath(); ctx.fillStyle = '#2e2560'; ctx.fill();
  ctx.strokeStyle = 'rgba(160,220,255,0.35)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = 'rgba(10,6,30,0.45)'; ctx.beginPath(); ctx.arc(r * 0.25, r * 0.1, r * 0.25, 0, TAU); ctx.fill();
  ctx.restore();
}
function bgCosmos(cx, cy, by, th){
  for(const [x0, y0, rx, ry, rgb, a] of [[150, 90, 230, 120, '255,80,200', 0.15], [470, 220, 270, 140, '80,200,255', 0.13], [340, 50, 210, 90, '170,120,255', 0.14]]){
    const x = ((x0 - cx * 0.03) % (W + 320) + W + 320) % (W + 320) - 160;
    softGlow(x, y0 + by * 0.1 - cy * 0.02, rx, ry, rgb, a);
  }
  for(let i = 0; i < 110; i++){
    const z = 0.015 + hash(i * 7 + 1) * 0.05;
    const x = ((hash(i * 13 + 5) * (W + 40) - cx * z) % (W + 40) + W + 40) % (W + 40) - 20;
    const y = ((hash(i * 17 + 3) * (H + 40) - cy * z) % (H + 40) + H + 40) % (H + 40) - 20;
