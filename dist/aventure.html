function drawEyeBoss(b){
  const x = ix(b), y = iy(b), cx = x + b.w / 2, cy = y + b.h / 2;
  const angry = b.hp <= b.enrage, hit = b.hitT > 0;
  const aura = ctx.createRadialGradient(cx, cy, 10, cx, cy, 52);
  aura.addColorStop(0, `rgba(255,60,120,${angry ? 0.45 + 0.15 * Math.sin(frame * 0.3) : 0.25})`); aura.addColorStop(1, 'rgba(255,60,120,0)');
  ctx.fillStyle = aura; ctx.fillRect(cx - 52, cy - 52, 104, 104);
  for(let i = 0; i < 10; i++){
    const a = i * TAU / 10 + frame * (angry ? 0.05 : 0.025);
    const len = 30 + Math.sin(frame * 0.1 + i) * 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
    ctx.lineTo(cx + Math.cos(a + 0.22) * 18, cy + Math.sin(a + 0.22) * 18);
    ctx.lineTo(cx + Math.cos(a - 0.22) * 18, cy + Math.sin(a - 0.22) * 18);
    ctx.closePath();
    ctx.fillStyle = hit ? '#ffffff' : '#4a0f30'; ctx.fill();
    ctx.strokeStyle = '#1a0510'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  const g = ctx.createRadialGradient(cx - 6, cy - 6, 4, cx, cy, 22);
  g.addColorStop(0, hit ? '#ffffff' : '#c3418a'); g.addColorStop(1, hit ? '#ffd6e6' : (angry ? '#7a0f2e' : '#5b1660'));
  ctx.beginPath(); ctx.arc(cx, cy, 21, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#1a0510'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 13.5, 0, TAU); ctx.fillStyle = '#fff3ea'; ctx.fill();
  ctx.strokeStyle = 'rgba(220,40,60,0.55)'; ctx.lineWidth = 0.8;
  for(let i = 0; i < 6; i++){ const a = i * 1.05 + 0.3; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 13, cy + Math.sin(a) * 13); ctx.quadraticCurveTo(cx + Math.cos(a + 0.2) * 9, cy + Math.sin(a + 0.2) * 9, cx + Math.cos(a - 0.1) * 7, cy + Math.sin(a - 0.1) * 7); ctx.stroke(); }
  const a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
  const px = cx + Math.cos(a) * 5, py = cy + Math.sin(a) * 5;
  ctx.fillStyle = angry ? '#ff1f3d' : '#ff3d6e'; ctx.beginPath(); ctx.arc(px, py, 7, 0, TAU); ctx.fill();
  ctx.fillStyle = '#14030a'; ctx.beginPath(); ctx.ellipse(px, py, angry ? 1.6 : 3.4, 4.8, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(px - 2.4, py - 2.6, 1.6, 0, TAU); ctx.fill();
  const lid = angry ? 0.42 : 0.15 + (frame % 240 < 8 ? 0.8 : 0);
  if(lid > 0.05){
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 13.6, 0, TAU); ctx.clip();
    ctx.fillStyle = angry ? '#7a0f2e' : '#5b1660';
    ctx.fillRect(cx - 15, cy - 15, 30, 30 * lid);
    ctx.strokeStyle = '#1a0510'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx - 15, cy - 15 + 30 * lid); ctx.lineTo(cx + 15, cy - 15 + 30 * lid - (angry ? 3 : 0)); ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx, cy, 13.5, 0, TAU); ctx.strokeStyle = '#1a0510'; ctx.lineWidth = 1.4; ctx.stroke();
  // shield bubble while the last hit is still protecting it (shots bounce off)
  if(b.inv > 0 || b.shieldT > 0){
    const k = Math.max(b.inv / 60, (b.shieldT || 0) / 12);
    ctx.beginPath(); ctx.arc(cx, cy, 36 + Math.sin(frame * 0.4) * 1.5, 0, TAU);
    ctx.fillStyle = `rgba(200,220,255,${0.06 + 0.12 * k})`; ctx.fill();
    ctx.strokeStyle = `rgba(210,226,255,${0.25 + 0.55 * k})`; ctx.lineWidth = 2; ctx.stroke();
  }
}

function drawSlime(b){
  const x = ix(b), y = iy(b);
  const p2 = b.phase === 2;
  const col = p2 ? '#a24be0' : '#4fd66b', dark = p2 ? '#3e0f66' : '#1e6b32', light = p2 ? '#d7a6ff' : '#b8f5c4';
  const flash = b.hitT > 0 || (b.inv > 0 && Math.floor(b.inv / 4) % 2 === 0);
  const sq = b.squash + Math.sin(frame * 0.12) * 0.03;
  const w = b.w * (1 + sq), h = b.h * (1 - sq);
  const cx = x + b.w / 2, base = y + b.h;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  const sh = clamp(1 - (FLOOR - base) / 140, 0.3, 1);
  ctx.beginPath(); ctx.ellipse(cx, FLOOR, 30 * sh, 4 * sh, 0, 0, TAU); ctx.fill();
  const body = () => {
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, base);
    ctx.bezierCurveTo(cx - w / 2 - 4, base - h * 0.75, cx - w * 0.28, base - h, cx, base - h);
    ctx.bezierCurveTo(cx + w * 0.28, base - h, cx + w / 2 + 4, base - h * 0.75, cx + w / 2, base);
    ctx.quadraticCurveTo(cx + w * 0.3, base + 2.5, cx + w * 0.15, base);
    ctx.quadraticCurveTo(cx, base + 3.5, cx - w * 0.15, base);
    ctx.quadraticCurveTo(cx - w * 0.3, base + 2.5, cx - w / 2, base);
    ctx.closePath();
  };
  body();
  const g = ctx.createLinearGradient(0, base - h, 0, base);
  g.addColorStop(0, flash ? '#ffffff' : light); g.addColorStop(0.45, flash ? '#ffffff' : col); g.addColorStop(1, flash ? '#ffe0f0' : shade(col, -0.25));
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); body(); ctx.clip();
  for(let i = 0; i < 4; i++){
    const bx = cx + Math.sin(frame * 0.02 + i * 1.7) * w * 0.3, byy = base - h * (0.25 + 0.15 * i) + Math.sin(frame * 0.03 + i) * 3;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx, byy, 1.5 + i * 0.6, 0, TAU); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(cx - w * 0.22, base - h * 0.72, 7, 3.6, -0.5, 0, TAU); ctx.fill();
  ctx.restore();
  body(); ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.stroke();
  ctx.save();
  ctx.translate(cx, base - h + 2); ctx.rotate(sq * 0.6 + Math.sin(frame * 0.1) * 0.05);
  ctx.beginPath();
  ctx.moveTo(-14, 0); ctx.lineTo(-15, -12); ctx.lineTo(-7, -6); ctx.lineTo(0, -15); ctx.lineTo(7, -6); ctx.lineTo(15, -12); ctx.lineTo(14, 0); ctx.closePath();
  ctx.fillStyle = '#ffcc33'; ctx.fill(); ctx.strokeStyle = '#6a4600'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(0, -5, 2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2ee6ff'; ctx.beginPath(); ctx.arc(-8, -3, 1.4, 0, TAU); ctx.arc(8, -3, 1.4, 0, TAU); ctx.fill();
  ctx.restore();
  const ey = base - h * 0.52, lk = clamp((player.x - cx) * 0.03, -2.2, 2.2);
  for(const s of [-1, 1]){
    const ex = cx + s * 9;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(ex, ey, 5, 6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1.2; ctx.stroke();
    if(b.hitT > 0){
      ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(ex - 2.5, ey - 2.5); ctx.lineTo(ex + 2.5, ey + 2.5); ctx.moveTo(ex + 2.5, ey - 2.5); ctx.lineTo(ex - 2.5, ey + 2.5); ctx.stroke();
    } else {
      ctx.fillStyle = '#14082a'; ctx.beginPath(); ctx.arc(ex + lk, ey + 1, 2.4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ex + lk - 0.8, ey, 0.7, 0, TAU); ctx.fill();
    }
    if(p2 || b.hp <= b.enrage){
      ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex - s * 6, ey - 8); ctx.lineTo(ex + s * 3, ey - 5.5); ctx.stroke();
    }
  }
  ctx.strokeStyle = dark; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  if(!b.onGround){
    ctx.fillStyle = '#2a0a1a'; ctx.beginPath(); ctx.ellipse(cx, base - h * 0.22, 5, 4, 0, 0, TAU); ctx.fill(); ctx.stroke();
  } else if(p2){
    ctx.fillStyle = '#2a0a1a'; ctx.beginPath(); ctx.moveTo(cx - 9, base - h * 0.27); ctx.quadraticCurveTo(cx, base - h * 0.08, cx + 9, base - h * 0.27); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    for(const tx of [-5, 0, 5]){ ctx.beginPath(); ctx.moveTo(cx + tx - 1.8, base - h * 0.26); ctx.lineTo(cx + tx, base - h * 0.2); ctx.lineTo(cx + tx + 1.8, base - h * 0.26); ctx.fill(); }
  } else {
    ctx.beginPath(); ctx.moveTo(cx - 10, base - h * 0.3); ctx.quadraticCurveTo(cx, base - h * 0.15, cx + 10, base - h * 0.3); ctx.stroke();
  }
}

function drawSwoop(b){
  const x = ix(b), y = iy(b);
  const p2 = b.phase === 2;
  const body = p2 ? '#b0335a' : '#4057b8', dark = p2 ? '#4a0f24' : '#18245a', belly = p2 ? '#ffc2d2' : '#cdd9ff';
  const cx = x + b.w / 2, cy = y + b.h / 2;
  const warn = b.state === 'warn' || b.state === 'sweepWarn', stunned = b.state === 'stunned', dive = b.state === 'dive' || b.state === 'sweep' || b.state === 'sweepDown';
  if(b.state === 'sweep'){
    ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for(let i = 0; i < 4; i++){ const ly = cy - 12 + i * 8, lx = cx - Math.sign(b.vx) * (30 + (frame * 3 + i * 11) % 22); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - Math.sign(b.vx) * 16, ly); ctx.stroke(); }
  }
  const hit = b.hitT > 0;
  if(warn){
    const r = 42 + Math.sin(frame * 0.6) * 4;
    softGlow(cx, cy, r, r, '255,60,60', 0.42 + 0.2 * Math.sin(frame * 0.6));
    outlined('!', cx, y - 14, 20, '#ff3d3d', '#ffffff', 4, FD, 400, 'center');
  }
  if(b.cineGlow) softGlow(cx, cy, 66, 66, '255,214,120', 0.38 + 0.15 * Math.sin(frame * 0.5));
  if(!stunned && !dive){
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(cx, FLOOR, 18, 3, 0, 0, TAU); ctx.fill();
  }
  const flap = stunned ? 0.35 : dive ? -1.0 : Math.sin(frame * 0.28) * 0.7;
  for(const s of [-1, 1]){
    ctx.save(); ctx.translate(cx + s * 12, cy - 2); ctx.rotate(s * flap);
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(s * 20, -18, s * 34, -6);
    ctx.lineTo(s * 30, -1); ctx.lineTo(s * 33, 3); ctx.lineTo(s * 26, 5); ctx.lineTo(s * 27, 10); ctx.lineTo(s * 18, 9);
    ctx.quadraticCurveTo(s * 8, 10, 0, 6);
    ctx.closePath();
    ctx.fillStyle = hit ? '#ffffff' : shade(body, -0.2); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = hit ? '#ffffff' : body;
  ctx.beginPath();
  ctx.moveTo(cx - 12, cy - 16); ctx.lineTo(cx - 16, cy - 26); ctx.lineTo(cx - 4, cy - 19);
  ctx.moveTo(cx + 12, cy - 16); ctx.lineTo(cx + 16, cy - 26); ctx.lineTo(cx + 4, cy - 19);
  ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy, 22, 20, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = hit ? '#ffffff' : belly;
  ctx.beginPath(); ctx.ellipse(cx, cy + 6, 13, 11, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(dark.startsWith('#') ? dark : '#18245a', 0.35); ctx.lineWidth = 1;
  for(let r = 0; r < 2; r++) for(let i = -1; i <= 1; i++){
    const vx = cx + i * 6 + (r ? 3 : 0), vy = cy + 3 + r * 6;
    ctx.beginPath(); ctx.moveTo(vx - 2.5, vy); ctx.lineTo(vx, vy + 2.5); ctx.lineTo(vx + 2.5, vy); ctx.stroke();
  }
  for(const s of [-1, 1]){
    const ex = cx + s * 8.5, ey = cy - 6;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ex, ey, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1.4; ctx.stroke();
    if(stunned){
      ctx.strokeStyle = dark; ctx.lineWidth = 1.2; ctx.beginPath();
      for(let k = 0; k < 18; k++){ const aa = k * 0.7 + frame * 0.2 * s, rr2 = k * 0.32; ctx.lineTo(ex + Math.cos(aa) * rr2, ey + Math.sin(aa) * rr2); }
      ctx.stroke();
    } else {
      const a = Math.atan2(player.y - ey, player.x - ex);
      ctx.fillStyle = warn ? '#ff3d3d' : (p2 ? '#ffb000' : '#ffcc33');
      ctx.beginPath(); ctx.arc(ex + Math.cos(a) * 2, ey + Math.sin(a) * 2, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#14082a'; ctx.beginPath(); ctx.arc(ex + Math.cos(a) * 2.6, ey + Math.sin(a) * 2.6, 2.2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ex + Math.cos(a) * 2 - 1.5, ey + Math.sin(a) * 2 - 1.5, 0.9, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ex - s * 7, ey - (p2 ? 7 : 9)); ctx.lineTo(ex + s * 4, ey - (p2 ? 10 : 9)); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(cx - 4, cy); ctx.lineTo(cx + 4, cy); ctx.lineTo(cx, cy + 7); ctx.closePath();
  ctx.fillStyle = '#ffb02e'; ctx.fill(); ctx.strokeStyle = '#6a3a00'; ctx.lineWidth = 1; ctx.stroke();
  if(stunned || dive){
    ctx.strokeStyle = '#ffb02e'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for(const s of [-1, 1]){ ctx.beginPath(); ctx.moveTo(cx + s * 7, cy + 18); ctx.lineTo(cx + s * 7, cy + 22); ctx.lineTo(cx + s * 4, cy + 24); ctx.moveTo(cx + s * 7, cy + 22); ctx.lineTo(cx + s * 10, cy + 24); ctx.stroke(); }
  }
  if(stunned){
    for(let i = 0; i < 3; i++){
      const a = frame * 0.12 + i * TAU / 3;
      ctx.fillStyle = '#ffe066'; star(cx + Math.cos(a) * 24, y - 6 + Math.sin(a) * 5, 3.4, frame * 0.1);
    }
  }
}

function drawBoss(){
  if(!boss || !boss.alive) return;
  const ap = boss.appear === undefined ? 1 : boss.appear;
  if(ap <= 0.01) return;
  ctx.save();
  if(ap < 1){
    // materialising during its entrance
    const s = Math.max(0.01, easeOutBack(ap)), cx = ix(boss) + boss.w / 2, cy = iy(boss) + boss.h / 2;
    ctx.globalAlpha = Math.min(1, ap * 1.6);
    ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  }
  if(boss.dying){
    // the death scene: it shakes harder and harder, swells, then bursts (the magpie spins instead)
    const k = boss.dying, cx = ix(boss) + boss.w / 2, cy = iy(boss) + boss.h / 2;
    ctx.translate(cx, cy);
    if(boss.mode === 'magpie') ctx.rotate(k < 40 ? k * 0.32 : Math.sin(k * 0.35) * 0.35);
    else {
      const amp = REDUCED ? 0 : Math.min(4, k / 12);
      ctx.translate((Math.random() - 0.5) * amp * 2, (Math.random() - 0.5) * amp);
      const sw = k > BOSS_DIE - 22 ? 1 + easeInCubic((k - (BOSS_DIE - 22)) / 22) * 0.4 : 1;
      ctx.scale(sw, sw);
      if(k > BOSS_DIE - 6) ctx.globalAlpha *= (BOSS_DIE - k) / 6;
    }
    ctx.translate(-cx, -cy);
  }
  if(boss.mode === 'slime') drawSlime(boss);
  else if(boss.mode === 'swoop') drawSwoop(boss);
  else if(boss.mode === 'gecko') drawGecko(boss);
  else if(boss.mode === 'yeti'){
    // shadows where icicles are about to fall
    for(const w of boss.warn || []){ const a = 0.3 + 0.3 * Math.sin(frame * 0.5); ctx.fillStyle = `rgba(30,60,120,${a})`; ctx.beginPath(); ctx.ellipse(w.x, FLOOR, 12, 3, 0, 0, TAU); ctx.fill(); ctx.fillStyle = `rgba(200,236,255,${a + 0.3})`; ctx.beginPath(); ctx.moveTo(w.x - 5, 2); ctx.lineTo(w.x, 16); ctx.lineTo(w.x + 5, 2); ctx.closePath(); ctx.fill(); }
    drawYeti(boss);
  }
  else if(boss.mode === 'magpie') drawMagpie(boss);
  else drawEyeBoss(boss);
  ctx.restore();
  if(boss.dying) drawKO(boss);
}
// "K.O. !" pops above the beaten boss while little stars spin around its head
function drawKO(b){
  const k = b.dying, cx = ix(b) + b.w / 2, top = iy(b) - 8;
  const life = b.mode === 'magpie' ? 90 : BOSS_DIE;
  if(k > life) return;
  const fade = clamp((life - k) / 14, 0, 1);
  ctx.save(); ctx.globalAlpha = fade;
  for(let i = 0; i < 3; i++){
    const a = k * 0.16 + i * TAU / 3;
    ctx.fillStyle = i === 1 ? '#ffffff' : '#ffe066'; star(cx + Math.cos(a) * (b.w * 0.45 + 6), top + Math.sin(a) * 5, 3.6, k * 0.12 + i);
  }
  const s = REDUCED ? 1 : easeOutBack(clamp(k / 12, 0, 1)) * (1 + 0.05 * Math.sin(k * 0.3));
  ctx.translate(cx, top - 26); ctx.rotate(-0.08); ctx.scale(s, s);
  outlined('K.O. !', 0, 0, 26, '#ffe066', '#3a1030', 6, FD, 400, 'center');
  ctx.restore();
}

// a patch of burning floor: it flares up, flickers, then dies down
function drawFire(f){
  const grow = Math.min(1, f.t / 10) * Math.min(1, (f.max - f.t) / 20);
  if(grow <= 0) return;
  softGlow(f.x + f.w / 2, FLOOR - 6, f.w * 0.8, 16 * grow, '255,140,40', 0.45 * grow);
  const n = 5;
  for(let i = 0; i < n; i++){
    const x = f.x + 4 + (i + 0.5) * (f.w - 8) / n, ph = frame * 0.32 + f.seed + i * 1.7;
    const h = (12 + Math.sin(ph) * 4 + (i % 2) * 5) * grow, w = 6.5 * grow;
    ctx.fillStyle = '#ff6a1f';
    ctx.beginPath(); ctx.moveTo(x - w, FLOOR); ctx.quadraticCurveTo(x - w * 0.9, FLOOR - h * 0.5, x + Math.sin(ph * 1.3) * 2, FLOOR - h); ctx.quadraticCurveTo(x + w * 0.9, FLOOR - h * 0.5, x + w, FLOOR); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd25a';
    ctx.beginPath(); ctx.moveTo(x - w * 0.5, FLOOR); ctx.quadraticCurveTo(x - w * 0.4, FLOOR - h * 0.35, x + Math.sin(ph * 1.3), FLOOR - h * 0.6); ctx.quadraticCurveTo(x + w * 0.4, FLOOR - h * 0.35, x + w * 0.5, FLOOR); ctx.closePath(); ctx.fill();
  }
}

function drawRisingLava(){
  const top = lavaY;
  if(top > camY + H + 20) return;
  const wave = x => top + Math.sin(x * 0.045 + frame * 0.08) * 4 + Math.sin(x * 0.11 - frame * 0.05) * 2;
  const g = ctx.createLinearGradient(0, top - 6, 0, top + 140);
  g.addColorStop(0, '#fff1a8'); g.addColorStop(0.08, '#ffb03a'); g.addColorStop(0.3, '#ff5a1f'); g.addColorStop(1, '#6a0f08');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, camY + H + 40);
  for(let x = 0; x <= W; x += 8) ctx.lineTo(x, wave(x));
  ctx.lineTo(W, camY + H + 40); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,245,200,0.85)'; ctx.lineWidth = 2;
  ctx.beginPath(); for(let x = 0; x <= W; x += 8){ if(x === 0) ctx.moveTo(x, wave(x)); else ctx.lineTo(x, wave(x)); } ctx.stroke();
  lavaBubbles(12, i => { const bx = 10 + hash(i * 11) * (W - 20); return [bx, wave(bx) + 1]; }, 77);
}

function drawBarrier(){
  const y = room.barrierY;
  const gl = ctx.createLinearGradient(0, y - 14, 0, y + 14);
  gl.addColorStop(0, 'rgba(255,60,120,0)'); gl.addColorStop(0.5, `rgba(255,60,120,${0.4 + 0.15 * Math.sin(frame * 0.3)})`); gl.addColorStop(1, 'rgba(255,60,120,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, y - 14, room.w, 28);
  for(const [col, lw, amp] of [['rgba(255,120,180,0.9)', 3, 4], ['#ffffff', 1.2, 2.5]]){
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
    for(let x = 0; x <= room.w; x += 10) ctx.lineTo(x, y + (hash(x * 3 + Math.floor(frame / 3) * 101) - 0.5) * amp * 2);
    ctx.stroke();
  }
}

function drawParticles(){
  for(const p of particles){
    const a = Math.max(0, p.life / p.max);
    const x = ix(p), y = iy(p);
    switch(p.type){
      case 'star':
        ctx.globalAlpha = Math.min(1, a * 1.5); ctx.fillStyle = p.color; star(x, y, p.size * (0.4 + 0.6 * a), p.rot); break;
      case 'ring':
        ctx.globalAlpha = a; ctx.strokeStyle = p.color; ctx.lineWidth = 2.5 * a + 0.5;
        ctx.beginPath(); ctx.arc(x, y, lerp(p.r1, p.r0, a), 0, TAU); ctx.stroke(); break;
      case 'goo':
        ctx.globalAlpha = 1; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(x, y, p.size * Math.min(1, a * 3), 0, TAU); ctx.fill(); break;
      case 'eye':
        ctx.globalAlpha = Math.min(1, a * 2);
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot);
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(0, 0, p.size * 0.85, p.size, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = HERO.line; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = HERO.line; ctx.beginPath(); ctx.arc(1.2, 1.2, 1.6, 0, TAU); ctx.fill();
        ctx.restore(); break;
      case 'crumb':
        ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.color;
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore(); break;
      case 'puff':
        ctx.globalAlpha = a * 0.55; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(x, y, p.size * (1.5 - a * 0.7), 0, TAU); ctx.fill(); break;
      case 'confetti':
        ctx.globalAlpha = Math.min(1, a * 3); ctx.fillStyle = p.color;
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.fillRect(-1.5, -2.5 * Math.abs(Math.cos(p.rot * 2)), 3, 5 * Math.abs(Math.cos(p.rot * 2)) + 0.5); ctx.restore(); break;
      case 'soul': {
        // a little ghost drifting up and away, wobbling, with two dazed eyes
        const wob = Math.sin((p.max - p.life) * 0.12) * 6, sz = p.size;
        ctx.globalAlpha = Math.min(1, a * 1.4) * 0.85;
        ctx.save(); ctx.translate(x + wob, y);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, sz, Math.PI, 0);
        for(let i = 0; i <= 4; i++) ctx.lineTo(sz - i * sz / 2, sz * 0.9 + (i % 2 ? -3 : 2));
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = p.color; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.strokeStyle = '#3a2a5a'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
        for(const s of [-1, 1]){ const ex = s * 4, ey = -2; ctx.beginPath(); ctx.moveTo(ex - 2, ey - 2); ctx.lineTo(ex + 2, ey + 2); ctx.moveTo(ex + 2, ey - 2); ctx.lineTo(ex - 2, ey + 2); ctx.stroke(); }
        ctx.restore(); break;
      }
      case 'splat':
        ctx.globalAlpha = a; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(x, y - 1.5, p.size * (1 + (1 - a) * 0.25), 3, 0, 0, TAU); ctx.fill(); break;
      default:
        ctx.globalAlpha = a; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(x, y, p.size * (0.35 + 0.65 * a), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawPopups(){
  for(const p of popups){
    const k = p.t / 50;
    const s = p.t < 8 ? easeOutBack(p.t / 8) : 1;
    const a = p.t > 35 ? 1 - (p.t - 35) / 15 : 1;
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = `700 11.5px ${FU}`;
    const half = ctx.measureText(p.text).width / 2 + 6;
    ctx.translate(clamp(p.x, viewX + half, viewX + W - half), p.y - easeOutCubic(Math.min(1, k * 1.6)) * 16);
    ctx.scale(s, s);
    outlined(p.text, 0, 0, 11.5, p.color, '#1d1442', 3, FU, 700, 'center');
    ctx.restore();
  }
}

function drawHotFloor(hf){
  const y = hf.y, w = hf.x1 - hf.x0, pulse = 0.55 + 0.25 * Math.sin(frame * 0.12);
  const g = ctx.createLinearGradient(0, y - 18, 0, y + 6);
  g.addColorStop(0, 'rgba(255,90,40,0)'); g.addColorStop(1, `rgba(255,120,40,${pulse})`);
  ctx.fillStyle = g; ctx.fillRect(hf.x0, y - 18, w, 24);
  ctx.fillStyle = `rgba(255,200,90,${pulse})`; ctx.fillRect(hf.x0, y, w, 3);
  if(fxTick && frame % 4 === 0) particles.push({x:hf.x0 + Math.random() * w, y:y - 2, vx:(Math.random() - 0.5) * 0.4, vy:-0.7 - Math.random(), life:28, max:28, color:Math.random() < 0.5 ? '#ffb347' : '#ff6a3c', grav:-0.01, size:2.4, type:'dot'});
}

function drawWorld(){
  for(const p of platforms) if(p.move) drawRail(p);
  for(const s of signs) drawSign(s);
  for(const c of checkpoints) drawCheckpoint(c);
  if(door) drawDoor();
  for(const p of platforms) drawPlatform(p);
  for(const s of springs) drawSpring(s);
  for(const s of spikes) drawSpikes(s);
  for(const f of fires) drawFire(f);
  if(room.hotFloor && boss && boss.alive) drawHotFloor(room.hotFloor);
  for(const n of npcs) drawNpc(n, n.x + 13, n.y, 1, !!(talk && talk.npc === n && talk.chars < talk.data.lines[talk.line].length), state === 'title' || player.x + player.w / 2 >= n.x + 13 ? 1 : -1);
  for(const c of coins) if(!c.got) drawCoin(c);
  for(const p of powerUps) if(!p.got) drawPowerUp(p);
  for(const o of flips) drawFlip(o);
  if(key && !key.got) drawKey(key);
  for(const t of turrets) if(t.alive) drawTurret(t);
  for(const e of enemies) if(e.alive) drawEnemy(e);
  for(const b of bats) if(b.alive) drawBat(b);
  drawBoss();
  for(const s of shots) drawShot(s);
  for(const b of bullets) drawBullet(b);
  drawPlayer();
  drawSteal();
  if(room.lava) drawRisingLava();
  if(barrierOn()) drawBarrier();
  drawParticles();
  drawPopups();
  if(state === 'play'){ for(const s of signs) drawSignBubble(s); for(const n of npcs) drawNpcPrompt(n); }
  drawIdleBubble();
}

function wrapLines(text, maxW){
  const words = text.split(' '), lines = [];
  let cur = '';
  for(const w of words){
    const test = cur ? cur + ' ' + w : w;
    if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = w; }
    else cur = test;
  }
  if(cur) lines.push(cur);
  return lines;
}

function drawTalk(){
  if(state !== 'talk' || !talk) return;
  const D = talk.data, n = talk.npc, full = D.lines[talk.line];
  const inP = easeOutCubic(clamp(stateT / 12, 0, 1));
  const top = n.y - viewY > H * 0.45;          // keep the speakers visible
  const bx = 20, bw = W - 40, bh = 122;
  const by = top ? 42 - (1 - inP) * 18 : H - 12 - bh + (1 - inP) * 18;
  ctx.save();
  ctx.globalAlpha = inP;
  rr(bx, by, bw, bh, 16); ctx.fillStyle = 'rgba(14,9,34,0.94)'; ctx.fill();
  ctx.strokeStyle = rgba(D.accent, 0.7); ctx.lineWidth = 1.5; ctx.stroke();
  // portrait
  const pcx = bx + 56, pcy = by + 60;
  ctx.save();
  ctx.beginPath(); ctx.arc(pcx, pcy, 40, 0, TAU);
  ctx.fillStyle = rgba(D.accent, 0.12); ctx.fill();
  ctx.clip();
  drawNpc(n, pcx, pcy + 41, 1.8, talk.chars < full.length, 1);
  ctx.restore();
  ctx.beginPath(); ctx.arc(pcx, pcy, 40, 0, TAU); ctx.strokeStyle = rgba(D.accent, 0.45); ctx.lineWidth = 1.2; ctx.stroke();
  // name and the recipe step this person teaches
  const tx = bx + 112;
  heading(D.name, tx, by + 29, 18, '#ffffff', 'left', false);
  ctx.font = `400 18px ${FD}`;
  const nameW = ctx.measureText(D.name).width;
  const chip = D.step == null ? `Saison 2 : ${D.title}` : `Recette, étape ${D.step + 1} sur 4 : ${D.title}`;
  ctx.font = `600 11px ${FU}`;
  const cw = ctx.measureText(chip).width + 18;
  rr(tx + nameW + 12, by + 14, cw, 19, 9.5); ctx.fillStyle = rgba(D.accent, 0.16); ctx.fill();
  txt(chip, tx + nameW + 21, by + 27.5, 11, D.accent, 600, 'left');
  // the line being said, typed out letter by letter
  ctx.font = `500 14.5px ${FU}`;
  const lines = wrapLines(full, bx + bw - 22 - tx);
  let shown = Math.floor(talk.chars);
  lines.forEach((ln, i) => {
    const part = ln.slice(0, Math.max(0, shown));
    shown -= ln.length + 1;
    if(part) txt(part, tx, by + 54 + i * 17, 14.5, '#efeaff', 500, 'left');
  });
  // progress, and what to press next
  const fy = by + bh - 12;
  for(let i = 0; i < D.lines.length; i++){
    ctx.fillStyle = i <= talk.line ? D.accent : 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.arc(tx + 3 + i * 11, fy - 4, 2.8, 0, TAU); ctx.fill();
  }
  if(talk.chars >= full.length){
    const last = talk.line === D.lines.length - 1;
    const keyLabel = TOUCH ? '▲' : 'Espace', label = last ? 'fermer' : 'suite';
    ctx.font = `500 12px ${FU}`;
    const lw = ctx.measureText(label).width;
    ctx.font = `700 11px ${FU}`;
    const kw = Math.max(19, ctx.measureText(keyLabel).width + 13);
    const hx = bx + bw - 16 - lw - 6 - kw, bob = REDUCED ? 0 : Math.sin(frame * 0.15) * 1.2;
    keycap(keyLabel, hx, fy + bob);
    txt(label, hx + kw + 6, fy - 0.5 + bob, 12, '#bfb6f0', 500, 'left');
  }
  ctx.restore();
}

// letterbox bars, the boss's name card, and "Combat !" when it starts
function drawCine(){
  if(!cine){
    if(fightPop > 0 && state === 'play'){
      const t = 60 - fightPop;
      const s = easeOutBack(clamp(t / 12, 0, 1)), a = clamp(fightPop / 15, 0, 1);
      ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 176); ctx.scale(s, s);
      heading('Combat !', 0, 0, 40, '#ffe58a');
      ctx.restore();
    }
    return;
  }
  const c = cine, k = cineBars(), bar = 22 * k;
  ctx.fillStyle = '#07040f';
  ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
  const a = clamp((c.t - 40) / 20, 0, 1) * clamp((c.dur - 20 - c.t) / 20, 0, 1);
  if(a > 0 && boss){
    const cy = c.bandY;
    ctx.save();
    ctx.globalAlpha = a;
    const band = ctx.createLinearGradient(0, 0, W, 0);
    band.addColorStop(0, 'rgba(10,6,26,0)'); band.addColorStop(0.2, 'rgba(10,6,26,0.66)'); band.addColorStop(0.8, 'rgba(10,6,26,0.66)'); band.addColorStop(1, 'rgba(10,6,26,0)');
    ctx.fillStyle = band; ctx.fillRect(0, cy - 40, W, 80);
    const rise = easeOutCubic(clamp((c.t - 40) / 26, 0, 1));
    if(c.kind === 'intro'){
      txt(room.label || 'Combat de boss', W / 2, cy - 18, 12.5, '#ff8aa0', 600);
      heading(boss.name, W / 2, cy + 14 + (1 - rise) * 8, 34, '#ffffff');
      txt(BOSS_EPITHET[boss.mode] || '', W / 2, cy + 32, 13, '#e9e2ff', 500);
    } else {
      txt(c.kind === 'phase3' ? 'Phase 3 — dernière phase' : 'Phase 2', W / 2, cy - 18, 12.5, '#ff8aa0', 600);
      heading(c.kind === 'phase3' ? `${boss.name} est hors d’elle !` : `${boss.name} est ${boss.fem ? 'furieuse' : 'furieux'} !`, W / 2, cy + 12 + (1 - rise) * 8, 28, '#ffffff');
      if(c.kind === 'phase3') txt('Elle enchaîne les plongeons : saute-lui dessus ou dash quand elle est coincée !', W / 2, cy + 31, 12, '#ffd27a', 500);
      else if(boss.mode === 'magpie') txt('Armure de babioles : seul un dash peut la toucher !', W / 2, cy + 31, 13, '#ffd27a', 500);
      else if(room.phase2Spikes) txt('Attention : des pics vont sortir du sol', W / 2, cy + 31, 13, '#ffd27a', 500);
    }
    ctx.restore();
  }
  if(c.skippable && !c.skip && c.t > 20 && k > 0.9){
    ctx.save();
    ctx.font = `700 11px ${FU}`;
    const keyLabel = TOUCH ? '▲' : 'Espace';
    const kw = Math.max(19, ctx.measureText(keyLabel).width + 13);
    keycap(keyLabel, W - 70 - kw, H - 6);
    txt('passer', W - 62, H - 6.5, 12, '#bfb6f0', 500, 'left');
    ctx.restore();
  }
}

// a line from a pool, never the same one twice in a row
function line(key){
  const L = PET_LINES[key];
  if(L.length < 2) return L[0];
  let s;
  do s = pick(L); while(s === pet.lastLine[key]);
  pet.lastLine[key] = s;
  return s;
}
function petNight(){ const hr = new Date().getHours(); return hr >= 20 || hr < 7; }

// what he says when you come in: depends on the time, your visits and your progress
function petGreeting(){
  const P = save.pet = Object.assign({visits:0, last:0, meals:0}, save.pet || {});
  const now = Date.now(), away = P.last ? now - P.last : 0, hr = new Date().getHours();
  P.visits++; P.last = now; persist();
  const n = P.visits;
  if(n === 1) return ['Coucou ! Bienvenue dans mon petit coin de boulangerie.', 'Tu peux me nourrir, me chatouiller… ou même m\'appeler !'];
  if([5, 10, 25, 50, 100].includes(n)) return [`C'est ta ${n}e visite ! Tu m'aimes bien, hein ?`, 'Moi aussi, je t\'aime bien.'];
  if(pet.full >= 5) return [line('stuffed')];
  if(away > 0 && away < 90e3) return [pick(['Déjà de retour ?', 'Tu as oublié quelque chose ?', 'Rebonjour !', 'Re-coucou !'])];
  if(away > 3 * 864e5) return ['Ça faisait longtemps ! Tu m\'as manqué.', 'J\'ai un de ces creux…'];
  const pool = [];
  if(hr < 5) pool.push('Il est tard… Tu ne dors pas, toi non plus ?', 'Chut… tout le monde dort à la boulangerie.');
  else if(hr < 11) pool.push('Bonjour ! Le pain sort tout juste du four.', 'Bonjour ! Tu as pris ton petit-déjeuner ?');
  else if(hr < 14) pool.push('C\'est l\'heure du déjeuner ! J\'ai faim.', 'Midi ! On mange quoi ?');
  else if(hr < 18) pool.push('C\'est l\'heure du goûter, non ?', 'Un petit croissant pour le goûter ?');
  else if(hr < 22) pool.push('Bonsoir ! Une petite faim avant le dîner ?', 'Bonsoir ! La boulangerie va bientôt fermer.');
  else pool.push('Bonsoir… Un dernier en-cas avant de dormir ?', 'Il se fait tard, hein ?');
  if(save.goldFicelle) pool.push('Tu as vu ma ficelle dorée ? Je ne la mangerai jamais… enfin, peut-être.');
  if(save.crystalFicelle) pool.push('Ma ficelle de cristal brille même dans le noir. Pratique pour les goûters de minuit !');
  else if(save.bestCh[3] != null) pool.push('Grâce à toi, j\'ai retrouvé la ficelle aux olives !', 'Le Seigneur Pourpre ? Plus de nouvelles depuis !');
  else pool.push('On repart bientôt chercher la ficelle aux olives ?');
  const learned = save.recipe.filter(Boolean).length;
  if(learned === 4) pool.push('Je connais toute la recette de la ficelle par cœur !');
  else if(learned > 0) pool.push(`Je connais déjà ${learned} étape${learned > 1 ? 's' : ''} de la recette sur 4.`);
  pool.push('Coucou ! Tu as quelque chose à manger ?', 'Te revoilà !', 'Ah, c\'est toi ! Super.');
  const first = pick(pool);
  if(/manger|faim|goûter|en-cas|mange/.test(first)) return [first];
  return [first, pick(['Tu as quelque chose à manger ?', 'Tu m\'as apporté un truc à grignoter ?', 'On mange quoi ?'])];
}

function openPet(){
  setState('pet');
  pet.flight = null; pet.eating = null; pet.after = []; pet.parts = []; pet.taps = []; pet.phone = null; pet.ev = null;
  pet.hy = 0; pet.hvy = 0; pet.dance = 0; pet.turn = 0; pet.crossT = 0; pet.idleT = 0; pet.hint = 1; pet.spicy = 0;
  pet.quiet = 0; pet.nextEv = 420 + Math.random() * 240; pet.leaving = 0; pet.lookAt = null; pet.lean = 0;
  pet.dark = false; pet.darkT = 0; pet.darkK = 0; pet.green = 0; pet.lidT = 0; pet.tickN = 0; pet.patN = 0;
  pet.hero.appear = 0; pet.hero.lid = 0;
  const [first, ...more] = petGreeting();
  petSay(first, 150);
  let t = 150;
  for(const ln of more){
    pet.after.push({t, greet:true, run(){ if(!pet.ev && !pet.flight && !pet.eating && !pet.phone) petSay(ln, 130); }});
    t += 130;
  }
  SFX.bloop();
}
function closePet(){
  if(fadeDir !== 0 || pet.leaving) return;
  const asleep = pet.ev && pet.ev.type === 'sleep';
  if(pet.phone){ pet.phone = null; if(pet.ev && pet.ev.type === 'call') pet.ev = null; }
  pet.flight = null; pet.after = [];
  petSay(asleep ? line('byeSleep') : line('bye'), 200);
  if(!asleep) setFace(pet.hero, 'smile', 60);
  pet.leaving = 30;
}

function petSay(text, t=110){ pet.bubble = {text:frTypo(text), t, max:t}; pet.idleT = 0; }
function petMouth(){ return {x:PET.x + 2 * PET.s * pet.hero.fx, y:PET.y + pet.hy + (HB.cy + 3.5) * PET.s}; }
function trayX(i){ const total = FOODS.length * TRAY.w + (FOODS.length - 1) * TRAY.gap; return (W - total) / 2 + i * (TRAY.w + TRAY.gap); }
function petBusy(){ return !!(pet.flight || pet.eating || (pet.phone && pet.phone.stage !== 'listen')); }
function onPhone(){ const ph = pet.phone; return !!ph && (ph.stage === 'ring' ? ph.t >= 24 : ph.stage !== 'incoming'); }
function petHop(v){ if(pet.hy >= 0){ pet.hvy = -v; } }
function petPart(o){ const p = Object.assign({x:0, y:0, vx:0, vy:0, g:0.15, life:40, max:40, rot:0, vr:0, s:1}, o); pet.parts.push(p); return p; }
function onCall(){ return !!pet.phone && pet.phone.stage === 'call'; }

function petSelect(d){ pet.sel = (pet.sel + d + FOODS.length) % FOODS.length; SFX.menu(); }

// any real interaction: wakes him up, stops small idle shows, resets his boredom
const PET_SHORT = ['song', 'muse', 'stretch', 'lonely', 'growl', 'chat'];
function petInteract(){
  pet.hint = 0; pet.quiet = 0; pet.nextEv = 360 + Math.random() * 300;
  pet.after = pet.after.filter(a => !a.greet);
  const ev = pet.ev;
  if(!ev) return false;
  if(ev.type === 'sleep'){ petWake(); return true; }
  if(ev.type === 'juggle'){ juggleDrop(false); return true; }
  if(PET_SHORT.includes(ev.type)) pet.ev = null;
  return false;
}
function petWake(text){
  const h = pet.hero;
  pet.ev = null; pet.darkT = 0;
  setFace(h, 'o', 40); petHop(6); h.wobV += 1.2;
  for(const e of h.eyes){ e.vx += (Math.random() - 0.5) * 1.2; e.vy -= 0.8; }
  petSay(text || line('wake'), 110);
  tone(300, 0.12, 'triangle', 0.05, 900);
}

function petGive(i){
  if(pet.leaving) return;
  pet.sel = i;
  const f = FOODS[i];
  if(petInteract()) return;
  if(f.phone){ petPhone(); return; }
  if(pet.phone && pet.phone.stage === 'incoming'){ petSay(line('callFirst'), 60); return; }
  if(onCall()){ petSay(line('callBusy'), 60); return; }
  if(petBusy()) return;
  if(pet.phone){ pet.phone = null; petSay(line('phoneFood'), 70); tone(900, 0.05, 'square', 0.03); }
  const m = petMouth();
  let refuse = f.fill > 0 && pet.full >= 5;
  if(f.id === 'brocoli'){
    if(pet.broc >= 2){ pet.broc = 0; petSay(line('brocoliYes'), 70); }   // third time: fine, one bite
    else { refuse = true; pet.broc++; }
  }
  pet.flight = {f, t:0, x0:trayX(i) + TRAY.w / 2, y0:TRAY.y + 20, x1:m.x, y1:m.y, refuse};
  SFX.menu();
}

// the phone: press it and he picks up, then every press is a question he answers.
// Sometimes it rings by itself: press it to let him answer.
function petPhone(){
  const ph = pet.phone;
  if(!ph){
    if(pet.flight || pet.eating) return;
    pet.phone = {stage:'ring', t:0, ans:null};
    return;
  }
  if(ph.stage === 'incoming'){ ph.stage = 'call'; ph.t = 0; ph.next = 999; return; }
  if(ph.stage === 'call'){
    pet.phone = null; if(pet.ev && pet.ev.type === 'call') pet.ev = null;
    petSay(line('callHang'), 90); tone(900, 0.05, 'square', 0.03);
    return;
  }
  if(ph.stage !== 'listen') return;
  let A;
  if(Math.random() < 0.1) A = pick(PHONE_RARE);
  else {
    let k = Math.floor(Math.random() * PHONE_ANSWERS.length);
    if(k === pet.lastAns) k = (k + 1 + Math.floor(Math.random() * (PHONE_ANSWERS.length - 1))) % PHONE_ANSWERS.length;
    pet.lastAns = k; A = PHONE_ANSWERS[k];
  }
  ph.stage = 'think'; ph.t = 0; ph.ans = A;
  petSay('Hmmm…', 40);
  tone(140, 0.3, 'triangle', 0.04, 150);
}
function pickCall(){
  const pool = PET_CALLS.filter(c => (!c.needs || save.bestCh[3] != null) && c.id !== pet.lastCall);
  const c = pick(pool);
  pet.lastCall = c.id;
  return c;
}
function updatePhone(){
  const ph = pet.phone, h = pet.hero;
  if(!ph) return;
  ph.t++;
  if(ph.stage === 'ring'){
    if(ph.t === 1 || ph.t === 13) [1320, 1480].forEach((q, k) => tone(q, 0.05, 'square', 0.025, null, k * 0.05));
    if(ph.t === 24){ setFace(h, 'o', 20); h.wobV += 0.4; tone(220, 0.1, 'triangle', 0.05, 300); }
    if(ph.t === 34){ ph.stage = 'listen'; ph.t = 0; petSay('Allô ? Pose-moi une question.', 130); }
  } else if(ph.stage === 'incoming'){
    const r = ph.t % 45;
    if(r === 1 || r === 13) [1320, 1480].forEach((q, k) => tone(q, 0.06, 'square', 0.03, null, k * 0.05));
    if(ph.t > 330){
      pet.phone = null; if(pet.ev && pet.ev.type === 'call') pet.ev = null;
      petSay(line('callMissed'), 110); setFace(h, 'sad', 60);
    }
  } else if(ph.stage === 'call'){
    if(ph.t === 1){ setFace(h, 'o', 20); h.wobV += 0.4; tone(220, 0.1, 'triangle', 0.05, 300); ph.next = 22; ph.i = 0; }
    if(--ph.next <= 0){
      const L = ph.call.lines[ph.i++];
      if(L === undefined){
        pet.phone = null; if(pet.ev && pet.ev.type === 'call') pet.ev = null;
        tone(900, 0.05, 'square', 0.03); tone(700, 0.05, 'square', 0.03, null, 0.08);
        return;
      }
      if(L === '…'){
        ph.next = 75; petSay('…', 70);
        const v = ph.call.voice;
        for(let k = 0; k < 5; k++){
          if(v) tone(v * (0.85 + Math.random() * 0.35), 0.06, 'square', 0.016, null, 0.1 + k * 0.11);
          else tone(150 + Math.random() * 80, 0.05, 'square', 0.02, null, 0.1 + k * 0.14);   // chewing noises…
        }
      } else {
        ph.next = 64 + L.length * 2.2;
        petSay(L, ph.next - 4);
        setFace(h, /!/.test(L) ? 'open' : 'smile', 30); h.wobV += 0.3;
        tone(h.curFace === 'open' ? 240 : 190, 0.18, 'sawtooth', 0.03, 230);
      }
    }
    if(ph.call.lines[ph.i - 1] === '…' && ph.t % 24 === 0) h.wobV += 0.25;   // nodding along
  } else if(ph.stage === 'listen'){
    if(ph.t > 720){ pet.phone = null; petSay('Bon… je raccroche.', 90); tone(900, 0.05, 'square', 0.03); }
  } else if(ph.stage === 'think'){
    if(ph.t >= 40){
      const A = ph.ans;
      ph.stage = 'answer'; ph.t = 0;
      petSay(A.text, 80); setFace(h, A.face, 75);
      if(A.laugh){
        [196, 175, 147].forEach((q, k) => tone(q, 0.17, 'sawtooth', 0.045, q * 0.92, k * 0.19));
        h.wobV += 0.9; petHop(4);
      } else {
        tone(A.voice[0], A.voice[1], 'sawtooth', 0.045, A.voice[2]);
        if(A.face === 'hurt'){ h.wobV -= 0.6; pet.shake = 10; }
        else h.wobV += 0.35;
      }
    }
  } else if(ph.stage === 'answer'){
    if(ph.t >= 80){ ph.stage = 'listen'; ph.t = 0; }
  }
}

function petTouch(part){
  if(pet.leaving) return;
  const h = pet.hero;
  const hic = pet.ev && pet.ev.type === 'hiccup';
  if(petInteract()) return;
  if(onCall()){ petSay(line('callBusy'), 60); h.wobV += 0.4; return; }
  if(pet.crossT > 0){ if(!pet.bubble || pet.bubble.max - pet.bubble.t > 40) petSay(line('sulk'), 50); return; }
  pet.taps.push(frame);
  pet.taps = pet.taps.filter(t => frame - t < 150);
  if(pet.taps.length >= 7){
    pet.taps = []; pet.tickN = 0; pet.patN = 0;
    pet.crossT = 110; setFace(h, 'hurt', 70);
    petSay(line('annoyed'), 100);
    tone(200, 0.2, 'sawtooth', 0.04, 120);
    return;
  }
  // a fright cures the hiccups
  if(hic && (part === 'eye' || part === 'boop')){
    pet.ev = null; setFace(h, 'o', 40); petHop(6); h.wobV += 1.2;
    petSay(line('hicScare'), 120);
    tone(1200, 0.08, 'square', 0.04, 500);
    return;
  }
  const again = pet.lastTouch === part && frame - pet.lastTouchF < 150;
  pet.lastTouch = part; pet.lastTouchF = frame;
  if(part === 'eye'){
    for(const e of h.eyes){ e.vx += (Math.random() - 0.5) * 1.6; e.vy += (Math.random() - 0.5) * 1.6; }

// where the pointer landed
function petPointer(x, y){
  if(pet.leaving) return;
  const bk = pet.back || {x:W - 136, w:120};
  if(x >= bk.x - 4 && x <= bk.x + bk.w + 4 && y >= 8 && y <= 44){ closePet(); return; }
  for(let i = 0; i < FOODS.length; i++){
    const tx = trayX(i);
    if(x >= tx && x <= tx + TRAY.w && y >= TRAY.y && y <= TRAY.y + TRAY.h){ petGive(i); return; }
  }
  const ev = pet.ev;
  if(ev && ev.type === 'fly' && (ev.stage === 'buzz' || ev.stage === 'catch') && Math.hypot(x - ev.x, y - ev.y) < 24){ flySnap(); return; }
  if(ev && ev.type === 'bird' && ev.stage !== 'out' && Math.hypot(x - ev.x, y - (ev.y - 8)) < 24){ birdShoo(); return; }
  const lx = (x - PET.x) / PET.s * (pet.hero.fx >= 0 ? 1 : -1), ly = (y - PET.y - pet.hy) / PET.s;
  const inE = (cx, cy, rx, ry) => ((lx - cx) / rx) ** 2 + ((ly - cy) / ry) ** 2 <= 1.3;
  let part = null;
  if(inE(-3.6, -24.3, 4.2, 5.9) || inE(4, -24.9, 4.1, 6.3)) part = 'eye';
  else if(ly < -26 && ly > -36 && Math.abs(lx) < 15) part = 'pat';
  else if(Math.abs(lx) <= 15 && ly >= -26 && ly < -17.5) part = 'boop';
  else if(Math.abs(lx) <= 15 && ly >= -17.5 && ly < -11) part = 'belly';
  else if(Math.abs(lx) < 30 && ly >= -30 && ly <= 1) part = 'limb';
  if(part){ petTouch(part); return; }
  if(Math.abs(x - 300) < 24 && y < 58){ petLamp(); return; }
  if(x >= PET_WIN.x - 8 && x <= PET_WIN.x + PET_WIN.w + 8 && y >= PET_WIN.y - 8 && y <= PET_WIN.y + PET_WIN.h + 14){ petWindow(); return; }
  if(x >= 30 && x <= 208 && y >= 94 && y <= 148){ petShelf(); }
}

function petReact(f){
  const h = pet.hero, P = save.pet;
  const prev = pet.hist[pet.hist.length - 1];
  pet.hist.push(f.id); if(pet.hist.length > 5) pet.hist.shift();

  pet.eats.push(frame); pet.eats = pet.eats.filter(t => frame - t < 420);
  let quiet = false;     // the reaction already says enough: no follow-up line
  if(f.id === 'ficelle'){
    pet.dance = 130; setFace(h, 'open', 120);
    petSay(line('ficelle'), 130);
    [784, 988, 1175, 1568, 1175, 1568].forEach((q, k) => tone(q, 0.12, 'triangle', 0.05, null, k * 0.09));

  } else if(f.id === 'pain'){
    setFace(h, 'smile', 60); petHop(4);
    petSay(line('pain'), 110);
    [659, 784, 988].forEach((q, k) => tone(q, 0.1, 'triangle', 0.045, null, k * 0.08));
  } else if(f.id === 'croissant'){
    setFace(h, 'open', 60); petHop(6); h.spin = 0.001;
    petSay(line('croissant'), 110);
    [784, 1047, 1319].forEach((q, k) => tone(q, 0.1, 'triangle', 0.045, null, k * 0.07));
    for(let k = 0; k < 6; k++) petPart({type:'star', x:PET.x + (Math.random() - 0.5) * 90, y:PET.y - 70 - Math.random() * 50, vx:0, vy:-0.4, g:0, life:40, max:40, rot:Math.random() * 6, vr:0.1, s:1});
  } else if(f.id === 'olive'){
    setFace(h, 'o', 18);
    pet.after.push({t:14, run(){
      const mm = petMouth();
      petPart({type:'pit', x:mm.x, y:mm.y, vx:4.2 * (h.fx >= 0 ? 1 : -1), vy:-4, g:0.35, life:150, max:150, rot:0, vr:0.3, bounce:true});
      tone(520, 0.08, 'square', 0.04, 180);
      setFace(h, 'open', 30);
      petSay(line('olive'), 100);
    }});
  } else if(f.id === 'piment'){
    // a second one while it still burns: dragon mode
    const dbl = pet.spicy > 0 || prev === 'piment';
    pet.spicy = dbl ? 340 : 260; pet.hot2 = dbl;
    setFace(h, 'open', 200);
    petSay(dbl ? line('spicy2') : line('spicy'), 110);
    tone(300, 0.6, 'sawtooth', 0.05, 1200);
    if(dbl){ pet.shake = 30; tone(150, 0.8, 'sawtooth', 0.05, 600, 0.2); }
    quiet = true;
  } else if(f.id === 'eau'){
    if(pet.spicy > 0){
      pet.spicy = 0; pet.hot2 = false;
      for(let k = 0; k < 10; k++) petPart({type:'steam', x:PET.x + (Math.random() - 0.5) * 70, y:PET.y - 120, vx:(Math.random() - 0.5) * 0.8, vy:-1.2 - Math.random(), g:-0.01, life:50, max:50, s:1 + Math.random()});
      setFace(h, 'smile', 80);
      petSay(line('waterSpicy'), 120);
      quiet = true;
    } else if(pet.ev && pet.ev.type === 'hiccup'){
      pet.ev = null; setFace(h, 'smile', 80);
      petSay(line('hicCure'), 120);
      quiet = true;
    } else if(streak3){
      // sloshing
      setFace(h, 'o', 40); h.wobV += 1.4; pet.shake = 20;
      petSay(pick(PET_AGAIN.eau), 120);
      for(let k = 0; k < 4; k++) tone(300 + k * 90, 0.08, 'sine', 0.04, 500, k * 0.12);
      quiet = true;
    } else {
      setFace(h, 'smile', 50);
      petSay(line('water'), 100);
    }
  } else if(f.id === 'brocoli'){
    // eaten at last… and he turns green
    pet.green = 260; setFace(h, 'hurt', 130); pet.shake = 30; h.wobV -= 0.8;
    petSay(line('brocoliEat'), 130);
    tone(160, 0.5, 'sawtooth', 0.04, 70);
    quiet = true;

  // a follow-up remark: same food again, a menu combo, a milestone, a full belly
  let follow = null;

    else if(wasFull < 5 && pet.full >= 5) follow = line('fullNow');

      pet.after.push({t:70, run(){ setFace(h, 'smile', 40); petSay(line('burpSorry'), 80); }});
    }});
  }
}

// ---------------------------------------------------------------- little events when you leave him alone
function petIdleEvent(){
  pet.nextEv = 360 + Math.random() * 320;
  pet.quiet++;
  if(pet.lastEv !== 'sleep' && (pet.quiet >= 5 || (pet.full >= 4.5 && Math.random() < 0.35) || (petNight() && pet.quiet >= 3 && Math.random() < 0.25))){ startEv('sleep'); return; }
  const opts = [['chat', 3], ['muse', 2], ['song', 1.2], ['stretch', 0.8], ['sneeze', 1], ['hiccup', 0.7], ['fly', 1.2], ['call', 1.1], ['bird', 1.2]];
  if(pet.full < 1.5) opts.push(['growl', 2.2]);
  if(pet.full >= 1.5 && pet.full < 4.5) opts.push(['juggle', 1.4]);
  if(pet.quiet >= 3) opts.push(['lonely', 2.5]);
  const pool = opts.filter(o => o[0] !== pet.lastEv || o[0] === 'chat');
  let r = Math.random() * pool.reduce((s, o) => s + o[1], 0);
  for(const [type, w] of pool){ if((r -= w) <= 0){ startEv(type); return; } }
  startEv('chat');
}
function startEv(type, text){
  const h = pet.hero;
  pet.lastEv = type;
  const ev = pet.ev = {type, t:0, dur:120};
  if(type === 'sleep'){
    ev.dur = 1300 + Math.random() * 700;
    petSay(text || line('sleepy'), 100); setFace(h, 'o', 50);
    tone(330, 0.7, 'sine', 0.03, 200);
  } else if(type === 'hiccup'){
    ev.n = 5 + Math.floor(Math.random() * 4); ev.next = 8; ev.first = true; ev.dur = 1e9;
  } else if(type === 'sneeze'){
    ev.dur = 150; petSay('Ah… ah…', 80);
  } else if(type === 'fly'){
    ev.stage = 'buzz'; ev.x = PET_WIN.x + 30; ev.y = PET_WIN.y + 40; ev.vx = -2.5; ev.vy = 0.5;
    ev.tx = PET.x; ev.ty = PET.y - 120; ev.dur = 460 + Math.random() * 120;
  } else if(type === 'call'){
    ev.dur = 1e9;
    pet.phone = {stage:'incoming', t:0, call:pickCall(), i:0, next:999};
    petSay(line('call'), 90); setFace(h, 'o', 30);
  } else if(type === 'juggle'){
    ev.dur = 250; ev.fail = Math.random() < 0.35;
    petSay(line('juggle'), 100);
  } else if(type === 'bird'){
    ev.stage = 'in'; ev.x = W + 20; ev.y = 26;
    ev.sx = PET_WIN.x + 40 + Math.random() * 70; ev.sy = PET_WIN.y + PET_WIN.h + 6; ev.dur = 520;
  } else if(type === 'song'){
    ev.dur = 170; petSay(line('song'), 150);
  } else if(type === 'stretch'){
    ev.dur = 100; petSay(line('stretch'), 90); tone(200, 0.5, 'sine', 0.03, 320);
  } else if(type === 'muse'){
    ev.dur = 170; petSay(line('muse'), 165);
  } else if(type === 'growl'){
    ev.dur = 70; pet.shake = 26; setFace(h, 'o', 40); h.wobV += 0.8;
    petSay(line('growl'), 110);
    tone(70, 0.45, 'sawtooth', 0.05, 55); tone(90, 0.4, 'sawtooth', 0.04, 60, 0.4);
  } else if(type === 'lonely'){
    ev.dur = 110; petSay(line('lonely'), 100);
  } else {
    ev.dur = 1;
    petSay(pet.full >= 5 ? line('stuffed') : pet.full < 2 ? line('hungry') : Math.random() < 0.35 ? line('tips') : line('happy'), 120);
  }
}

function updatePetEv(){
  const ev = pet.ev, h = pet.hero;
  if(!ev) return;
  ev.t++;
  const end = () => { if(pet.ev === ev) pet.ev = null; };
  if(ev.type === 'sleep'){
    if(ev.t > 80 && ev.t % 85 === 0){
      petPart({type:'z', x:PET.x + 28, y:PET.y + pet.hy - 112, vx:0.45, vy:-0.55, g:0, life:95, max:95, s:0.8 + Math.random() * 0.5});
      tone(105, 0.7, 'triangle', 0.025, 80); setFace(h, 'o', 30);
    }
    if(ev.t >= ev.dur){ end(); pet.darkT = 0; pet.quiet = 0; pet.nextEv = 600 + Math.random() * 300; petSay(line('wakeSelf'), 120); setFace(h, 'open', 40); petHop(4); tone(400, 0.2, 'sine', 0.04, 800); }
  } else if(ev.type === 'hiccup'){
    if(--ev.next <= 0){
      petHop(3.5); h.wobV += 0.9; setFace(h, 'o', 14);
      petSay(ev.first ? line('hicStart') : 'Hic !', ev.first ? 90 : 36);
      ev.first = false;
      tone(620 + Math.random() * 120, 0.07, 'square', 0.04, 1100);
      ev.next = 55 + Math.random() * 55;
      if(--ev.n <= 0){ end(); pet.after.push({t:60, run(){ if(!pet.ev && !onCall()) petSay(line('hicEnd'), 100); }}); }
    }
  } else if(ev.type === 'sneeze'){
    if(ev.t < 72) pet.lean = -0.14 * ev.t / 72;
    if(ev.t === 40){ petSay('Aaah…', 40); tone(500, 0.3, 'sine', 0.02, 700); }
    if(ev.t === 72){
      pet.lean = 0.3; petSay('ATCHOUM !', 60); setFace(h, 'open', 30); petHop(5); h.wobV -= 1.6; pet.shake = 12;
      const m = petMouth(), d = h.fx >= 0 ? 1 : -1;
      for(let k = 0; k < 18; k++) petPart({type:'flour', x:m.x, y:m.y, vx:d * (1.5 + Math.random() * 3.5), vy:(Math.random() - 0.6) * 2.2, g:-0.005, life:50 + Math.random() * 30, max:80, s:0.7 + Math.random() * 0.8});
      tone(900, 0.25, 'sawtooth', 0.05, 120);
    }
    if(ev.t === 150){ petSay(line('sneeze'), 110); setFace(h, 'smile', 40); end(); }
  } else if(ev.type === 'fly'){
    if(ev.stage === 'buzz' || ev.stage === 'catch'){
      if(ev.t % 50 === 1){ ev.tx = PET.x + (Math.random() - 0.5) * 240; ev.ty = PET.y - 60 - Math.random() * 130; }
      const jit = ev.stage === 'catch' ? 1.8 : 0.9;
      ev.vx += (ev.tx - ev.x) * 0.004 + (Math.random() - 0.5) * jit; ev.vy += (ev.ty - ev.y) * 0.004 + (Math.random() - 0.5) * jit;
      ev.vx *= 0.93; ev.vy *= 0.93; ev.x += ev.vx; ev.y += ev.vy;
      ev.x = clamp(ev.x, 20, W - 20); ev.y = clamp(ev.y, 20, PET.y - 10);
      if(ev.t % 14 === 0) tone(180 + Math.random() * 40, 0.08, 'sawtooth', 0.008, 220);
      pet.look = pet.look || petLookAt(ev.x, ev.y);
    }
    if(ev.stage === 'buzz'){
      if(ev.t === 40){ petSay(line('fly'), 100); setFace(h, 'o', 30); }
      if(ev.t >= ev.dur){ ev.stage = 'catch'; ev.t = 0; ev.win = Math.random() < 0.5; petSay(line('flyCatch'), 70); }
    } else if(ev.stage === 'catch'){
      if(ev.t % 14 === 0){ petHop(4); tone(400, 0.06, 'triangle', 0.03, 700); }
      if(ev.t === 64){
        if(ev.win){ ev.stage = 'eat'; ev.t = 0; ev.x0 = ev.x; ev.y0 = ev.y; }
        else { ev.stage = 'away'; ev.t = 0; petSay(line('flyMiss'), 90); setFace(h, 'sad', 60); }
      }
    } else if(ev.stage === 'eat'){
      const m = petMouth(), k = Math.min(1, ev.t / 12);
      ev.x = lerp(ev.x0, m.x, k); ev.y = lerp(ev.y0, m.y, k);
      if(ev.t < 12) setFace(h, 'open', 4);
      if(ev.t === 12){ tone(160, 0.1, 'square', 0.05, 80); setFace(h, 'smile', 20); h.wobV += 0.6; }
      if(ev.t === 34){ petSay(line('flyEat'), 110); end(); }
    } else if(ev.stage === 'away'){
      ev.vx += (PET_WIN.x + 75 - ev.x) * 0.012; ev.vy += (PET_WIN.y + 30 - ev.y) * 0.012;
      ev.vx *= 0.9; ev.vy *= 0.9; ev.x += ev.vx; ev.y += ev.vy;
      if(ev.t % 10 === 0) tone(200, 0.06, 'sawtooth', 0.006, 260);
      if(ev.t > 70) end();
    }
  } else if(ev.type === 'call'){
    if(!pet.phone) end();
  } else if(ev.type === 'juggle'){
    if(ev.t % 21 === 0) tone(700 + (Math.floor(ev.t / 21) % 3) * 120, 0.04, 'triangle', 0.03);
    if(ev.t >= ev.dur){
      if(ev.fail) juggleDrop(true);
      else {
        end(); petSay(line('juggleOk'), 100); petHop(5); setFace(h, 'open', 60);
        [784, 988, 1175, 1568].forEach((q, k) => tone(q, 0.1, 'triangle', 0.045, null, k * 0.08));
        for(let k = 0; k < 6; k++) petPart({type:'star', x:PET.x + (Math.random() - 0.5) * 100, y:PET.y - 130 - Math.random() * 40, vx:0, vy:-0.4, g:0, life:45, max:45, rot:Math.random() * 6, vr:0.1, s:1});
      }
    }
  } else if(ev.type === 'bird'){
    if(ev.stage === 'in'){
      const d = Math.hypot(ev.sx - ev.x, ev.sy - ev.y);
      ev.x += (ev.sx - ev.x) * 0.05; ev.y += (ev.sy - ev.y) * 0.05 - Math.sin(ev.t * 0.2) * 0.4 * Math.min(1, d / 40);
      if(d < 2.5){ ev.stage = 'sit'; ev.t = 0; ev.x = ev.sx; ev.y = ev.sy; }
    } else if(ev.stage === 'sit'){
      if(ev.t === 20){ petSay(line('bird'), 110); setFace(h, 'open', 30); }
      if(ev.t % 70 === 35) [2200, 2600].forEach((q, k) => tone(q, 0.05, 'sine', 0.025, q * 1.2, k * 0.08));
      if(ev.t >= ev.dur){ ev.stage = 'out'; ev.t = 0; petSay(line('birdLeave'), 90); }
      pet.look = pet.look || petLookAt(ev.x, ev.y - 8);
    } else if(ev.stage === 'out'){
      ev.x += 3.2; ev.y -= 1.6 + Math.sin(ev.t * 0.3);
      if(ev.t > 90) end();
    }
  } else if(ev.type === 'song'){
    const notes = [523, 587, 659, 523, 659, 698, 784, 0, 784, 698, 659, 587, 523];
    if(ev.t % 12 === 1){
      const q = notes[Math.floor(ev.t / 12)];
      if(q) tone(q, 0.11, 'triangle', 0.035);
      if(q && ev.t % 24 === 1) petPart({type:'note', x:PET.x + 40 + Math.random() * 20, y:PET.y - 100, vx:0.6, vy:-1, g:0, life:50, max:50});
    }
    pet.lean = Math.sin(ev.t * 0.1) * 0.12;
    if(ev.t >= ev.dur) end();
  } else if(ev.t >= ev.dur) end();
}

function updatePet(){
  const h = pet.hero;
  pet.idleT++;
  if(pet.leaving > 0 && --pet.leaving === 0) transition(() => { setState('title'); });
  updatePhone();
  if(pet.bubble && --pet.bubble.t <= 0) pet.bubble = null;
  if(pet.dance > 0) pet.dance--;
  if(pet.crossT > 0 && --pet.crossT === 0 && !pet.ev && !pet.phone){ petSay(line('forgive'), 100); setFace(h, 'smile', 40); }
  if(pet.shake > 0) pet.shake--;
  if(pet.turn > 0) pet.turn--;
  if(pet.lidT > 0) pet.lidT--;
  if(pet.green > 0) pet.green--;
  if(pet.shelfGone > 0) pet.shelfGone--;
  pet.lampSw *= 0.985; pet.shelfWob *= 0.94; pet.lean *= 0.9;
  pet.darkK += ((pet.dark ? 1 : 0) - pet.darkK) * 0.15;
  // digestion
  if(pet.full > 0 && ++pet.fullT > 720){ pet.full = Math.max(0, pet.full - 1); pet.fullT = 0; }
  for(const a of pet.after) a.t--;
  const due = pet.after.filter(a => a.t <= 0);
  pet.after = pet.after.filter(a => a.t > 0);
  due.forEach(a => a.run());

  // the food flies in an arc towards the mouth
  const fl = pet.flight;
  pet.look = null;
  if(fl){
    fl.t++;
    const k = Math.min(1, fl.t / 30), m = petMouth();
    fl.x1 = m.x; fl.y1 = m.y;
    fl.x = lerp(fl.x0, fl.x1, k); fl.y = lerp(fl.y0, fl.y1, k) - Math.sin(k * Math.PI) * 80; fl.rot = k * 5;
    pet.look = {x:clamp((fl.x - PET.x) / 70, -1, 1), y:clamp((fl.y - (PET.y - 70)) / 70, -1, 1)};
    if(fl.refuse){
      if(fl.t === 16){ pet.turn = 70; setFace(h, 'sad', 80); tone(220, 0.25, 'triangle', 0.05, 130); }
      if(fl.t >= 30){
        pet.flight = null;
        petPart({type:'food', id:fl.f.id, x:fl.x, y:fl.y, vx:-2.5 * (h.fx >= 0 ? 1 : -1), vy:-3, g:0.32, life:120, max:120, rot:fl.rot, vr:0.2, bounce:true});
        petSay(fl.f.id === 'brocoli' ? (pet.broc >= 2 ? line('brocoli2') : line('brocoli')) : line('full'), 110);
      }
    } else {
      if(fl.t > 14) setFace(h, 'open', 4);
      if(fl.t >= 30){
        pet.flight = null;
        pet.eating = {f:fl.f, t:0, dur:fl.f.id === 'eau' ? 46 : 38};
        h.wobV += 0.5;
      }
    }
  }
  // chewing (or drinking)
  const ea = pet.eating;
  if(ea){
    ea.t++;
    setFace(h, Math.floor(ea.t / 5) % 2 ? 'o' : 'smile', 3);
    const m = petMouth();
    if(ea.f.id === 'eau'){
      if(ea.t % 8 === 0){ tone(420 + Math.random() * 300, 0.05, 'sine', 0.04); petPart({type:'drop', x:m.x + (Math.random() - 0.5) * 10, y:m.y, vx:(Math.random() - 0.5) * 1.5, vy:-1.5, g:0.15, life:26, max:26}); }
    } else if(ea.t % 9 === 0){
      tone(150 + Math.random() * 80, 0.05, 'square', 0.03);
      for(let k = 0; k < 2; k++) petPart({type:'crumb', color:ea.f.crumb, x:m.x + (Math.random() - 0.5) * 16, y:m.y + 4, vx:(Math.random() - 0.5) * 2.2, vy:-1 - Math.random(), g:0.25, life:40, max:40, rot:Math.random() * 6, vr:0.2});
    }
    h.wobV += Math.sin(ea.t * 0.6) * 0.06;
    if(ea.t >= ea.dur){ pet.eating = null; petReact(ea.f); }
  }
  // spicy: red, hopping, breathing fire, then begging for water
  if(pet.spicy > 0){
    pet.spicy--;
    if(pet.spicy > 130 && pet.hy >= 0 && pet.spicy % 2 === 0) petHop(5 + Math.random() * 2);
    const fireTop = pet.hot2 ? 320 : 230;
    if(pet.spicy > 150 && pet.spicy < fireTop){
      const m = petMouth();
      for(let k = 0; k < (pet.hot2 ? 3 : 2); k++) petPart({type:'fire', x:m.x, y:m.y, vx:(h.fx >= 0 ? 1 : -1) * (3 + Math.random() * (pet.hot2 ? 5 : 3)), vy:(Math.random() - 0.5) * 1.8, g:-0.05, life:26, max:26, s:(1 + Math.random()) * (pet.hot2 ? 1.4 : 1)});
      if(pet.spicy % 10 === 0) tone(90 + Math.random() * 40, 0.12, 'sawtooth', 0.035, 60);
      if(pet.hot2 && pet.spicy % 30 === 0) pet.shake = 10;
    }
    if(pet.spicy % 9 === 0) petPart({type:'steam', x:PET.x + (Math.random() - 0.5) * 60, y:PET.y + pet.hy - 105, vx:(Math.random() - 0.5) * 0.6, vy:-1.4, g:-0.01, life:40, max:40, s:0.8 + Math.random() * 0.6});
    if(pet.spicy === 130){ petSay(line('spicyBeg'), 130); setFace(h, 'o', 120); }
    if(pet.spicy === 0) pet.hot2 = false;
  }
  // little events and idle chatter when nothing happens
  updatePetEv();
  if(pet.dark){
    pet.darkT++;
    if(pet.darkT === 300 && !pet.ev && !petBusy() && !pet.phone && !pet.leaving) startEv('sleep', line('lampSleep'));
  }
  if(!pet.ev && !petBusy() && !pet.phone && !pet.leaving && !pet.bubble && pet.crossT <= 0 && pet.spicy <= 0 && pet.idleT > pet.nextEv) petIdleEvent();
  if(!pet.look && pet.lookAt){ pet.look = petLookAt(pet.lookAt.x, pet.lookAt.y); if(--pet.lookAt.t <= 0) pet.lookAt = null; }
  // hop physics
  pet.hvy += 0.55; pet.hy += pet.hvy;
  if(pet.hy >= 0){ if(pet.hvy > 2) h.wobV += pet.hvy * 0.05; pet.hy = 0; pet.hvy = 0; }
  // particles
  for(const p of pet.parts){
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    if(p.head && p.y > PET.y - 118 && p.vy > 0){ p.head = false; p.vy = -3.5; p.vx = 2.2; }     // bonk!
    if(p.bounce && p.y > PET.y + 4 && p.vy > 0){ p.y = PET.y + 4; p.vy *= -0.45; p.vx *= 0.7; if(Math.abs(p.vy) < 0.8){ p.vy = 0; p.g = 0; p.vr *= 0.5; } }
  }
  pet.parts = pet.parts.filter(p => p.life > 0);
  // XELIAX himself
  const ev = pet.ev, sleeping = !!ev && ev.type === 'sleep';
  stepCharAnim(h, {
    vx:0, vy:pet.hy < 0 ? pet.hvy : 0, onGround:pet.hy >= 0, facing:pet.turn > 0 ? -1 : 1,
    cheer:pet.dance > 0 || pet.spicy > 130 || (!!ev && (ev.type === 'juggle' || (ev.type === 'fly' && ev.stage === 'catch'))),
    phone:onPhone(),
    look:pet.look || (onPhone() ? {x:0.5, y:-0.55} : pet.idleT > 200 ? null : {x:0.2, y:0.1}),
    hurt:false, akimbo:pet.crossT > 0, think:!!ev && ev.type === 'muse',
    wave:pet.leaving > 0 || (!!ev && (ev.type === 'lonely' || (ev.type === 'bird' && ev.stage === 'sit' && ev.t > 20 && ev.t < 110))),
    sleep:sleeping, stretch:!!ev && ev.type === 'stretch' && ev.t < 75,
  });
  if(Math.abs(pet.lean) > 0.002) h.lean = lerp(h.lean, pet.lean, 0.35);
  // eyelids: closed when asleep, half closed when blissful or about to sneeze
  const lidT = sleeping ? (ev.t > 40 ? 1 : 0.4) : pet.lidT > 0 ? 0.8 : (ev && ev.type === 'sneeze' && ev.t < 72) ? Math.min(0.7, ev.t / 60) : 0;
  h.lid = (h.lid || 0) + (lidT - (h.lid || 0)) * (sleeping ? 0.04 : 0.25);
  h.sx = 1 + pet.full * 0.05 + (pet.shake > 0 ? Math.sin(pet.shake * 1.3) * 0.05 : 0);
  h.sy = 1 - pet.full * 0.02;
  if(sleeping) h.sy += Math.sin(frame * 0.05) * 0.03;
  if(ev && ev.type === 'stretch' && ev.t < 75){ const k = Math.sin(Math.min(1, ev.t / 40) * Math.PI / 2); h.sy *= 1 + 0.1 * k; h.sx *= 1 - 0.05 * k; }
}

function drawBaguette(x, y, len, rot, th){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const g = ctx.createLinearGradient(0, -th / 2, 0, th / 2);
  g.addColorStop(0, '#f6cf86'); g.addColorStop(0.55, '#d9963f'); g.addColorStop(1, '#9a5a20');
  rr(-len / 2, -th / 2, len, th, th / 2); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#5a3210'; ctx.lineWidth = Math.max(1, th * 0.12); ctx.stroke();
  ctx.strokeStyle = '#fbe6b8'; ctx.lineWidth = Math.max(1, th * 0.14); ctx.lineCap = 'round';
  for(let i = 0; i < 3; i++){ const cx = -len * 0.3 + i * len * 0.3; ctx.beginPath(); ctx.moveTo(cx - th * 0.35, th * 0.18); ctx.lineTo(cx + th * 0.2, -th * 0.25); ctx.stroke(); }
  ctx.restore();
}
function drawFood(id, x, y, s=1, rot=0){
  if(id === 'ficelle'){ drawFicelle(x, y, 38 * s, rot - 0.35, false, 7 * s); return; }
  if(id === 'pain'){ drawBaguette(x, y, 36 * s, rot - 0.35, 11 * s); return; }
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if(id === 'croissant'){
    const segs = [[-12, 4, 5.5, 4.5, -0.9], [-6.5, -1, 7, 6, -0.45], [0, -3, 8, 7, 0], [6.5, -1, 7, 6, 0.45], [12, 4, 5.5, 4.5, 0.9]];
    for(const [sx, sy, rx, ry, r] of segs){
      const g = ctx.createLinearGradient(0, sy - ry, 0, sy + ry);
      g.addColorStop(0, '#f8d58c'); g.addColorStop(1, '#c47a2c');
      ctx.beginPath(); ctx.ellipse(sx, sy, rx, ry, r, 0, TAU); ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = '#6a3c12'; ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath(); ctx.moveTo(-9, -5);

    ctx.bezierCurveTo(13, 9, 10, 9, 8, 6);
    ctx.bezierCurveTo(4, 0, -3, 0, -9, 1);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -8, 0, 8);
    g.addColorStop(0, '#ff6a4a'); g.addColorStop(1, '#b3121c');

    ctx.fillStyle = '#4caf3c'; ctx.beginPath(); ctx.ellipse(-10, -2, 3, 4, 0.4, 0, TAU); ctx.fill(); ctx.strokeStyle = '#1f5a18'; ctx.stroke();
    ctx.strokeStyle = '#2f7a24'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-11, -4); ctx.quadraticCurveTo(-14, -9, -11, -12); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(1, -4, 4, 1.2, 0.35, 0, TAU); ctx.fill();
  } else if(id === 'brocoli'){
    ctx.fillStyle = '#b8e08a'; ctx.strokeStyle = '#3f6a22'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-3, 2); ctx.lineTo(-2, 11); ctx.lineTo(3, 11); ctx.lineTo(4, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    for(const [bx, b2, r] of [[-6, -1, 5], [0, -5, 6], [6, -1, 5], [-2, 1, 4], [3, 1, 4]]){
      ctx.beginPath(); ctx.arc(bx, b2, r, 0, TAU); ctx.fillStyle = '#3f8f2c'; ctx.fill(); ctx.strokeStyle = '#1f4f16'; ctx.stroke();
    }

    }
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(-6, 0.5, 4, 1);

    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(-4.6, -7, 1.6, 13);
  }
  ctx.restore();
}

function drawPetRoom(){

  if(night){
    // stars and a croissant moon (it follows your real clock)
    ctx.fillStyle = '#ffffff';
    for(let k = 0; k < 14; k++){
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(frame * 0.05 + k * 1.7);
      ctx.fillRect(wx + 4 + (k * 53) % (ww - 8), wy + 6 + (k * 37) % 58, 1.7, 1.7);
    }

    ctx.fillStyle = '#152159'; ctx.beginPath(); ctx.arc(wx + 118, wy + 23, 11.5, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = '#fff6c9'; ctx.beginPath(); ctx.arc(wx + 112, wy + 28, 13, 0, TAU); ctx.fill();
    const cxo = (frame * 0.15) % (ww + 80) - 40;
    ctx.fillStyle = '#ffffff';
    for(const [dx, dy, r] of [[0, 0, 9], [10, -5, 11], [22, 0, 8]]){ ctx.beginPath(); ctx.arc(wx + cxo + dx, wy + 36 + dy, r, 0, TAU); ctx.fill(); }
  }
  ctx.fillStyle = night ? '#3c5a6a' : '#b7e6a8'; ctx.beginPath(); ctx.moveTo(wx, wy + wh); for(let x = 0; x <= ww; x += 6) ctx.lineTo(wx + x, wy + 74 + Math.sin(x * 0.05) * 8); ctx.lineTo(wx + ww, wy + wh); ctx.fill();
  ctx.fillStyle = night ? '#2c4a50' : '#88d07e'; ctx.beginPath(); ctx.moveTo(wx, wy + wh); for(let x = 0; x <= ww; x += 6) ctx.lineTo(wx + x, wy + 90 + Math.sin(x * 0.07 + 2) * 6); ctx.lineTo(wx + ww, wy + wh); ctx.fill();

function drawPetParts(){
  for(const p of pet.parts){
    const a = clamp(p.life / p.max, 0, 1);
    ctx.save(); ctx.globalAlpha = Math.min(1, a * 2);
    if(p.type === 'heart') heartIcon(p.x, p.y, 11 * p.s, '#ff5d8f', '#7a1236');
    else if(p.type === 'crumb'){ ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-1.6, -1.6, 3.2, 3.2); }
    else if(p.type === 'steam'){ ctx.globalAlpha = a * 0.5; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x, p.y, (4 + (1 - a) * 8) * p.s, 0, TAU); ctx.fill(); }
    else if(p.type === 'fire'){
      const r = (3 + (1 - a) * 7) * p.s;
      ctx.globalAlpha = a;
      ctx.fillStyle = a > 0.6 ? '#fff3a0' : a > 0.3 ? '#ffb23a' : '#ff5a1f';
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    }
    else if(p.type === 'star'){ ctx.fillStyle = '#ffe066'; star(p.x, p.y, 4.5 * p.s, p.rot); }
    else if(p.type === 'drop'){ ctx.fillStyle = '#7fd0ff'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, TAU); ctx.fill(); }
    else if(p.type === 'note'){
      ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(Math.sin(p.life * 0.2) * 0.25);
      ctx.fillStyle = '#5a2a10'; ctx.strokeStyle = '#5a2a10'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, 0, 3.8, 2.7, -0.4, 0, TAU); ctx.fill();
      ctx.fillRect(2.6, -13, 1.5, 13);
      ctx.beginPath(); ctx.moveTo(4, -13); ctx.quadraticCurveTo(9.5, -10, 7.5, -4.5); ctx.stroke();
    }
    else if(p.type === 'pit'){ ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = '#8a5a2a'; ctx.beginPath(); ctx.ellipse(0, 0, 2.6, 4, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = '#4a2a10'; ctx.lineWidth = 1; ctx.stroke(); }
    else if(p.type === 'food') drawFood(p.id, p.x, p.y, 1, p.rot);
    else if(p.type === 'z'){ ctx.globalAlpha = Math.min(1, a * 1.5); outlined('z', p.x, p.y, (14 + (1 - a) * 10) * p.s, '#ffffff', '#3a2a6a', 3, FU, 700); }
    else if(p.type === 'flour'){ ctx.globalAlpha = a * 0.75; ctx.fillStyle = '#fffaf0'; ctx.beginPath(); ctx.arc(p.x, p.y, (2 + (1 - a) * 6) * p.s, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

    const bx = PET.x + 62, by = 122 - th / 2 + pet.hy * 0.5;

    ctx.translate(bx, by + th); ctx.scale(s, s); ctx.translate(-bx, -(by + th));
    rr(bx, by, tw, th, 14); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.strokeStyle = '#1d1442'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx + 16, by + th - 1); ctx.lineTo(bx - 6, by + th + 16); ctx.lineTo(bx + 32, by + th - 1); ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx + 16, by + th); ctx.lineTo(bx - 6, by + th + 16); ctx.lineTo(bx + 32, by + th); ctx.stroke();
    lines.forEach((ln, i) => txt(ln, bx + 14, by + 22 + i * 17, 13, '#1d1442', 600, 'left'));
    ctx.restore();
  }
  // title and belly meter
  heading('Le coin de XELIAX', 22, 36, 21, '#5a2a10', 'left', false);
  txt('Ventre', 22, 58, 12, '#7a4a26', 600, 'left');
  for(let i = 0; i < 5; i++){
    const full = pet.full >= i + 1 ? 1 : pet.full > i ? 0.6 : 0.25;

  }
  // back button

  keycap(backKey, bxx + 8, 31);
  txt('Retour', bxx + 8 + bkw + 9, 30.5, 12.5, '#ffffff', 600, 'left');
  // the food tray
  for(let i = 0; i < FOODS.length; i++){
    const x = trayX(i), sel = i === pet.sel && !TOUCH;

    ctx.fillStyle = sel ? '#fff7e6' : 'rgba(255,244,224,0.88)'; ctx.fill();
    ctx.strokeStyle = sel ? '#5a2a10' : 'rgba(90,42,16,0.45)'; ctx.lineWidth = sel ? 2 : 1.2; ctx.stroke();

    if(FOODS[i].phone && pet.phone && pet.phone.stage === 'incoming' && pet.phone.t % 45 < 26){
      const cx = x + TRAY.w / 2, cy = TRAY.y + 22 + lift;
      ctx.strokeStyle = '#e5352f'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      for(let k = 0; k < 2; k++){
        ctx.beginPath(); ctx.arc(cx, cy, 15 + k * 5, -0.55, 0.55); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, 15 + k * 5, Math.PI - 0.55, Math.PI + 0.55); ctx.stroke();
      }
    }
  }
  const ph = pet.phone;
  let hint = null;
  if(ph && ph.stage === 'incoming') hint = TOUCH ? 'Le téléphone sonne : touche-le pour qu\'il décroche !' : 'Le téléphone sonne : clique dessus pour qu\'il décroche !';
  else if(ph && ph.stage === 'listen' && ph.t > 40) hint = 'Pose ta question dans ta tête, puis appuie encore sur le téléphone';
  else if(ev && ev.type === 'sleep' && ev.t > 240) hint = TOUCH ? 'Chut… il dort. Touche-le pour le réveiller.' : 'Chut… il dort. Clique sur lui pour le réveiller.';
  else if(ev && ev.type === 'fly' && ev.stage === 'buzz' && ev.t > 60) hint = TOUCH ? 'Touche la mouche !' : 'Clique sur la mouche !';
  else if(pet.hint > 0) hint = TOUCH ? 'Touche un aliment, le téléphone, ou XELIAX' : 'Clique sur un aliment, le téléphone ou XELIAX  (◀ ▶ et Espace pour choisir, E pour chatouiller)';
  if(hint){
    hint = frTypo(hint);
    ctx.font = `600 11px ${FU}`;
    const hw = ctx.measureText(hint).width + 22;

    txt(hint, W / 2, 287, 11, '#5a2a10', 600);
    ctx.restore();
  }
}
// mix two #rrggbb colours
function mixHex(a, b, k){
  const A = hexRGB(a), B = hexRGB(b);
  const c = A.map((v, i) => Math.round(v + (B[i] - v) * k));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}

// =====================================================================
//  SEASON 2 ENDING: a close-up cinematic once XELIAX has the ficelle back
//   A  the camera closes in on him, in slow motion
//   B  extreme close-up: sparkling eyes, tears of joy
//   C  a picnic at sunset with all his friends (and the magpie)
//   D  the first bite, a wink, a heart-shaped iris
//   E  "Fin"
// =====================================================================
const END = {t:0, hero:makeCharAnim(), parts:[], skippable:false, friends:[], pieces:[], pie:null};
const END_LEN = 980;
const END_SHOTS = {A:0, B:170, C:370, D:680, E:860};
function startEnding(){
  setState('ending');
  const E = END;
  E.t = 0; E.parts = []; E.pieces = [];
  E.fx = player.x + player.w / 2; E.fy = player.y + player.h / 2;
  E.cx0 = camX; E.cy0 = camY;
  E.hero = makeCharAnim(); E.hero.fx = 1;
  E.skippable = !!save.endingSeen;
  save.endingSeen = true; persist();
  E.friends = [
    {who:'farine', x0:-40, tx:190, t:0, blink:0, near:0},
    {who:'gaston', x0:-90, tx:118, t:1, blink:0, near:0},
    {who:'olivia', x0:W + 40, tx:452, t:2, blink:0, near:0},
    {who:'levain', x0:W + 90, tx:526, t:3, blink:0, near:0},
  ];
  E.pie = {x:W + 60, y:-60, w:48, h:40, phase:1, state:'hover', face:-1, t:0, hitT:0, inv:0, lost:true, happy:0};
  timerRunning = false;
}
function endPart(o){ END.parts.push(Object.assign({vx:0, vy:0, g:0.1, life:60, max:60, s:1, rot:0, vr:0}, o)); }
function endTune(notes, gap, type='triangle', v=0.045){ notes.forEach((f, i) => { if(f) tone(f, gap * 0.9, type, v, null, i * gap); }); }

function updateEnding(){
  const E = END, t = ++E.t, h = E.hero;
  if(E.skippable && t > 30 && t < END_SHOTS.E && input.jumpPressed){ E.t = END_SHOTS.E; E.parts = []; }
  // ---- A: slow motion in the arena
  if(t < END_SHOTS.B){
    if(t % 2 === 0){ updateParticles(); }
    stepCharAnim(anim, {vx:0, vy:0, onGround:true, facing:player.facing, cheer:true});
    if(t === 1) endTune([392, 523, 659, 784], 0.22, 'sine', 0.05);
    if(t % 18 === 0) confetti(player.x + player.w / 2, player.y - 10, 6);
    if(t === 150){ SFX.key(); }
  }
  // ---- B: close-up
  else if(t < END_SHOTS.C){
    const k = t - END_SHOTS.B;
    if(k === 1){ SFX.win(); setFace(h, 'open', 400); E.parts = []; }
    stepCharAnim(h, {vx:0, vy:0, onGround:true, facing:1, look:{x:0.55, y:-0.45}});
    h.sx = 1 + Math.sin(k * 0.25) * 0.03; h.sy = 1 - Math.sin(k * 0.25) * 0.03;
    if(k % 7 === 0) for(const ex of [-28, 26]) endPart({type:'tear', x:W / 2 + ex, y:178, vx:(ex > 0 ? 1 : -1) * (0.6 + Math.random()), vy:-1.5 - Math.random(), g:0.22, life:50, max:50});
    if(k % 12 === 0) endPart({type:'heart', x:W / 2 + (Math.random() - 0.5) * 300, y:330, vx:(Math.random() - 0.5) * 0.8, vy:-1.4 - Math.random(), g:-0.01, life:110, max:110, s:0.8 + Math.random() * 0.8});
    if(k === 40){ tone(880, 0.3, 'sine', 0.05, 1320); }
  }
  // ---- C: the picnic
  else if(t < END_SHOTS.D){
    const k = t - END_SHOTS.C;
    if(k === 1){ E.parts = []; setFace(h, 'smile', 0); endTune([523, 659, 784, 659, 698, 880, 784, 0, 659, 784, 1047], 0.2); }
    for(const f of E.friends){ f.t += 0.05; if(f.blink > 0) f.blink--; else if(Math.random() < 0.01) f.blink = 7; }
    const share = k >= 120 && k < 150;
    stepCharAnim(h, {vx:0, vy:k > 95 && k < 125 ? -2 : 0, onGround:true, facing:k > 230 ? 1 : (Math.floor(k / 60) % 2 ? -1 : 1), cheer:share, wave:k < 60});
    if(k === 100){ SFX.power(); }
    if(k === 130){
      // the ficelle in five pieces: one for each friend, one for later
      SFX.crack();
      for(let i = 0; i < 4; i++){ const f = E.friends[i]; E.pieces.push({x:W / 2 + 14, y:258, x1:f.tx, y1:276, t:0, d:40 + i * 6, to:i}); }
      for(let i = 0; i < 12; i++) endPart({type:'star', x:W / 2 + 14, y:256, vx:(Math.random() - 0.5) * 4, vy:-1 - Math.random() * 2, g:0.05, life:40, max:40, s:1});
    }
    if(k === 170){ SFX.warn(); }
    const P = E.pie;
    if(k >= 170){
      // the magpie comes down, ashamed
      const q = clamp((k - 170) / 60, 0, 1);
      P.x = lerp(W + 60, 560, easeOutCubic(q)); P.y = lerp(-60, 248, easeOutCubic(q)) - Math.sin(q * Math.PI) * 30;
      P.t++; P.state = q < 1 ? 'hover' : 'perch';
    }
    if(k === 236){ E.pieces.push({x:W / 2 + 14, y:258, x1:584, y1:262, t:0, d:44, to:'pie'}); SFX.menu(); }
    for(const p of E.pieces){
      p.t++;
      if(p.t === p.d){
        if(p.to === 'pie'){ P.happy = 1; SFX.coin(); for(let i = 0; i < 8; i++) endPart({type:'heart', x:584, y:250, vx:(Math.random() - 0.5) * 1.6, vy:-1 - Math.random(), g:-0.01, life:80, max:80, s:0.8}); }
        else { tone(660 + p.to * 110, 0.1, 'triangle', 0.04); }
      }
    }
    if(k > 250 && k % 9 === 0){ tone(150 + Math.random() * 80, 0.05, 'square', 0.02); endPart({type:'crumb', x:[190, 118, 452, 526, W / 2, 584][Math.floor(Math.random() * 6)] + (Math.random() - 0.5) * 10, y:262, vx:(Math.random() - 0.5) * 2, vy:-1.5, g:0.2, life:30, max:30}); }
    if(k % 6 === 0) endPart({type:'firefly', x:Math.random() * W, y:180 + Math.random() * 140, vx:(Math.random() - 0.5) * 0.4, vy:-0.2, g:0, life:120, max:120});
  }
  // ---- D: the bite, close up

}

function drawEndParts(){

    else if(p.type === 'star'){ ctx.fillStyle = '#ffe066'; star(p.x, p.y, 4 * p.s, frame * 0.1); }
    else if(p.type === 'crumb'){ ctx.fillStyle = '#d9a05a'; ctx.fillRect(p.x - 1.8, p.y - 1.8, 3.6, 3.6); }

}

    // far islands of the sky world, and the hill

    g.addColorStop(0, '#ffd9a8'); g.addColorStop(1, '#9a4a7a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    drawHero(h, W / 2 - 30, 340, 5.6, {});
    // his piece of ficelle, getting shorter
    const len = k < 44 ? 76 : 52;
    const bx = (k < 44 ? lerp(W / 2 + 150, W / 2 + 70, easeInOutCubic(clamp(k / 40, 0, 1))) : W / 2 + 82), by = 248;
    drawFicelle(bx, by, len, -0.1, true, 22);

    if(k >= 44 && k < 70) endCaption('CRUNCH !', 92, END_SHOTS.D + 44, 42, '#ffffff');
    drawEndParts();
    // heart-shaped iris closing on his face
    if(k > 140){
      const q = easeInCubic(clamp((k - 140) / 40, 0, 1)), s = lerp(900, 0, q);

      ctx.beginPath(); ctx.rect(0, 0, W, H);

      ctx.bezierCurveTo(hx + s * 0.5, hy - s * 0.02, hx, hy, hx, hy + s * 0.3);

    ctx.strokeStyle = '#ff6b8a'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(mx - 5, my + 5); ctx.lineTo(mx + 5, my - 5); ctx.stroke();
  }

  if(boss && boss.alive && !boss.fleeing){

    txt(boss.name, bx + 2, by + 10, 11.5, '#ffd6e0', 700, 'left');

      g.addColorStop(1, boss.inv > 0 && (boss.mode === 'arena' || boss.mode === 'ascent') ? '#8ea2e0' : '#e0244a');

}

function drawFlyers(){
  for(const f of flyers){
    const t = easeInCubic(f.t);
    const tx = hud.coinX, ty = hud.coinY;
    const mx = (f.sx + tx) / 2, my = Math.min(f.sy, ty) - 60;
    const x = (1 - t) * (1 - t) * f.sx + 2 * (1 - t) * t * mx + t * t * tx;
    const y = (1 - t) * (1 - t) * f.sy + 2 * (1 - t) * t * my + t * t * ty;
    coinIcon(x, y, 6 * (1 - 0.35 * t), Math.cos(frame * 0.3));
  }
}

function drawBanner(){
  if(state !== 'play' || bannerT <= 0) return;
  const max = rIndex === 0 ? 240 : 150, t = max - bannerT;
  if(rIndex === 0){
    const a = Math.min(clamp(t / 20, 0, 1), clamp(bannerT / 24, 0, 1));
    ctx.save();
    ctx.globalAlpha = a;
    const band = ctx.createLinearGradient(0, 0, W, 0);
    band.addColorStop(0, 'rgba(10,6,26,0)'); band.addColorStop(0.18, 'rgba(10,6,26,0.62)'); band.addColorStop(0.82, 'rgba(10,6,26,0.62)'); band.addColorStop(1, 'rgba(10,6,26,0)');
    ctx.fillStyle = band; ctx.fillRect(0, 84, W, 144);
    txt(chName(chIndex), W / 2, 110, 13, CH_ACCENT[chIndex], 600);
    // the chapter name rises into place letter by letter
    const name = chapter.name;
    ctx.font = `400 38px ${FD}`;
    const ws = [...name].map(ch => ctx.measureText(ch).width);
    let x = W / 2 - ws.reduce((p, c) => p + c, 0) / 2;
    [...name].forEach((ch, i) => {
      const k = easeOutCubic(clamp((t - 6 - i * 1.5) / 18, 0, 1));
      ctx.save(); ctx.globalAlpha = a * k;
      heading(ch, x + ws[i] / 2, 152 + (1 - k) * 12, 38, '#ffffff');
      ctx.restore();
      x += ws[i];
    });
    txt(room.name, W / 2, 176, 13, '#ddd6ff', 500);
    const k2 = clamp((t - 30) / 20, 0, 1);
    ctx.globalAlpha = a * k2;
    txt(STORY[chIndex] || '', W / 2, 203, 13.5, '#f3ead6', 500);
    if(chIndex === 0 && !timerRunning){ ctx.globalAlpha = a * k2 * 0.85; txt('Le chrono démarre à ton premier mouvement', W / 2, 221, 11.5, '#bfb6f0', 500); }
    ctx.restore();
  } else {
    const inP = easeOutCubic(clamp(t / 18, 0, 1)), outP = easeInCubic(clamp(1 - bannerT / 18, 0, 1));
    const bx = lerp(-290, 16, inP) - outP * 310, by = 78;
    ctx.save();
    rr(bx, by, 268, 46, 14); ctx.fillStyle = 'rgba(14,8,34,0.74)'; ctx.fill();
    ctx.strokeStyle = rgba(CH_ACCENT[chIndex], 0.7); ctx.lineWidth = 1.2; ctx.stroke();
    txt(room.label || `Salle ${roomTag()}`, bx + 16, by + 18, 11.5, CH_ACCENT[chIndex], 600, 'left');
    heading(room.name, bx + 16, by + 38, 17, '#ffffff', 'left');
    ctx.restore();
  }
}

function drawToast(){
  if(toast.t <= 0 || state !== 'play') return;
  const el = toast.max - toast.t;
  const inP = clamp(el / 14, 0, 1), outA = clamp(toast.t / 12, 0, 1);
  ctx.font = `600 13px ${FU}`;
  const tw = ctx.measureText(toast.text).width + 36;
  // messages drop in under the HUD (or under the boss bar) so they never cover XELIAX
  const baseY = state === 'play' && boss && boss.alive && !boss.fleeing ? 94 : 52;
  const y = baseY - 22 * (1 - easeOutCubic(inP));
  ctx.save();
  ctx.globalAlpha = outA * Math.min(1, inP * 2);
  rr(W / 2 - tw / 2, y - 16, tw, 26, 13); ctx.fillStyle = 'rgba(14,9,34,0.86)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = CH_ACCENT[chIndex];
  ctx.beginPath(); ctx.arc(W / 2 - tw / 2 + 13, y - 3, 3.5, 0, TAU); ctx.fill();
  txt(toast.text, W / 2 + 7, y + 1.5, 13, '#ffffff', 600);
  ctx.restore();
}

function keycap(label, x, y){
  ctx.font = `700 11px ${FU}`;
  const w = Math.max(19, ctx.measureText(label).width + 13);
  rr(x, y - 14, w, 19, 5); ctx.fillStyle = '#f4f1ff'; ctx.fill();
  ctx.strokeStyle = '#b9aee8'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(29,20,66,0.25)'; rr(x, y + 2, w, 3, 2); ctx.fill();

}
// a centred row of keycaps and words, e.g. [Espace] jouer
function promptLine(items, y, color='#ffffff'){
  const kw = it => { ctx.font = `700 11px ${FU}`; return Math.max(19, ctx.measureText(it.key).width + 13); };
  const tw = it => { ctx.font = `500 12.5px ${FU}`; return ctx.measureText(it.text).width; };
  const widths = items.map(it => it.key ? kw(it) : it.gap ? it.gap : tw(it));
  const total = widths.reduce((a, b) => a + b, 0) + (items.length - 1) * 6;
  let x = W / 2 - total / 2;
  items.forEach((it, i) => {
    if(it.key) keycap(it.key, x, y);
    else if(it.text) txt(it.text, x, y, 12.5, color, 500, 'left');
    x += widths[i] + 6;
  });
}
